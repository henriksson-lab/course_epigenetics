<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 360" width="1120" height="360" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7a"/></marker></defs>
<rect width="1120" height="360" fill="white"/>
<rect x="230" y="20" width="220" height="60" rx="10" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="1.5"/>
<text x="340.0" y="44" font-size="17" text-anchor="middle" font-weight="bold" fill="#1b2a3a">group mean</text>
<text x="340.0" y="66" font-size="15" text-anchor="middle" fill="#1b2a3a">μ = 0.70</text>
<line x1="340" y1="82" x2="130" y2="128" stroke="#5b6b7a" stroke-width="2" marker-end="url(#ag)"/>
<rect x="40" y="132" width="180" height="60" rx="10" fill="#f4f6f8" stroke="#1b2a3a" stroke-width="1.5"/>
<text x="130.0" y="156" font-size="17" text-anchor="middle" font-weight="bold" fill="#1b2a3a">sample</text>
<text x="130.0" y="178" font-size="15" text-anchor="middle" fill="#1b2a3a">true level 0.62</text>
<line x1="130" y1="194" x2="130" y2="236" stroke="#5b6b7a" stroke-width="2" marker-end="url(#ag)"/>
<rect x="40" y="240" width="180" height="60" rx="10" fill="white" stroke="#1b2a3a" stroke-width="1.5"/>
<text x="130.0" y="264" font-size="17" text-anchor="middle" font-weight="bold" fill="#1b2a3a">reads</text>
<text x="130.0" y="286" font-size="15" text-anchor="middle" fill="#1b2a3a">8 / 14  (β = 0.57)</text>
<line x1="340" y1="82" x2="340" y2="128" stroke="#5b6b7a" stroke-width="2" marker-end="url(#ag)"/>
<rect x="250" y="132" width="180" height="60" rx="10" fill="#f4f6f8" stroke="#1b2a3a" stroke-width="1.5"/>
<text x="340.0" y="156" font-size="17" text-anchor="middle" font-weight="bold" fill="#1b2a3a">sample</text>
<text x="340.0" y="178" font-size="15" text-anchor="middle" fill="#1b2a3a">true level 0.78</text>
<line x1="340" y1="194" x2="340" y2="236" stroke="#5b6b7a" stroke-width="2" marker-end="url(#ag)"/>
<rect x="250" y="240" width="180" height="60" rx="10" fill="white" stroke="#1b2a3a" stroke-width="1.5"/>
<text x="340.0" y="264" font-size="17" text-anchor="middle" font-weight="bold" fill="#1b2a3a">reads</text>
<text x="340.0" y="286" font-size="15" text-anchor="middle" fill="#1b2a3a">11 / 13  (β = 0.85)</text>
<line x1="340" y1="82" x2="550" y2="128" stroke="#5b6b7a" stroke-width="2" marker-end="url(#ag)"/>
<rect x="460" y="132" width="180" height="60" rx="10" fill="#f4f6f8" stroke="#1b2a3a" stroke-width="1.5"/>
<text x="550.0" y="156" font-size="17" text-anchor="middle" font-weight="bold" fill="#1b2a3a">sample</text>
<text x="550.0" y="178" font-size="15" text-anchor="middle" fill="#1b2a3a">true level 0.71</text>
<line x1="550" y1="194" x2="550" y2="236" stroke="#5b6b7a" stroke-width="2" marker-end="url(#ag)"/>
<rect x="460" y="240" width="180" height="60" rx="10" fill="white" stroke="#1b2a3a" stroke-width="1.5"/>
<text x="550.0" y="264" font-size="17" text-anchor="middle" font-weight="bold" fill="#1b2a3a">reads</text>
<text x="550.0" y="286" font-size="15" text-anchor="middle" fill="#1b2a3a">14 / 19  (β = 0.74)</text>
<text x="700" y="142" font-size="16" font-weight="bold" fill="#1b2a3a">1 · biological variation</text>
<text x="700" y="166" font-size="15" fill="#1b2a3a">samples differ around the group mean:</text>
<text x="700" y="188" font-size="15" fill="#1b2a3a">true level ~ Beta(mean μ, dispersion φ)</text>
<text x="700" y="250" font-size="16" font-weight="bold" fill="#1b2a3a">2 · sampling of reads</text>
<text x="700" y="274" font-size="15" fill="#1b2a3a">M ~ Binomial(N, true level)</text>
<text x="700" y="296" font-size="15" fill="#1b2a3a">variance shrinks with coverage N</text>
<line x1="40" y1="318" x2="1090" y2="318" stroke="#dfe6ec" stroke-width="1.5"/>
<text x="40" y="344" font-size="15" fill="#1b2a3a">together: beta-binomial,  Var(M) = N p (1 − p) [1 + (N − 1) φ]</text>
<text x="700" y="344" font-size="15" fill="#5b6b7a">RNA-seq: gamma + Poisson = negative binomial</text>
</svg>