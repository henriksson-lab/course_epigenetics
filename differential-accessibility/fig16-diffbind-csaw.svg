<line x1="910.0" y1="229.0" x2="928.0" y2="229.0" stroke="#5b6b7a" stroke-width="2" marker-end="url(#agrey)"/>
<rect x="930.0" y="206.0" width="158.0" height="46.0" rx="8" fill="#f4f6f8" stroke="#e67e22" stroke-width="1.8"/>
<text x="1009.0" y="235.0" font-size="16" fill="#1b2a3a" text-anchor="middle" font-weight="bold">edgeR QL</text>
<text x="1009.0" y="274.0" font-size="14" fill="#5b6b7a" text-anchor="middle">→ merge to regions</text>
<text x="30.0" y="318.0" font-size="14" fill="#5b6b7a" text-anchor="start">* DiffBind 3 default; DESeq2 or TMM size factors are options. This course: the DiffBind route by hand (consensus peaks → counts → DESeq2).</text>
