<text x="712.0" y="154.0" font-size="15" fill="#2e8b57" text-anchor="start" font-weight="bold">nearest: gene B</text>
<path d="M600,120 C640,25 840,25 880,168" stroke="#c0392b" stroke-width="2.5" fill="none" marker-end="url(#ared)"/>
<text x="745.0" y="40.0" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="bold">true target? gene C, via a 3D contact</text>
<text x="40.0" y="280.0" font-size="15" fill="#1b2a3a" text-anchor="start">1. The nearest TSS is a guess: enhancers often skip genes, and one enhancer can regulate several.</text>
<text x="40.0" y="304.0" font-size="15" fill="#1b2a3a" text-anchor="start">2. Intronic peaks are near their host gene by construction; in gene deserts the nearest TSS can be 1 Mb away.</text>
