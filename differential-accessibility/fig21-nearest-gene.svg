<rect x="520.0" y="192.0" width="12.0" height="16.0" rx="0" fill="#1b2a3a" stroke="none" stroke-width="1.5"/>
<rect x="688.0" y="192.0" width="12.0" height="16.0" rx="0" fill="#1b2a3a" stroke="none" stroke-width="1.5"/>
<path d="M700,192 L700,176 L684,176" stroke="#1b2a3a" stroke-width="2" fill="none" marker-end="url(#aink)"/>
<text x="560.0" y="228.0" font-size="15" fill="#1b2a3a" text-anchor="middle" font-style="italic">gene B</text>
<line x1="880.0" y1="200.0" x2="1060.0" y2="200.0" stroke="#1b2a3a" stroke-width="2"/>
<rect x="880.0" y="192.0" width="20.0" height="16.0" rx="0" fill="#1b2a3a" stroke="none" stroke-width="1.5"/>
<rect x="960.0" y="192.0" width="12.0" height="16.0" rx="0" fill="#1b2a3a" stroke="none" stroke-width="1.5"/>
