<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 372" width="1120" height="372" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="aink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/></marker><marker id="agrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7a"/></marker><marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="agreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="ablue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2a6f97"/></marker><marker id="aorange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e67e22"/></marker></defs>
<rect width="1120" height="372" fill="#ffffff"/>
<text x="30.0" y="30.0" font-size="17" fill="#1b2a3a" text-anchor="start" font-weight="bold">Same depth, different signal-to-noise</text>
<text x="150.0" y="82.0" font-size="16" fill="#1b2a3a" text-anchor="end" font-weight="bold">library 1</text>
<rect x="165.0" y="60.0" width="160.0" height="34.0" rx="0" fill="#2e8b57" stroke="none" stroke-width="1.5"/>
<rect x="325.0" y="60.0" width="240.0" height="34.0" rx="0" fill="#cfd6dd" stroke="none" stroke-width="1.5"/>
<text x="245.0" y="83.0" font-size="15" fill="white" text-anchor="middle" font-weight="bold">8 M</text>
<text x="445.0" y="83.0" font-size="15" fill="#1b2a3a" text-anchor="middle">12 M</text>
<text x="580.0" y="83.0" font-size="16" fill="#1b2a3a" text-anchor="start" font-weight="bold">FRiP = 40%</text>
<text x="150.0" y="132.0" font-size="16" fill="#1b2a3a" text-anchor="end" font-weight="bold">library 2</text>
<rect x="165.0" y="110.0" width="40.0" height="34.0" rx="0" fill="#2e8b57" stroke="none" stroke-width="1.5"/>
<rect x="205.0" y="110.0" width="360.0" height="34.0" rx="0" fill="#cfd6dd" stroke="none" stroke-width="1.5"/>
<text x="185.0" y="133.0" font-size="15" fill="white" text-anchor="middle" font-weight="bold">2 M</text>
<text x="385.0" y="133.0" font-size="15" fill="#1b2a3a" text-anchor="middle">18 M</text>
<text x="580.0" y="133.0" font-size="16" fill="#1b2a3a" text-anchor="start" font-weight="bold">FRiP = 10%</text>
<text x="165.0" y="170.0" font-size="15" fill="#5b6b7a" text-anchor="start">20 M fragments each:</text>
<text x="318.0" y="170.0" font-size="15" fill="#2e8b57" text-anchor="start" font-weight="bold">in peaks</text>
<text x="390.0" y="170.0" font-size="15" fill="#5b6b7a" text-anchor="start" font-weight="bold">background</text>
<text x="740.0" y="30.0" font-size="17" fill="#1b2a3a" text-anchor="start" font-weight="bold">A typical peak</text>
<text x="740.0" y="52.0" font-size="15" fill="#5b6b7a" text-anchor="start">fragments counted in it</text>
<rect x="770.0" y="80.0" width="60.0" height="80.0" rx="0" fill="#2e8b57" stroke="none" stroke-width="1.5"/>
<rect x="900.0" y="140.0" width="60.0" height="20.0" rx="0" fill="#2e8b57" stroke="none" stroke-width="1.5"/>
<line x1="740.0" y1="160.0" x2="1000.0" y2="160.0" stroke="#1b2a3a" stroke-width="1.5"/>
<text x="800.0" y="72.0" font-size="15" fill="#1b2a3a" text-anchor="middle" font-weight="bold">80</text>
<text x="930.0" y="132.0" font-size="15" fill="#1b2a3a" text-anchor="middle" font-weight="bold">20</text>
<text x="800.0" y="180.0" font-size="15" fill="#1b2a3a" text-anchor="middle">library 1</text>
<text x="930.0" y="180.0" font-size="15" fill="#1b2a3a" text-anchor="middle">library 2</text>
<line x1="30.0" y1="212.0" x2="1090.0" y2="212.0" stroke="#d0d7de" stroke-width="1.2"/>
<text x="30.0" y="236.0" font-size="15" fill="#5b6b7a" text-anchor="start" font-weight="bold">normalise by</text>
<text x="330.0" y="236.0" font-size="15" fill="#5b6b7a" text-anchor="start" font-weight="bold">this peak, library 1 / library 2</text>
<text x="640.0" y="236.0" font-size="15" fill="#5b6b7a" text-anchor="start" font-weight="bold">right if the FRiP difference is …</text>
<text x="30.0" y="268.0" font-size="15" fill="#1b2a3a" text-anchor="start">total fragments (CPM)</text>
<text x="330.0" y="268.0" font-size="15" fill="#c0392b" text-anchor="start" font-weight="bold">4-fold up: every peak 'differs'</text>
<text x="640.0" y="268.0" font-size="15" fill="#1b2a3a" text-anchor="start">biology: library 2 truly has fewer / weaker open sites</text>
<text x="30.0" y="300.0" font-size="15" fill="#1b2a3a" text-anchor="start">reads in peaks, median ratio, TMM</text>
<text x="330.0" y="300.0" font-size="15" fill="#2e8b57" text-anchor="start" font-weight="bold">1: no change</text>
<text x="640.0" y="300.0" font-size="15" fill="#1b2a3a" text-anchor="start">technical: library 2 is just noisier</text>
<text x="30.0" y="358.0" font-size="15" fill="#c0392b" text-anchor="start" font-weight="bold">The counts alone cannot tell the two apart: decide from the biology, QC and controls.</text>
</svg>
