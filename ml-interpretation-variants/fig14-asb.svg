<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 380" width="1120" height="380" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7a"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="ahgr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2a6f97"/></marker><marker id="aho" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e67e22"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b4fa0"/></marker></defs>
<rect width="1120" height="380" fill="#ffffff"/>
<text x="20.0" y="30.0" font-size="17" fill="#1b2a3a" text-anchor="start" font-weight="bold">One heterozygous person, one cell sample: compare the two alleles</text>
<text x="20.0" y="100.0" font-size="15" fill="#1b2a3a" text-anchor="start" font-weight="bold">allele 1</text>
<line x1="110.0" y1="95.0" x2="560.0" y2="95.0" stroke="#1b2a3a" stroke-width="3"/>
<rect x="310.0" y="83.0" width="70.0" height="24.0" rx="4" fill="#ffffff" stroke="#5b6b7a" stroke-width="1.2"/>
<text x="345.0" y="102.0" font-size="18" fill="#d48a00" text-anchor="middle" font-weight="bold" font-family="Courier New, monospace">G</text>
<ellipse cx="345" cy="67" rx="44" ry="20" fill="#8c564b" fill-opacity="0.8"/>
<text x="345.0" y="72.0" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">CTCF</text>
<line x1="250.0" y1="115.0" x2="300.0" y2="115.0" stroke="#8c564b" stroke-width="3"/>
<line x1="275.0" y1="122.0" x2="325.0" y2="122.0" stroke="#8c564b" stroke-width="3"/>
<line x1="300.0" y1="129.0" x2="350.0" y2="129.0" stroke="#8c564b" stroke-width="3"/>
<line x1="325.0" y1="115.0" x2="375.0" y2="115.0" stroke="#8c564b" stroke-width="3"/>
<line x1="350.0" y1="122.0" x2="400.0" y2="122.0" stroke="#8c564b" stroke-width="3"/>
<line x1="375.0" y1="129.0" x2="425.0" y2="129.0" stroke="#8c564b" stroke-width="3"/>
<line x1="400.0" y1="115.0" x2="450.0" y2="115.0" stroke="#8c564b" stroke-width="3"/>
<text x="20.0" y="195.0" font-size="15" fill="#1b2a3a" text-anchor="start" font-weight="bold">allele 2</text>
<line x1="110.0" y1="190.0" x2="560.0" y2="190.0" stroke="#1b2a3a" stroke-width="3"/>
<rect x="310.0" y="178.0" width="70.0" height="24.0" rx="4" fill="#ffffff" stroke="#5b6b7a" stroke-width="1.2"/>
<text x="345.0" y="197.0" font-size="18" fill="#c0392b" text-anchor="middle" font-weight="bold" font-family="Courier New, monospace">T</text>
<text x="345.0" y="166.0" font-size="14" fill="#5b6b7a" text-anchor="middle">no binding</text>
<line x1="250.0" y1="210.0" x2="300.0" y2="210.0" stroke="#8c564b" stroke-width="3"/>
<line x1="310.0" y1="217.0" x2="360.0" y2="217.0" stroke="#8c564b" stroke-width="3"/>
<line x1="370.0" y1="210.0" x2="420.0" y2="210.0" stroke="#8c564b" stroke-width="3"/>
<text x="590.0" y="100.0" font-size="15" fill="#1b2a3a" text-anchor="start" font-weight="bold">ChIP reads over the SNP</text>
<text x="590.0" y="124.0" font-size="15" fill="#1b2a3a" text-anchor="start">G: 42,  T: 18  (70% G)</text>
<text x="590.0" y="164.0" font-size="15" fill="#1b2a3a" text-anchor="start" font-weight="bold">Same SNP in the input / genomic DNA</text>
<text x="590.0" y="188.0" font-size="15" fill="#1b2a3a" text-anchor="start">G: 31,  T: 29  (no copy-number imbalance)</text>
<text x="590.0" y="228.0" font-size="15" fill="#c0392b" text-anchor="start" font-weight="bold">→ allele-specific binding (ASB), G preferred:</text>
<text x="590.0" y="250.0" font-size="15" fill="#c0392b" text-anchor="start">the reference allele binds CTCF better</text>
<line x1="20.0" y1="285.0" x2="1100.0" y2="285.0" stroke="#eaf1f7" stroke-width="2"/>
<text x="20.0" y="315.0" font-size="15" fill="#1b2a3a" text-anchor="start">ADASTRA tests this in thousands of public ChIP-seq data sets: 2 609 CTCF ASB SNPs on chr8 and chr9 (FDR &lt; 0.05),</text>
<text x="20.0" y="339.0" font-size="15" fill="#1b2a3a" text-anchor="start">each with a preferred allele. A natural experiment: same cell, same chromatin, one base different (or a few, on one haplotype).</text>
<text x="20.0" y="363.0" font-size="15" fill="#5b6b7a" text-anchor="start">Caveat: the imbalance is per haplotype, so the causal variant can be a nearby SNP in phase with the one measured.</text>
</svg>
