<text x="40.0" y="252.0" font-size="15" fill="#1b2a3a" text-anchor="start"><tspan dy="0.0">a difference of log-odds = a log odds ratio: the odds of binding are multiplied by e</tspan><tspan dy="-6.0" font-size="10">−3</tspan><tspan dy="6.0"> = 0.05</tspan></text>
<text x="20.0" y="300.0" font-size="15" fill="#1b2a3a" text-anchor="start">Work on the logit scale: z = 9 → 7 is also Δ = −2, though p only moves from 0.9999 to 0.9991.</text>
<text x="20.0" y="326.0" font-size="15" fill="#5b6b7a" text-anchor="start">Validate against measured allelic effects: allele-specific binding or accessibility, caQTLs/bQTLs, reporter assays (MPRA).</text>
