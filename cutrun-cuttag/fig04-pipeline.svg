<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 345" width="1120" height="345" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6b7a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>
  <rect width="1120" height="345" fill="#ffffff"/>
  <rect x="20" y="40" width="196" height="76" rx="8" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="118.0" y="66" font-size="16" fill="#1b2a3a" text-anchor="middle" font-weight="bold">FASTQ</text>
  <text x="118.0" y="87" font-size="14" fill="#5b6b7a" text-anchor="middle">paired-end, 2 × 25 bp</text>
  <text x="118.0" y="104" font-size="14" fill="#5b6b7a" text-anchor="middle">no trimming needed</text>
  <rect x="242" y="40" width="196" height="76" rx="8" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="340.0" y="66" font-size="16" fill="#1b2a3a" text-anchor="middle" font-weight="bold">Align: genome</text>
  <text x="340.0" y="87" font-size="14" fill="#5b6b7a" text-anchor="middle">Bowtie2 end-to-end</text>
  <text x="340.0" y="104" font-size="14" fill="#5b6b7a" text-anchor="middle">fragments 10–700 bp</text>
  <rect x="464" y="40" width="196" height="76" rx="8" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="562.0" y="66" font-size="16" fill="#1b2a3a" text-anchor="middle" font-weight="bold">Filter</text>
  <text x="562.0" y="87" font-size="14" fill="#5b6b7a" text-anchor="middle">MAPQ ≥ 30,</text>
  <text x="562.0" y="104" font-size="14" fill="#5b6b7a" text-anchor="middle">proper pairs only</text>
  <rect x="686" y="40" width="196" height="76" rx="8" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="784.0" y="66" font-size="16" fill="#1b2a3a" text-anchor="middle" font-weight="bold">Duplicates</text>
  <text x="784.0" y="87" font-size="14" fill="#5b6b7a" text-anchor="middle">measure them;</text>
  <text x="784.0" y="104" font-size="14" fill="#5b6b7a" text-anchor="middle">keep for histone marks</text>
  <rect x="908" y="40" width="196" height="76" rx="8" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="1006.0" y="66" font-size="16" fill="#1b2a3a" text-anchor="middle" font-weight="bold">Fragments</text>
  <text x="1006.0" y="87" font-size="14" fill="#5b6b7a" text-anchor="middle">one BED line per pair</text>
  <text x="1006.0" y="104" font-size="14" fill="#5b6b7a" text-anchor="middle">→ bedGraph / bigWig</text>
  <line x1="218" y1="78" x2="238" y2="78" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="440" y1="78" x2="460" y2="78" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="662" y1="78" x2="682" y2="78" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="884" y1="78" x2="904" y2="78" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="242" y="210" width="196" height="76" rx="8" fill="#fdf1e4" stroke="#b35f12" stroke-width="1.5"/>
  <text x="340.0" y="236" font-size="16" fill="#1b2a3a" text-anchor="middle" font-weight="bold">Align: E. coli</text>
  <text x="340.0" y="257" font-size="14" fill="#5b6b7a" text-anchor="middle">carry-over DNA</text>
  <text x="340.0" y="274" font-size="14" fill="#5b6b7a" text-anchor="middle">→ spike-in factor</text>
  <rect x="464" y="210" width="196" height="76" rx="8" fill="#f4f6f8" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="562.0" y="236" font-size="16" fill="#1b2a3a" text-anchor="middle" font-weight="bold">Fragment sizes</text>
  <text x="562.0" y="257" font-size="14" fill="#5b6b7a" text-anchor="middle">nucleosome ladder</text>
  <text x="562.0" y="274" font-size="14" fill="#5b6b7a" text-anchor="middle">QC, no filtering</text>
  <rect x="686" y="210" width="196" height="76" rx="8" fill="#e8f4ec" stroke="#2e8b57" stroke-width="1.5"/>
  <text x="784.0" y="236" font-size="16" fill="#1b2a3a" text-anchor="middle" font-weight="bold">Peaks</text>
  <text x="784.0" y="257" font-size="14" fill="#5b6b7a" text-anchor="middle">SEACR (IgG or top 1%)</text>
  <text x="784.0" y="274" font-size="14" fill="#5b6b7a" text-anchor="middle">or MACS3</text>
  <rect x="908" y="210" width="196" height="76" rx="8" fill="#f4f6f8" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="1006.0" y="236" font-size="16" fill="#1b2a3a" text-anchor="middle" font-weight="bold">QC</text>
  <text x="1006.0" y="257" font-size="14" fill="#5b6b7a" text-anchor="middle">FRiP, IgG, replicates,</text>
  <text x="1006.0" y="274" font-size="14" fill="#5b6b7a" text-anchor="middle">reads in peaks</text>
  <rect x="20" y="210" width="196" height="76" rx="8" fill="#f4f6f8" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="118.0" y="236" font-size="16" fill="#1b2a3a" text-anchor="middle" font-weight="bold">IgG control</text>
  <text x="118.0" y="257" font-size="14" fill="#5b6b7a" text-anchor="middle">same steps;</text>
  <text x="118.0" y="274" font-size="14" fill="#5b6b7a" text-anchor="middle">sparse, few peaks</text>
  <path d="M118,118 L118,148 L340,148 L340,206" stroke="#1b2a3a" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M1006,118 L1006,160 L784,160 L784,206" stroke="#1b2a3a" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M1006,160 L562,160 L562,206" stroke="#1b2a3a" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <line x1="882" y1="248" x2="904" y2="248" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M118,288 L118,308 L784,308 L784,290" stroke="#5b6b7a" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#arrg)"/>
  <text x="450" y="328" font-size="14" fill="#5b6b7a" text-anchor="middle">IgG sets the threshold (SEACR) or acts as control (MACS3)</text>
  <text x="20" y="26" font-size="15" fill="#5b6b7a">Same building blocks as ChIP-seq; the differences are in the parameters and the QC</text>
</svg>
