<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 330" width="1120" height="330" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7a"/></marker></defs>
<rect width="1120" height="330" fill="#ffffff"/>
<text x="40" y="30" font-size="18" font-weight="bold" fill="#1b2a3a">Variant effect = prediction(alt) − prediction(ref)</text>
<text x="40" y="86" font-size="16" font-weight="bold" fill="#1b2a3a">ref</text>
<text x="90" y="86" font-family="Courier New, monospace" font-size="18" fill="#1b2a3a">…TGGCCAGCAG<tspan fill="#c0392b" font-weight="bold">G</tspan>GGGCGCTGT…</text>
<rect x="440" y="56" width="160" height="50" rx="8" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="1.5"/>
<text x="520" y="86" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b2a3a">same model</text>
<line x1="380" y1="80" x2="432" y2="80" stroke="#5b6b7a" stroke-width="2.5" marker-end="url(#ah)"/>
<line x1="608" y1="80" x2="660" y2="80" stroke="#5b6b7a" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="672" y="87" font-size="18" fill="#1b2a3a">P(CTCF bound) = <tspan font-weight="bold">0.91</tspan></text>
<text x="40" y="206" font-size="16" font-weight="bold" fill="#1b2a3a">alt</text>
<text x="90" y="206" font-family="Courier New, monospace" font-size="18" fill="#1b2a3a">…TGGCCAGCAG<tspan fill="#c0392b" font-weight="bold">A</tspan>GGGCGCTGT…</text>
<rect x="440" y="176" width="160" height="50" rx="8" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="1.5"/>
<text x="520" y="206" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b2a3a">same model</text>
<line x1="380" y1="200" x2="432" y2="200" stroke="#5b6b7a" stroke-width="2.5" marker-end="url(#ah)"/>
<line x1="608" y1="200" x2="660" y2="200" stroke="#5b6b7a" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="672" y="207" font-size="18" fill="#1b2a3a">P(CTCF bound) = <tspan font-weight="bold">0.23</tspan></text>
<text x="230" y="146" text-anchor="middle" font-size="14" fill="#5b6b7a">one base differs (a SNP in a CTCF motif)</text>
<line x1="940" y1="90" x2="940" y2="196" stroke="#c0392b" stroke-width="2"/>
<text x="958" y="148" font-size="20" font-weight="bold" fill="#c0392b">Δ = −0.68</text>
<text x="40" y="284" font-size="15" fill="#5b6b7a">No new training: one fitted model, two inputs. Works for any variant, including ones never seen in any experiment.</text>
<text x="40" y="308" font-size="15" fill="#5b6b7a">How good these Δs are is the subject of <tspan font-style="italic">What did the model learn? Variant effects</tspan>. Numbers are illustrative.</text>
</svg>