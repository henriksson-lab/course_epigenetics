<text x="480" y="210" text-anchor="middle" font-size="15" fill="#e67e22" font-weight="bold">E3</text>
<path d="M480,158 Q407.5,5.5 335,158" fill="none" stroke="#2a6f97" stroke-width="2.5"/>
