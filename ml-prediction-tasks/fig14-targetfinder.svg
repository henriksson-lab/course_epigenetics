<text x="560" y="210" text-anchor="middle" font-size="15" fill="#e67e22" font-weight="bold">E4</text>
<path d="M560,158 Q447.5,-34.5 335,158" fill="none" stroke="#2a6f97" stroke-width="2.5"/>
<text x="60" y="250" font-size="15" fill="#1b2a3a">pairs (E1,P), (E3,P), (E4,P) in <tspan fill="#2a6f97" font-weight="bold">training</tspan>; (E2,P) in <tspan fill="#c0392b" font-weight="bold">test</tspan></text>
<text x="60" y="274" font-size="15" fill="#1b2a3a">P’s features, and the window between E and P, are shared:</text>
<text x="60" y="298" font-size="15" fill="#1b2a3a">the model learns “P interacts”, not “this E–P pair interacts”.</text>
<text x="60" y="330" font-size="15" fill="#5b6b7a">In the training data over 92% of pairs shared their promoter with another pair.</text>
<text x="900" y="64" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b2a3a">TargetFinder, K562 (F1)</text>
