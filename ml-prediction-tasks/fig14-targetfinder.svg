<text x="335" y="210" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b2a3a">promoter P</text>
<rect x="74" y="161" width="32" height="18" rx="4" fill="#e67e22"/>
<text x="90" y="210" text-anchor="middle" font-size="15" fill="#e67e22" font-weight="bold">E1</text>
<path d="M90,158 Q212.5,-44.5 335,158" fill="none" stroke="#2a6f97" stroke-width="2.5"/>
<rect x="144" y="161" width="32" height="18" rx="4" fill="#e67e22"/>
<text x="160" y="210" text-anchor="middle" font-size="15" fill="#e67e22" font-weight="bold">E2</text>
<path d="M160,158 Q247.5,-9.5 335,158" fill="none" stroke="#c0392b" stroke-width="2.5"/>
