<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 400" width="1120" height="400" font-family="Helvetica, Arial, sans-serif">
<rect width="1120" height="400" fill="#ffffff"/>
<text x="40" y="30" font-size="18" font-weight="bold" fill="#1b2a3a">How much sequence the model sees (log scale)</text>
<text x="238" y="78" text-anchor="end" font-size="15" fill="#1b2a3a">Basset (2016)</text>
<rect x="250.0" y="62" width="150.1" height="22" rx="3" fill="#2a6f97" fill-opacity="0.8"/>
<text x="408.1" y="78" font-size="14" fill="#1b2a3a">600 bp</text>
<text x="238" y="116" text-anchor="end" font-size="15" fill="#1b2a3a">DeepSEA (2015)</text>
<rect x="250.0" y="100" width="192.9" height="22" rx="3" fill="#2a6f97" fill-opacity="0.8"/>
<text x="450.9" y="116" font-size="14" fill="#1b2a3a">1000 bp</text>
<text x="238" y="154" text-anchor="end" font-size="15" fill="#1b2a3a">Basenji (2018)</text>
<rect x="250.0" y="138" width="601.2" height="22" rx="3" fill="#e67e22" fill-opacity="0.8"/>
<text x="859.2" y="154" font-size="14" fill="#1b2a3a">131 kb</text>
<text x="238" y="192" text-anchor="end" font-size="15" fill="#1b2a3a">Enformer (2021)</text>
<rect x="250.0" y="176" width="635.2" height="22" rx="3" fill="#e67e22" fill-opacity="0.8"/>
<text x="893.2" y="192" font-size="14" fill="#1b2a3a">196 kb</text>
<text x="238" y="230" text-anchor="end" font-size="15" fill="#1b2a3a">Borzoi (2025)</text>
<rect x="250.0" y="214" width="717.3" height="22" rx="3" fill="#c0392b" fill-opacity="0.8"/>
<text x="959.3" y="230" text-anchor="end" font-size="14" fill="#ffffff" font-weight="bold">524 kb</text>
<text x="238" y="268" text-anchor="end" font-size="15" fill="#1b2a3a">AlphaGenome (2026)</text>
<rect x="250.0" y="252" width="775.4" height="22" rx="3" fill="#c0392b" fill-opacity="0.8"/>
<text x="1017.4" y="268" text-anchor="end" font-size="14" fill="#ffffff" font-weight="bold">1 Mb</text>
<line x1="250.0" y1="298" x2="1060.0" y2="298" stroke="#1b2a3a" stroke-width="1.5"/>
<line x1="250.0" y1="298" x2="250.0" y2="304" stroke="#1b2a3a"/>
<text x="250.0" y="322" text-anchor="middle" font-size="15" fill="#1b2a3a">100 bp</text>
<line x1="442.9" y1="298" x2="442.9" y2="304" stroke="#1b2a3a"/>
<text x="442.9" y="322" text-anchor="middle" font-size="15" fill="#1b2a3a">1 kb</text>
<line x1="635.7" y1="298" x2="635.7" y2="304" stroke="#1b2a3a"/>
<text x="635.7" y="322" text-anchor="middle" font-size="15" fill="#1b2a3a">10 kb</text>
<line x1="828.6" y1="298" x2="828.6" y2="304" stroke="#1b2a3a"/>
<text x="828.6" y="322" text-anchor="middle" font-size="15" fill="#1b2a3a">100 kb</text>
<line x1="1021.4" y1="298" x2="1021.4" y2="304" stroke="#1b2a3a"/>
<text x="1021.4" y="322" text-anchor="middle" font-size="15" fill="#1b2a3a">1 Mb</text>
<text x="238" y="355" text-anchor="end" font-size="15" font-weight="bold" fill="#1b2a3a">biological scale:</text>
<circle cx="284.0" cy="350" r="6" fill="#d4a017"/>
<text x="284.0" y="374" text-anchor="middle" font-size="14" fill="#5b6b7a">nucleosome, 147 bp</text>
<circle cx="442.9" cy="350" r="6" fill="#d4a017"/>
<text x="442.9" y="374" text-anchor="middle" font-size="14" fill="#5b6b7a">promoter, ~1 kb</text>
<circle cx="693.8" cy="350" r="6" fill="#d4a017"/>
<text x="693.8" y="374" text-anchor="middle" font-size="14" fill="#5b6b7a">enhancer to gene: often 10–100 kb</text>
<circle cx="1021.4" cy="350" r="6" fill="#d4a017"/>
<text x="1021.4" y="374" text-anchor="middle" font-size="14" fill="#5b6b7a">ZRS enhancer to SHH</text>
<text x="1021.4" y="392" text-anchor="middle" font-size="14" fill="#5b6b7a">~1 Mb</text>
</svg>