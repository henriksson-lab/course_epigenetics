<rect x="420" y="194" width="280" height="20" fill="#ffffff"/>
<text x="560" y="209" text-anchor="middle" font-size="14" fill="#1b2a3a">the test set was used to choose the model or features</text>
<text x="40" y="300" font-size="16" fill="#1b2a3a">Symptom: test performance far above what the model achieves on truly new data, e.g. a new chromosome, cell type or study.</text>
<text x="40" y="330" font-size="16" fill="#1b2a3a">Flexible models (k-NN, random forests, deep networks) can <tspan font-weight="bold">memorise</tspan>, so they profit most from leakage.</text>
<text x="40" y="360" font-size="16" fill="#5b6b7a">Fix: decide how examples are related, and keep related examples on the same side of every split.</text>
</svg>