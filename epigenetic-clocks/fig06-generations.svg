<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 420" width="1120" height="420" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7a"/></marker></defs>
<rect width="1120" height="420" fill="#ffffff"/>
<text x="250" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b2a3a">what the model was trained to predict (y)</text>
<text x="640" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b2a3a">model</text>
<text x="920" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b2a3a">examples</text>
<!-- row 1 -->
<rect x="30" y="50" width="440" height="96" rx="10" fill="#eaf1f7" stroke="#2a6f97" stroke-width="1.5"/>
<text x="50" y="76" font-size="16" font-weight="bold" fill="#2a6f97">1st generation: chronological age</text>
<text x="50" y="100" font-size="15" fill="#1b2a3a">y = age in years</text>
<text x="50" y="124" font-size="15" fill="#5b6b7a">"how old does this sample look?"</text>
<!-- row 2 -->
<rect x="30" y="160" width="440" height="110" rx="10" fill="#fdf1e6" stroke="#e67e22" stroke-width="1.5"/>
<text x="50" y="186" font-size="16" font-weight="bold" fill="#e67e22">2nd generation: health and mortality</text>
<text x="50" y="210" font-size="15" fill="#1b2a3a">y = "phenotypic age" from 9 blood tests + age,</text>
<text x="50" y="232" font-size="15" fill="#1b2a3a">or time to death (via methylation surrogates</text>
<text x="50" y="254" font-size="15" fill="#1b2a3a">of 7 plasma proteins and smoking pack-years)</text>
<!-- row 3 -->
<rect x="30" y="284" width="440" height="96" rx="10" fill="#eaf5ee" stroke="#2e8b57" stroke-width="1.5"/>
<text x="50" y="310" font-size="16" font-weight="bold" fill="#2e8b57">3rd generation: pace of ageing</text>
<text x="50" y="334" font-size="15" fill="#1b2a3a">y = rate of decline in 19 organ-system markers,</text>
<text x="50" y="356" font-size="15" fill="#1b2a3a">measured 4 times over 20 years (ages 26–45)</text>
<!-- arrows to model -->
<line x1="474" y1="98" x2="546" y2="190" stroke="#5b6b7a" stroke-width="2" marker-end="url(#ah)"/>
<line x1="474" y1="215" x2="546" y2="215" stroke="#5b6b7a" stroke-width="2" marker-end="url(#ah)"/>
<line x1="474" y1="332" x2="546" y2="240" stroke="#5b6b7a" stroke-width="2" marker-end="url(#ah)"/>
<rect x="550" y="170" width="180" height="90" rx="10" fill="#f4f6f8" stroke="#1b2a3a" stroke-width="1.5"/>
<text x="640" y="200" text-anchor="middle" font-size="15" fill="#1b2a3a">elastic net on</text>
<text x="640" y="222" text-anchor="middle" font-size="15" fill="#1b2a3a">CpG β values</text>
<text x="640" y="244" text-anchor="middle" font-size="14" fill="#5b6b7a">(arrays; mostly blood)</text>
<!-- examples -->
<g font-size="15" fill="#1b2a3a">
<text x="770" y="78"><tspan font-weight="bold">Horvath 2013</tspan>: 353 CpGs, 51 tissues</text>
<text x="770" y="102"><tspan font-weight="bold">Hannum 2013</tspan>: 71 CpGs, blood</text>
<text x="770" y="126" fill="#5b6b7a">output: years</text>
<text x="770" y="194"><tspan font-weight="bold">PhenoAge</tspan> (Levine 2018): 513 CpGs</text>
<text x="770" y="218"><tspan font-weight="bold">GrimAge</tspan> (Lu 2019): 1030 CpGs</text>
<text x="770" y="242" fill="#5b6b7a">output: years ("biological age")</text>
<text x="770" y="318"><tspan font-weight="bold">DunedinPACE</tspan> (Belsky 2022): 173 CpGs</text>
<text x="770" y="342" fill="#5b6b7a">output: years of ageing per year</text>
<text x="770" y="364" fill="#5b6b7a">(mean ≈ 1.0)</text>
</g>
<text x="560" y="406" text-anchor="middle" font-size="15" fill="#1b2a3a">Same statistics every time; what changes is the target, and with it what the score means.</text>
</svg>
