<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 430" width="1120" height="430" font-family="Helvetica, Arial, sans-serif">
<rect width="1120" height="430" fill="#ffffff"/>
<!-- Panel A: p >> n -->
<text x="170" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1b2a3a">A. More CpGs than people</text>
<rect x="80" y="70" width="190" height="60" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="1.5"/>
<text x="175" y="105" text-anchor="middle" font-size="16" fill="#1b2a3a">X: β values</text>
<text x="175" y="152" text-anchor="middle" font-size="14" fill="#5b6b7a">26 000 CpGs (columns)</text>
<text x="72" y="105" text-anchor="end" font-size="14" fill="#5b6b7a">459</text>
<text x="72" y="121" text-anchor="end" font-size="14" fill="#5b6b7a">people</text>
<rect x="290" y="70" width="22" height="60" fill="#e67e22" fill-opacity="0.5" stroke="#1b2a3a" stroke-width="1.5"/>
<text x="301" y="152" text-anchor="middle" font-size="14" fill="#5b6b7a">age</text>
<text x="170" y="196" text-anchor="middle" font-size="15" fill="#1b2a3a">age = a + Σ (weight × β of each CpG)</text>
<text x="170" y="226" text-anchor="middle" font-size="15" fill="#1b2a3a">has infinitely many exact fits:</text>
<text x="170" y="248" text-anchor="middle" font-size="15" fill="#1b2a3a">training error 0, predictions useless.</text>
<!-- Panel B: coefficients -->
<line x1="350" y1="20" x2="350" y2="410" stroke="#dfe6ec" stroke-width="2"/>
<text x="730" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1b2a3a">B. What a penalty does to the coefficients</text>
<!-- four mini bar charts, baseline y=150, 12 bars each -->
<g font-size="15" text-anchor="middle" fill="#1b2a3a">
<text x="460" y="66">least squares</text><text x="640" y="66">ridge (L2)</text><text x="820" y="66">lasso (L1)</text><text x="1000" y="66">elastic net</text>
</g>
<g stroke="#5b6b7a" stroke-width="1.5"><line x1="390" y1="150" x2="530" y2="150"/><line x1="570" y1="150" x2="710" y2="150"/><line x1="750" y1="150" x2="890" y2="150"/><line x1="930" y1="150" x2="1070" y2="150"/></g>
<!-- OLS: wild -->
<g fill="#5b6b7a">
<rect x="394" y="96" width="8" height="54"/><rect x="405" y="150" width="8" height="48"/><rect x="416" y="110" width="8" height="40"/><rect x="427" y="150" width="8" height="58"/><rect x="438" y="84" width="8" height="66"/><rect x="449" y="150" width="8" height="30"/><rect x="460" y="120" width="8" height="30"/><rect x="471" y="150" width="8" height="62"/><rect x="482" y="100" width="8" height="50"/><rect x="493" y="150" width="8" height="44"/><rect x="504" y="118" width="8" height="32"/><rect x="515" y="150" width="8" height="38"/>
</g>
<!-- ridge: all small -->
<g fill="#2a6f97">
<rect x="574" y="136" width="8" height="14"/><rect x="585" y="150" width="8" height="8"/><rect x="596" y="130" width="8" height="20"/><rect x="607" y="140" width="8" height="10"/><rect x="618" y="126" width="8" height="24"/><rect x="629" y="150" width="8" height="6"/><rect x="640" y="132" width="8" height="18"/><rect x="651" y="150" width="8" height="12"/><rect x="662" y="138" width="8" height="12"/><rect x="673" y="150" width="8" height="9"/><rect x="684" y="142" width="8" height="8"/><rect x="695" y="150" width="8" height="7"/>
</g>
<!-- lasso: few nonzero -->
<g fill="#c0392b">
<rect x="776" y="112" width="8" height="38"/><rect x="809" y="150" width="8" height="30"/><rect x="853" y="124" width="8" height="26"/>
</g>
<!-- elastic net: few, correlated kept together -->
<g fill="#2e8b57">
<rect x="956" y="122" width="8" height="28"/><rect x="967" y="126" width="8" height="24"/><rect x="989" y="150" width="8" height="22"/><rect x="1033" y="130" width="8" height="20"/><rect x="1044" y="132" width="8" height="18"/>
</g>
<g font-size="14" text-anchor="middle" fill="#5b6b7a">
<text x="460" y="236">huge, unstable</text><text x="640" y="236">all kept, all shrunk</text><text x="820" y="236">most exactly 0</text><text x="1000" y="236">sparse; correlated</text><text x="1000" y="254">CpGs enter together</text>
</g>
<!-- Formula -->
<rect x="380" y="282" width="710" height="120" rx="8" fill="#f4f6f8"/>
<text x="420" y="314" font-size="17" fill="#1b2a3a">minimise   Σ (age − a − Xb)<tspan dy="-7" font-size="12">2</tspan><tspan dy="7">   +   λ [ α Σ |b|  +  (1 − α)/2 · Σ b</tspan><tspan dy="-7" font-size="12">2</tspan><tspan dy="7"> ]</tspan></text>
<text x="545" y="342" text-anchor="middle" font-size="14" fill="#5b6b7a">fit to the training data</text>
<text x="880" y="342" text-anchor="middle" font-size="14" fill="#5b6b7a">penalty on large coefficients</text>
<text x="735" y="372" text-anchor="middle" font-size="15" fill="#1b2a3a">α = 1: lasso;  α = 0: ridge;  α = 0.5: the elastic net of most clocks.</text>
<text x="735" y="394" text-anchor="middle" font-size="15" fill="#1b2a3a">λ (penalty strength) is chosen by cross-validation.</text>
<!-- panel A bottom note -->
<rect x="30" y="282" width="290" height="120" rx="8" fill="#f4f6f8"/>
<text x="175" y="312" text-anchor="middle" font-size="15" fill="#1b2a3a">Same as an RNA-seq gene</text>
<text x="175" y="334" text-anchor="middle" font-size="15" fill="#1b2a3a">signature: a linear model,</text>
<text x="175" y="356" text-anchor="middle" font-size="15" fill="#1b2a3a">but fitted to predict, with</text>
<text x="175" y="378" text-anchor="middle" font-size="15" fill="#1b2a3a">a price on complexity.</text>
</svg>
