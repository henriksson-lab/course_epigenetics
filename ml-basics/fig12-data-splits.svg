<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 428" width="1120" height="428" font-family="Helvetica, Arial, sans-serif">
<rect width="1120" height="428" fill="#ffffff"/>
<text x="40" y="30" font-size="18" font-weight="bold" fill="#1b2a3a">Three sets, three jobs</text>
<rect x="40" y="46" width="724" height="40" rx="5" fill="#2a6f97" fill-opacity="0.85"/>
<text x="52" y="72" font-size="16" font-weight="bold" fill="#ffffff">training set</text>
<rect x="768.0" y="46" width="152" height="40" rx="5" fill="#e67e22" fill-opacity="0.85"/>
<text x="780.0" y="72" font-size="16" font-weight="bold" fill="#ffffff">validation set</text>
<rect x="924.0" y="46" width="152" height="40" rx="5" fill="#c0392b" fill-opacity="0.85"/>
<text x="936.0" y="72" font-size="16" font-weight="bold" fill="#ffffff">test set</text>
<text x="40" y="112" font-size="15" fill="#2a6f97">fit the parameters (the b’s)</text>
<text x="768" y="112" font-size="15" fill="#e67e22">pick a model or λ</text>
<text x="924" y="112" font-size="15" fill="#c0392b">report this number</text>
<text x="40" y="146" font-size="15" fill="#5b6b7a">If a decision used the test set, the test set is no longer a test: its number becomes too optimistic.</text>
<text x="40" y="196" font-size="18" font-weight="bold" fill="#1b2a3a">In genomics: split by chromosome, not by random windows</text>
