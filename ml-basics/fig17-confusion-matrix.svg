<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 400" width="1120" height="400" font-family="Helvetica, Arial, sans-serif">
<rect width="1120" height="400" fill="#ffffff"/>
<text x="290" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1b2a3a">A threshold turns scores into calls</text>
<text x="350" y="70" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b2a3a">predicted</text>
<text x="270" y="98" text-anchor="middle" font-size="15" fill="#2e8b57" font-weight="bold">open</text>
<text x="430" y="98" text-anchor="middle" font-size="15" fill="#a8324a" font-weight="bold">closed</text>
<text x="90" y="230" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b2a3a" transform="rotate(-90 90 230)">true label</text>
<text x="160" y="170" text-anchor="end" font-size="15" fill="#2e8b57" font-weight="bold">open</text>
<text x="160" y="300" text-anchor="end" font-size="15" fill="#a8324a" font-weight="bold">closed</text>
<rect x="190" y="110" width="160" height="120" fill="#2e8b57" fill-opacity="0.18" stroke="#1b2a3a" stroke-width="1.5"/>
<rect x="350" y="110" width="160" height="120" fill="#f4f6f8" stroke="#1b2a3a" stroke-width="1.5"/>
<rect x="190" y="230" width="160" height="120" fill="#f4f6f8" stroke="#1b2a3a" stroke-width="1.5"/>
<rect x="350" y="230" width="160" height="120" fill="#2e8b57" fill-opacity="0.18" stroke="#1b2a3a" stroke-width="1.5"/>
<text x="270" y="166" text-anchor="middle" font-size="22" font-weight="bold" fill="#1b2a3a">TP</text>
<text x="270" y="192" text-anchor="middle" font-size="14" fill="#5b6b7a">true positive</text>
<text x="430" y="166" text-anchor="middle" font-size="22" font-weight="bold" fill="#c0392b">FN</text>
<text x="430" y="192" text-anchor="middle" font-size="14" fill="#5b6b7a">false negative</text>
<text x="430" y="210" text-anchor="middle" font-size="14" fill="#5b6b7a">(missed)</text>
<text x="270" y="286" text-anchor="middle" font-size="22" font-weight="bold" fill="#c0392b">FP</text>
<text x="270" y="312" text-anchor="middle" font-size="14" fill="#5b6b7a">false positive</text>
<text x="270" y="330" text-anchor="middle" font-size="14" fill="#5b6b7a">(false alarm)</text>
<text x="430" y="286" text-anchor="middle" font-size="22" font-weight="bold" fill="#1b2a3a">TN</text>
<text x="430" y="312" text-anchor="middle" font-size="14" fill="#5b6b7a">true negative</text>
<text x="530" y="176" font-size="15" fill="#5b6b7a">row sum P</text>
<text x="530" y="296" font-size="15" fill="#5b6b7a">row sum N</text>
<text x="350" y="378" text-anchor="middle" font-size="15" fill="#5b6b7a">call "open" when P(open) ≥ threshold</text>
<text x="650" y="30" font-size="18" font-weight="bold" fill="#1b2a3a">What we compute from it</text>
<g font-size="15" fill="#1b2a3a">
<text x="650" y="76"><tspan font-weight="bold">accuracy</tspan> = (TP + TN) / (P + N)</text>
<text x="650" y="96" fill="#5b6b7a">fraction of all calls that are right</text>
<text x="650" y="134"><tspan font-weight="bold">recall</tspan> = sensitivity = TPR = TP / P</text>
<text x="650" y="154" fill="#5b6b7a">fraction of open regions we find</text>
<text x="650" y="192"><tspan font-weight="bold">precision</tspan> = TP / (TP + FP)</text>
<text x="650" y="212" fill="#5b6b7a">fraction of our "open" calls that are right (1 − FDR)</text>
<text x="650" y="250"><tspan font-weight="bold">false positive rate</tspan> FPR = FP / N</text>
<text x="650" y="270" fill="#5b6b7a">= 1 − specificity; fraction of closed regions called open</text>
<text x="650" y="308"><tspan font-weight="bold">F1</tspan> = 2 · precision · recall / (precision + recall)</text>
<text x="650" y="328" fill="#5b6b7a">one number that needs both to be high</text>
</g>
</svg>
