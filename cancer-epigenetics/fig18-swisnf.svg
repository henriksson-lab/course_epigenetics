<path d="M470,150 L487,150 A17,17 0 0 1 470,167 Z" fill="#e9c46a" stroke="#ffffff" stroke-width="1.2"/>
<path d="M470,150 L470,167 A17,17 0 0 1 453,150 Z" fill="#f4a261" stroke="#ffffff" stroke-width="1.2"/>
<circle cx="470" cy="150" r="19.5" fill="none" stroke="#1b2a3a" stroke-width="2.5"/>
<rect x="190" y="88" width="100" height="44" rx="18" fill="#e9d8c4" stroke="#1b2a3a" stroke-width="1.8"/>
<text x="240" y="115" font-size="15" fill="#1b2a3a" text-anchor="middle" font-weight="bold">SWI/SNF</text>
<text x="240" y="78" font-size="14" fill="#5b6b7a" text-anchor="middle">ATP</text>
<line x1="240" y1="134" x2="240" y2="147" stroke="#1b2a3a" stroke-width="1.5"/>
<rect x="215" y="140" width="50" height="10" fill="#2e8b57"/>
<text x="240" y="188" font-size="15" fill="#1b2a3a" text-anchor="middle">nucleosome slid away: the motif (green)</text>
<text x="240" y="208" font-size="15" fill="#1b2a3a" text-anchor="middle">is free for transcription factors</text>
<text x="30" y="260" font-size="15" fill="#1b2a3a" text-anchor="start">Subunits (SMARCA4, SMARCB1, ARID1A, PBRM1, …) are</text>
<text x="30" y="282" font-size="15" fill="#1b2a3a" text-anchor="start">mutated in about 20% of human cancers (Kadoch et al. 2013).</text>
<line x1="560" y1="50" x2="560" y2="380" stroke="#d5dde5" stroke-width="1.5"/>
<text x="584" y="30" font-size="18" fill="#1b2a3a" text-anchor="start" font-weight="bold">B  Rhabdoid tumours: one hit, and a drug target</text>
<rect x="584" y="56" width="512" height="58" rx="10" fill="#fbeaea" stroke="none" stroke-width="0"/>
<text x="600" y="80" font-size="15" fill="#1b2a3a" text-anchor="start">loss of both copies of SMARCB1 is essentially the only</text>
<text x="600" y="101" font-size="15" fill="#1b2a3a" text-anchor="start">recurrent mutation (Lee et al. 2012)</text>
<ellipse cx="680" cy="180" rx="62" ry="28" fill="#e9d8c4" stroke="#1b2a3a" stroke-width="1.8"/>
<text x="680" y="185" font-size="15" fill="#1b2a3a" text-anchor="middle" font-weight="bold">SWI/SNF</text>
<ellipse cx="900" cy="180" rx="62" ry="28" fill="#dbe7f1" stroke="#1b2a3a" stroke-width="1.8"/>
<text x="900" y="185" font-size="15" fill="#1b2a3a" text-anchor="middle" font-weight="bold">PRC2</text>
<line x1="744" y1="172" x2="836" y2="172" stroke="#1b2a3a" stroke-width="2" marker-end="url(#ah)"/>
<line x1="836" y1="190" x2="744" y2="190" stroke="#1b2a3a" stroke-width="2" marker-end="url(#ah)"/>
<text x="790" y="160" font-size="14" fill="#5b6b7a" text-anchor="middle">oppose each other</text>
<line x1="650" y1="150" x2="710" y2="210" stroke="#a8324a" stroke-width="3"/>
<line x1="650" y1="210" x2="710" y2="150" stroke="#a8324a" stroke-width="3"/>
<text x="680" y="232" font-size="15" fill="#a8324a" text-anchor="middle" font-weight="bold">SMARCB1 lost</text>
<text x="900" y="232" font-size="15" fill="#1b2a3a" text-anchor="middle" font-weight="bold">PRC2 unopposed:</text>
<text x="900" y="252" font-size="15" fill="#1b2a3a" text-anchor="middle">differentiation genes</text>
<text x="900" y="272" font-size="15" fill="#1b2a3a" text-anchor="middle">stay H3K27me3-silenced</text>
<rect x="584" y="296" width="512" height="86" rx="10" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="1.2"/>
<text x="600" y="320" font-size="15" fill="#1b2a3a" text-anchor="start">the tumour now depends on EZH2: an EZH2 inhibitor</text>
<text x="600" y="342" font-size="15" fill="#1b2a3a" text-anchor="start">made rhabdoid tumours regress in mice (Knutson 2013);</text>
<text x="600" y="364" font-size="15" fill="#1b2a3a" text-anchor="start">tazemetostat is approved for epithelioid sarcoma (SMARCB1 loss)</text>
</svg>
