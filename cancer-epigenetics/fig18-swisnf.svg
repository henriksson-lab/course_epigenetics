<rect width="1120" height="400" fill="#ffffff"/>
<text x="24" y="30" font-size="18" fill="#1b2a3a" text-anchor="start" font-weight="bold">A  SWI/SNF (BAF) opens chromatin at enhancers</text>
<line x1="30" y1="150" x2="520" y2="150" stroke="#1b2a3a" stroke-width="2.4"/>
<path d="M70,150 L53,150 A17,17 0 0 1 70,133 Z" fill="#2a9d8f" stroke="#ffffff" stroke-width="1.2"/>
