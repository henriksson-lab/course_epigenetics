<circle cx="330" cy="150" r="19.5" fill="none" stroke="#1b2a3a" stroke-width="2.5"/>
<path d="M400,150 L383,150 A17,17 0 0 1 400,133 Z" fill="#2a9d8f" stroke="#ffffff" stroke-width="1.2"/>
<path d="M400,150 L400,133 A17,17 0 0 1 417,150 Z" fill="#8ab17d" stroke="#ffffff" stroke-width="1.2"/>
<path d="M400,150 L417,150 A17,17 0 0 1 400,167 Z" fill="#e9c46a" stroke="#ffffff" stroke-width="1.2"/>
<path d="M400,150 L400,167 A17,17 0 0 1 383,150 Z" fill="#f4a261" stroke="#ffffff" stroke-width="1.2"/>
<circle cx="400" cy="150" r="19.5" fill="none" stroke="#1b2a3a" stroke-width="2.5"/>
<path d="M470,150 L453,150 A17,17 0 0 1 470,133 Z" fill="#2a9d8f" stroke="#ffffff" stroke-width="1.2"/>
