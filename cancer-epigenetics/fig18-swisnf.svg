<circle cx="70" cy="150" r="19.5" fill="none" stroke="#1b2a3a" stroke-width="2.5"/>
<path d="M140,150 L123,150 A17,17 0 0 1 140,133 Z" fill="#2a9d8f" stroke="#ffffff" stroke-width="1.2"/>
<path d="M140,150 L140,133 A17,17 0 0 1 157,150 Z" fill="#8ab17d" stroke="#ffffff" stroke-width="1.2"/>
<path d="M140,150 L157,150 A17,17 0 0 1 140,167 Z" fill="#e9c46a" stroke="#ffffff" stroke-width="1.2"/>
<path d="M140,150 L140,167 A17,17 0 0 1 123,150 Z" fill="#f4a261" stroke="#ffffff" stroke-width="1.2"/>
<circle cx="140" cy="150" r="19.5" fill="none" stroke="#1b2a3a" stroke-width="2.5"/>
