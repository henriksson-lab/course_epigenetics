<text x="824" y="250" font-size="15" fill="#1b2a3a" text-anchor="middle">less H3K27me3 → genes that should be off</text>
<text x="824" y="270" font-size="15" fill="#1b2a3a" text-anchor="middle">(developmental, self-renewal) come on</text>
<rect x="584" y="290" width="500" height="86" rx="10" fill="#f4f6f8" stroke="none" stroke-width="0"/>
<text x="600" y="316" font-size="15" fill="#1b2a3a" text-anchor="start" font-weight="bold">The same enzyme, opposite roles in different tissues:</text>
<text x="600" y="340" font-size="15" fill="#1b2a3a" text-anchor="start">an EZH2 inhibitor helps only where the tumour</text>
<text x="600" y="362" font-size="15" fill="#1b2a3a" text-anchor="start">depends on PRC2 activity.</text>
</svg>
