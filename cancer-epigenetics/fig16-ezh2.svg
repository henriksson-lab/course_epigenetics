<path d="M784,200 L801,200 A17,17 0 0 1 784,217 Z" fill="#e9c46a" stroke="#ffffff" stroke-width="1.2"/>
<path d="M784,200 L784,217 A17,17 0 0 1 767,200 Z" fill="#f4a261" stroke="#ffffff" stroke-width="1.2"/>
<circle cx="784" cy="200" r="19.5" fill="none" stroke="#1b2a3a" stroke-width="2.5"/>
<line x1="784" y1="180" x2="784" y2="164" stroke="#2a6f97" stroke-width="1.8"/>
<rect x="784" y="164" width="11" height="8" fill="#2a6f97"/>
<path d="M856,200 L839,200 A17,17 0 0 1 856,183 Z" fill="#2a9d8f" stroke="#ffffff" stroke-width="1.2"/>
<path d="M856,200 L856,183 A17,17 0 0 1 873,200 Z" fill="#8ab17d" stroke="#ffffff" stroke-width="1.2"/>
<path d="M856,200 L873,200 A17,17 0 0 1 856,217 Z" fill="#e9c46a" stroke="#ffffff" stroke-width="1.2"/>
<path d="M856,200 L856,217 A17,17 0 0 1 839,200 Z" fill="#f4a261" stroke="#ffffff" stroke-width="1.2"/>
<circle cx="856" cy="200" r="19.5" fill="none" stroke="#1b2a3a" stroke-width="2.5"/>
<path d="M928,200 L911,200 A17,17 0 0 1 928,183 Z" fill="#2a9d8f" stroke="#ffffff" stroke-width="1.2"/>
<path d="M928,200 L928,183 A17,17 0 0 1 945,200 Z" fill="#8ab17d" stroke="#ffffff" stroke-width="1.2"/>
<path d="M928,200 L945,200 A17,17 0 0 1 928,217 Z" fill="#e9c46a" stroke="#ffffff" stroke-width="1.2"/>
