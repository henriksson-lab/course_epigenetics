<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 404" width="1120" height="404" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a8324a"/></marker><marker id="ahgr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7a"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2a6f97"/></marker></defs>
<rect width="1120" height="404" fill="#ffffff"/>
<text x="24" y="30" font-size="18" fill="#1b2a3a" text-anchor="start" font-weight="bold">EZH2 (PRC2) can act as an oncogene or as a tumour suppressor</text>
<text x="24" y="56" font-size="15" fill="#5b6b7a" text-anchor="start">PRC2 adds methyl groups to H3K27 one at a time: me0 → me1 → me2 → me3 (repressive)</text>
<text x="24" y="100" font-size="17" fill="#1b2a3a" text-anchor="start" font-weight="bold">A  Gain of function: germinal-centre B-cell lymphoma</text>
<text x="24" y="126" font-size="15" fill="#1b2a3a" text-anchor="start">wild-type EZH2: good at the first step</text>
<rect x="52" y="154" width="56" height="32" rx="6" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="1.5"/>
<text x="80" y="175" font-size="15" fill="#1b2a3a" text-anchor="middle">me0</text>
<rect x="172" y="154" width="56" height="32" rx="6" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="1.5"/>
<text x="200" y="175" font-size="15" fill="#1b2a3a" text-anchor="middle">me1</text>
<rect x="292" y="154" width="56" height="32" rx="6" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="1.5"/>
<text x="320" y="175" font-size="15" fill="#1b2a3a" text-anchor="middle">me2</text>
<rect x="412" y="154" width="56" height="32" rx="6" fill="#dbe7f1" stroke="#1b2a3a" stroke-width="1.5"/>
<text x="440" y="175" font-size="15" fill="#1b2a3a" text-anchor="middle" font-weight="bold">me3</text>
<line x1="110" y1="170" x2="158" y2="170" stroke="#1b2a3a" stroke-width="6"/>
<path d="M156,162 L170,170 L156,178 z" fill="#1b2a3a"/>
<text x="140.0" y="158" font-size="13" fill="#1b2a3a" text-anchor="middle">fast</text>
<line x1="230" y1="170" x2="278" y2="170" stroke="#1b2a3a" stroke-width="3"/>
<path d="M276,162 L290,170 L276,178 z" fill="#1b2a3a"/>
<text x="260.0" y="158" font-size="13" fill="#1b2a3a" text-anchor="middle">slower</text>
<line x1="350" y1="170" x2="398" y2="170" stroke="#1b2a3a" stroke-width="1.2"/>
<path d="M396,162 L410,170 L396,178 z" fill="#1b2a3a"/>
<text x="380.0" y="158" font-size="13" fill="#1b2a3a" text-anchor="middle">slow</text>
<text x="24" y="222" font-size="15" fill="#c0392b" text-anchor="start">EZH2 Y641 mutant: good at the last steps</text>
<rect x="52" y="242" width="56" height="32" rx="6" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="1.5"/>
<text x="80" y="263" font-size="15" fill="#1b2a3a" text-anchor="middle">me0</text>
<rect x="172" y="242" width="56" height="32" rx="6" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="1.5"/>
<text x="200" y="263" font-size="15" fill="#1b2a3a" text-anchor="middle">me1</text>
<rect x="292" y="242" width="56" height="32" rx="6" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="1.5"/>
<text x="320" y="263" font-size="15" fill="#1b2a3a" text-anchor="middle">me2</text>
<rect x="412" y="242" width="56" height="32" rx="6" fill="#dbe7f1" stroke="#1b2a3a" stroke-width="1.5"/>
<text x="440" y="263" font-size="15" fill="#1b2a3a" text-anchor="middle" font-weight="bold">me3</text>
<line x1="110" y1="258" x2="158" y2="258" stroke="#c0392b" stroke-width="1"/>
<path d="M156,250 L170,258 L156,266 z" fill="#c0392b"/>
<text x="140.0" y="246" font-size="13" fill="#c0392b" text-anchor="middle">very slow</text>
<line x1="230" y1="258" x2="278" y2="258" stroke="#c0392b" stroke-width="3"/>
<path d="M276,250 L290,258 L276,266 z" fill="#c0392b"/>
<text x="260.0" y="246" font-size="13" fill="#c0392b" text-anchor="middle">faster</text>
<line x1="350" y1="258" x2="398" y2="258" stroke="#c0392b" stroke-width="6"/>
<path d="M396,250 L410,258 L396,266 z" fill="#c0392b"/>
<text x="380.0" y="246" font-size="13" fill="#c0392b" text-anchor="middle">fast</text>
<rect x="24" y="288" width="500" height="104" rx="10" fill="#fbeaea" stroke="none" stroke-width="0"/>
<text x="40" y="312" font-size="15" fill="#1b2a3a" text-anchor="start">the cell carries both (heterozygous): together</text>
<text x="40" y="334" font-size="15" fill="#1b2a3a" text-anchor="start">they convert more H3K27 to me3 → B-cell differentiation</text>
<text x="40" y="356" font-size="15" fill="#1b2a3a" text-anchor="start">genes stay repressed (Morin 2010; Sneeringer 2010)</text>
<text x="40" y="380" font-size="14" fill="#5b6b7a" text-anchor="start">treatment: tazemetostat (EZH2 inhibitor), follicular lymphoma</text>
<line x1="560" y1="90" x2="560" y2="380" stroke="#d5dde5" stroke-width="1.5"/>
<text x="584" y="100" font-size="17" fill="#1b2a3a" text-anchor="start" font-weight="bold">B  Loss of function: some MDS, T-ALL, MPNST</text>
<text x="584" y="128" font-size="15" fill="#1b2a3a" text-anchor="start">deletions or inactivating mutations in EZH2, EED or SUZ12</text>
<path d="M640,200 L623,200 A17,17 0 0 1 640,183 Z" fill="#2a9d8f" stroke="#ffffff" stroke-width="1.2"/>
