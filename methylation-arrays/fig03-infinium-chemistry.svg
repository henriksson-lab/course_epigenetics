<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 470" width="1120" height="470" font-family="Helvetica, Arial, sans-serif">
<rect width="1120" height="470" fill="#ffffff"/>
<line x1="560" y1="20" x2="560" y2="450" stroke="#dfe6ec" stroke-width="2"/>
<!-- ============ Panel I ============ -->
<text x="280" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1b2a3a">Infinium I: two beads per CpG</text>
<text x="280" y="56" text-anchor="middle" font-size="15" fill="#5b6b7a">a methylated fragment (C at the CpG) meets both beads</text>
<!-- U bead row -->
<circle cx="56" cy="140" r="26" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="2"/>
<text x="56" y="146" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b2a3a">U</text>
<rect x="82" y="136" width="240" height="9" fill="#5b6b7a"/>
<text x="200" y="166" text-anchor="middle" font-size="14" fill="#5b6b7a">50-nt probe</text>
<rect x="322" y="128" width="24" height="24" fill="#ffffff" stroke="#5b6b7a" stroke-width="1.5"/>
<text x="334" y="146" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b2a3a">A</text>
<line x1="88" y1="110" x2="440" y2="110" stroke="#1b2a3a" stroke-width="2.5"/>
<text x="334" y="104" text-anchor="middle" font-size="16" font-weight="bold" fill="#c0392b">C</text>
<text x="358" y="104" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b2a3a">T</text>
<text x="450" y="115" font-size="14" fill="#5b6b7a">target</text>
<line x1="368" y1="130" x2="384" y2="148" stroke="#c0392b" stroke-width="3"/><line x1="384" y1="130" x2="368" y2="148" stroke="#c0392b" stroke-width="3"/>
<text x="398" y="146" font-size="15" fill="#1b2a3a">A–C mismatch:</text>
<text x="398" y="164" font-size="15" fill="#1b2a3a">no extension</text>
<!-- M bead row -->
<circle cx="56" cy="262" r="26" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="2"/>
<text x="56" y="268" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b2a3a">M</text>
<rect x="82" y="258" width="240" height="9" fill="#5b6b7a"/>
<rect x="322" y="250" width="24" height="24" fill="#ffffff" stroke="#5b6b7a" stroke-width="1.5"/>
<text x="334" y="268" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b2a3a">G</text>
<line x1="88" y1="232" x2="440" y2="232" stroke="#1b2a3a" stroke-width="2.5"/>
<text x="334" y="226" text-anchor="middle" font-size="16" font-weight="bold" fill="#c0392b">C</text>
<text x="358" y="226" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b2a3a">T</text>
<text x="450" y="237" font-size="14" fill="#5b6b7a">target</text>
<rect x="347" y="250" width="24" height="24" fill="#c0392b"/>
<text x="359" y="268" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">A</text>
<text x="382" y="268" font-size="15" fill="#1b2a3a">extended by one</text>
<text x="382" y="286" font-size="15" fill="#1b2a3a">labelled base (red)</text>
<!-- summary panel I -->
<rect x="24" y="320" width="512" height="120" rx="8" fill="#f4f6f8"/>
<text x="40" y="348" font-size="15" fill="#1b2a3a">• the probe's 3' end sits <tspan font-weight="bold">on</tspan> the CpG C: only a match is extended</text>
<text x="40" y="374" font-size="15" fill="#1b2a3a">• M = intensity of the M bead, U = intensity of the U bead</text>
<text x="40" y="400" font-size="15" fill="#1b2a3a">• both beads report in <tspan font-weight="bold">one colour</tspan>, set by the next base</text>
<text x="40" y="426" font-size="15" fill="#1b2a3a">• other CpGs under the probe are assumed to share the state</text>
<!-- ============ Panel II ============ -->
<text x="840" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1b2a3a">Infinium II: one bead, two colours</text>
<text x="840" y="56" text-anchor="middle" font-size="15" fill="#5b6b7a">the probe stops one base before the CpG C</text>
<!-- methylated row -->
<circle cx="614" cy="140" r="26" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="2"/>
<text x="614" y="146" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b2a3a">II</text>
<rect x="640" y="136" width="240" height="9" fill="#5b6b7a"/>
<text x="700" y="128" text-anchor="middle" font-size="14" fill="#5b6b7a">R</text>
<line x1="646" y1="110" x2="990" y2="110" stroke="#1b2a3a" stroke-width="2.5"/>
<text x="892" y="104" text-anchor="middle" font-size="16" font-weight="bold" fill="#c0392b">C</text>
<text x="1000" y="115" font-size="14" fill="#5b6b7a">methylated</text>
<rect x="880" y="128" width="24" height="24" fill="#2e8b57"/>
<text x="892" y="146" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">G</text>
<text x="914" y="146" font-size="15" fill="#1b2a3a">green = M</text>
<!-- unmethylated row -->
<circle cx="614" cy="262" r="26" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="2"/>
<text x="614" y="268" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b2a3a">II</text>
<rect x="640" y="258" width="240" height="9" fill="#5b6b7a"/>
<text x="700" y="250" text-anchor="middle" font-size="14" fill="#5b6b7a">R</text>
<line x1="646" y1="232" x2="990" y2="232" stroke="#1b2a3a" stroke-width="2.5"/>
<text x="892" y="226" text-anchor="middle" font-size="16" font-weight="bold" fill="#c0392b">T</text>
<text x="1000" y="237" font-size="14" fill="#5b6b7a">unmethylated</text>
<rect x="880" y="250" width="24" height="24" fill="#c0392b"/>
<text x="892" y="268" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">A</text>
<text x="914" y="268" font-size="15" fill="#1b2a3a">red = U</text>
<!-- summary panel II -->
<rect x="584" y="320" width="512" height="120" rx="8" fill="#f4f6f8"/>
<text x="600" y="348" font-size="15" fill="#1b2a3a">• the extended base <tspan font-weight="bold">is</tspan> the readout: G (green) or A (red)</text>
<text x="600" y="374" font-size="15" fill="#1b2a3a">• M = green intensity, U = red intensity of the same bead</text>
<text x="600" y="400" font-size="15" fill="#1b2a3a">• other CpGs under the probe: degenerate base R (A/G)</text>
<text x="600" y="426" font-size="15" fill="#1b2a3a">• half the beads per CpG, so more CpGs fit on a chip</text>
</svg>
