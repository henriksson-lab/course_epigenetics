<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 430" width="1120" height="430" font-family="Helvetica, Arial, sans-serif">
  <rect width="1120" height="430" fill="#ffffff"/>
  <text x="20" y="28" font-size="18" font-weight="bold" fill="#1b2a3a">The background is estimated from the input, at four scales</text>
  <!-- input reads as ticks along a line -->
  <text x="20" y="66" font-size="15" fill="#5b6b7a">input reads</text>
  <line x1="130" y1="70" x2="1090" y2="70" stroke="#1b2a3a" stroke-width="1.5"/>
  <g stroke="#5b6b7a" stroke-width="2">
    <line x1="150" y1="70" x2="150" y2="58"/><line x1="210" y1="70" x2="210" y2="58"/><line x1="290" y1="70" x2="290" y2="58"/><line x1="350" y1="70" x2="350" y2="58"/>
    <line x1="430" y1="70" x2="430" y2="58"/><line x1="500" y1="70" x2="500" y2="58"/><line x1="560" y1="70" x2="560" y2="58"/>
    <line x1="604" y1="70" x2="604" y2="58"/><line x1="607" y1="70" x2="607" y2="56"/><line x1="610" y1="70" x2="610" y2="58"/><line x1="613" y1="70" x2="613" y2="56"/><line x1="616" y1="70" x2="616" y2="58"/>
    <line x1="660" y1="70" x2="660" y2="58"/><line x1="700" y1="70" x2="700" y2="58"/><line x1="780" y1="70" x2="780" y2="58"/><line x1="860" y1="70" x2="860" y2="58"/>
    <line x1="920" y1="70" x2="920" y2="58"/><line x1="1000" y1="70" x2="1000" y2="58"/><line x1="1060" y1="70" x2="1060" y2="58"/>
  </g>
  <line x1="610" y1="46" x2="610" y2="210" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="618" y="46" font-size="14" fill="#c0392b">candidate summit</text>
  <!-- windows -->
  <rect x="595" y="88" width="30" height="20" fill="#2a6f97" fill-opacity="0.55"/>
  <text x="640" y="103" font-size="15" fill="#1b2a3a">d = 100 bp</text>
  <rect x="560" y="118" width="100" height="20" fill="#2a6f97" fill-opacity="0.4"/>
  <text x="672" y="133" font-size="15" fill="#1b2a3a">1 kb</text>
  <rect x="140" y="148" width="940" height="20" fill="#2a6f97" fill-opacity="0.2"/>
  <text x="150" y="163" font-size="15" fill="#1b2a3a">10 kb</text>
  <text x="140" y="196" font-size="15" fill="#1b2a3a">genome: λ<tspan dy="4" font-size="11">BG</tspan><tspan dy="-4"> = (input reads × d) / genome size</tspan></text>

  <!-- table of the real example -->
  <rect x="20" y="222" width="640" height="196" rx="8" fill="#f4f6f8" stroke="#cfd8e0"/>
  <text x="36" y="248" font-size="16" font-weight="bold" fill="#1b2a3a">A real CTCF summit (chr21:33 605 968)</text>
  <g font-size="15" fill="#1b2a3a">
    <text x="36" y="276">λ<tspan dy="4" font-size="11">BG</tspan><tspan dy="-4"> = 116 397 × 100 / 40 088 619</tspan></text><text x="560" y="276" text-anchor="end">0.29</text>
    <text x="36" y="300">λ<tspan dy="4" font-size="11">d</tspan><tspan dy="-4">: 13 input reads in 100 bp × 100/100</tspan></text><text x="560" y="300" text-anchor="end" font-weight="bold" fill="#c0392b">13</text>
    <text x="36" y="324">λ<tspan dy="4" font-size="11">1k</tspan><tspan dy="-4">: 22 reads in 1 kb × 100/1000</tspan></text><text x="560" y="324" text-anchor="end">2.2</text>
    <text x="36" y="348">λ<tspan dy="4" font-size="11">10k</tspan><tspan dy="-4">: 43 reads in 10 kb × 100/10 000</tspan></text><text x="560" y="348" text-anchor="end">0.43</text>
    <text x="36" y="378">ChIP pileup k = 182 fragments × 0.589 (depth scaling)</text><text x="560" y="378" text-anchor="end">107</text>
    <text x="36" y="404" font-weight="bold">p = P(X ≥ 108 | λ = 13)</text><text x="560" y="404" text-anchor="end" font-weight="bold">10<tspan dy="-7" font-size="11">−59</tspan></text>
  </g>
  <!-- explanation -->
  <g font-size="15" fill="#1b2a3a">
    <text x="690" y="248" font-weight="bold">λ<tspan dy="4" font-size="11">local</tspan><tspan dy="-4"> = max of the four</tspan></text>
    <text x="690" y="274">Each window count is scaled to the</text>
    <text x="690" y="294">width d of one fragment, so all four</text>
    <text x="690" y="314">are "input fragments per base".</text>
    <text x="690" y="344">The larger library is scaled down to the</text>
    <text x="690" y="364">smaller one (here the ChIP, × 0.589).</text>
    <text x="690" y="394" fill="#5b6b7a">The maximum is conservative: any local</text>
    <text x="690" y="414" fill="#5b6b7a">excess in the input raises the bar.</text>
  </g>
</svg>
