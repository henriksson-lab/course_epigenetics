<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 430" width="1120" height="430" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7a"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a8324a"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2a6f97"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e67e22"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b4fa0"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8c564b"/></marker></defs>
<rect width="1120" height="430" fill="#ffffff"/>
<text x="20.0" y="30.0" font-size="17" text-anchor="start" font-weight="bold" fill="#1b2a3a">1. Simple pair: one read in each fragment</text>
<line x1="40.0" y1="80.0" x2="370.0" y2="80.0" stroke="#2a6f97" stroke-width="7" stroke-linecap="butt"/>
<text x="205.0" y="66.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#2a6f97">locus A</text>
<circle cx="370.0" cy="80.0" r="5.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<line x1="370.0" y1="80.0" x2="700.0" y2="80.0" stroke="#e67e22" stroke-width="7" stroke-linecap="butt"/>
<text x="535.0" y="66.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#e67e22">locus B</text>
<line x1="80.0" y1="105.0" x2="200.0" y2="105.0" stroke="#2a6f97" stroke-width="4" stroke-linecap="butt"/>
<line x1="80.0" y1="105.0" x2="200.0" y2="105.0" stroke="none" stroke-width="2" stroke-linecap="butt"/>
<line x1="190.0" y1="105.0" x2="200.0" y2="105.0" stroke="#1b2a3a" stroke-width="2" stroke-linecap="butt" marker-end="url(#ak)"/>
<line x1="570.0" y1="105.0" x2="690.0" y2="105.0" stroke="#e67e22" stroke-width="4" stroke-linecap="butt"/>
<line x1="690.0" y1="105.0" x2="570.0" y2="105.0" stroke="none" stroke-width="2" stroke-linecap="butt"/>
<line x1="580.0" y1="105.0" x2="570.0" y2="105.0" stroke="#1b2a3a" stroke-width="2" stroke-linecap="butt" marker-end="url(#ak)"/>
<text x="80.0" y="130.0" font-size="14" text-anchor="start" font-weight="normal" fill="#5b6b7a">read 1 (5' end →)</text>
<text x="690.0" y="130.0" font-size="14" text-anchor="end" font-weight="normal" fill="#5b6b7a">read 2</text>
<text x="760.0" y="90.0" font-size="15" text-anchor="start" font-weight="normal" fill="#1b2a3a">contact = (5' end of read 1,</text>
<text x="760.0" y="110.0" font-size="15" text-anchor="start" font-weight="normal" fill="#1b2a3a">5' end of read 2)  → pair type UU</text>
<text x="20.0" y="175.0" font-size="17" text-anchor="start" font-weight="bold" fill="#1b2a3a">2. Read 1 crosses the junction: a chimeric (split) read</text>
<line x1="40.0" y1="225.0" x2="370.0" y2="225.0" stroke="#2a6f97" stroke-width="7" stroke-linecap="butt"/>
<text x="205.0" y="211.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#2a6f97">locus A</text>
<circle cx="370.0" cy="225.0" r="5.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<line x1="370.0" y1="225.0" x2="700.0" y2="225.0" stroke="#e67e22" stroke-width="7" stroke-linecap="butt"/>
<text x="535.0" y="211.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#e67e22">locus B</text>
<line x1="240.0" y1="250.0" x2="370.0" y2="250.0" stroke="#2a6f97" stroke-width="4" stroke-linecap="butt"/>
<line x1="370.0" y1="250.0" x2="430.0" y2="250.0" stroke="#e67e22" stroke-width="4" stroke-linecap="butt"/>
<line x1="240.0" y1="250.0" x2="430.0" y2="250.0" stroke="none" stroke-width="2" stroke-linecap="butt"/>
<line x1="420.0" y1="250.0" x2="430.0" y2="250.0" stroke="#1b2a3a" stroke-width="2" stroke-linecap="butt" marker-end="url(#ak)"/>
<line x1="560.0" y1="250.0" x2="690.0" y2="250.0" stroke="#e67e22" stroke-width="4" stroke-linecap="butt"/>
<line x1="690.0" y1="250.0" x2="560.0" y2="250.0" stroke="none" stroke-width="2" stroke-linecap="butt"/>
<line x1="570.0" y1="250.0" x2="560.0" y2="250.0" stroke="#1b2a3a" stroke-width="2" stroke-linecap="butt" marker-end="url(#ak)"/>
<text x="240.0" y="275.0" font-size="14" text-anchor="start" font-weight="normal" fill="#5b6b7a">5' part maps to A, 3' part to B</text>
<text x="760.0" y="235.0" font-size="15" text-anchor="start" font-weight="normal" fill="#1b2a3a">report the 5'-most alignment of each</text>
<text x="760.0" y="255.0" font-size="15" text-anchor="start" font-weight="normal" fill="#1b2a3a">read: still the A–B contact;</text>
<text x="760.0" y="275.0" font-size="15" text-anchor="start" font-weight="normal" fill="#1b2a3a">"rescued" → pair type UR / RU</text>
<text x="20.0" y="320.0" font-size="17" text-anchor="start" font-weight="bold" fill="#1b2a3a">3. A walk: two or more ligation junctions in one molecule</text>
<line x1="40.0" y1="370.0" x2="260.0" y2="370.0" stroke="#2a6f97" stroke-width="7" stroke-linecap="butt"/>
<text x="150.0" y="356.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#2a6f97">A</text>
<circle cx="260.0" cy="370.0" r="5.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<line x1="260.0" y1="370.0" x2="480.0" y2="370.0" stroke="#e67e22" stroke-width="7" stroke-linecap="butt"/>
<text x="370.0" y="356.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#e67e22">B</text>
<circle cx="480.0" cy="370.0" r="5.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<line x1="480.0" y1="370.0" x2="700.0" y2="370.0" stroke="#2e8b57" stroke-width="7" stroke-linecap="butt"/>
<text x="590.0" y="356.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#2e8b57">C</text>
<line x1="150.0" y1="395.0" x2="260.0" y2="395.0" stroke="#2a6f97" stroke-width="4" stroke-linecap="butt"/>
<line x1="260.0" y1="395.0" x2="330.0" y2="395.0" stroke="#e67e22" stroke-width="4" stroke-linecap="butt"/>
<line x1="150.0" y1="395.0" x2="330.0" y2="395.0" stroke="none" stroke-width="2" stroke-linecap="butt"/>
<line x1="320.0" y1="395.0" x2="330.0" y2="395.0" stroke="#1b2a3a" stroke-width="2" stroke-linecap="butt" marker-end="url(#ak)"/>
<line x1="530.0" y1="395.0" x2="690.0" y2="395.0" stroke="#2e8b57" stroke-width="4" stroke-linecap="butt"/>
<line x1="690.0" y1="395.0" x2="530.0" y2="395.0" stroke="none" stroke-width="2" stroke-linecap="butt"/>
<line x1="540.0" y1="395.0" x2="530.0" y2="395.0" stroke="#1b2a3a" stroke-width="2" stroke-linecap="butt" marker-end="url(#ak)"/>
<text x="760.0" y="380.0" font-size="15" text-anchor="start" font-weight="normal" fill="#1b2a3a">three loci in one read pair: A–B–C;</text>
<text x="760.0" y="400.0" font-size="15" text-anchor="start" font-weight="normal" fill="#1b2a3a">policy: mask it (pair type WW), or</text>
<text x="760.0" y="420.0" font-size="15" text-anchor="start" font-weight="normal" fill="#1b2a3a">report the 5'-most unique sides (A–C)</text>
</svg>
