<text x="186.0" y="300.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#5b6b7a">contact → transcription</text>
<text x="186.0" y="322.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#5b6b7a">e.g. ZRS enhancer → Shh,</text>
<text x="186.0" y="344.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#5b6b7a">~1 Mb apart, in the limb bud</text>
