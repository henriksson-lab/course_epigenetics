<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 420" width="1120" height="420" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a8324a"/></marker><marker id="ahgr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7a"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2a6f97"/></marker></defs>
<rect width="1120" height="420" fill="#ffffff"/>
<text x="24" y="30" font-size="18" fill="#1b2a3a" text-anchor="start" font-weight="bold">Which generation is the first that was never exposed?</text>
<text x="24" y="62" font-size="17" fill="#1b2a3a" text-anchor="start" font-weight="bold">A  Mother exposed while pregnant</text>
<ellipse cx="110" cy="200" rx="58" ry="74" fill="#fbeaea" stroke="#1b2a3a" stroke-width="2"/>
<text x="110" y="116" font-size="16" fill="#1b2a3a" text-anchor="middle" font-weight="bold">F0 mother</text>
<circle cx="110" cy="214" r="28" fill="#ffffff" stroke="#1b2a3a" stroke-width="2"/>
<text x="110" y="208" font-size="14" fill="#1b2a3a" text-anchor="middle" font-weight="bold">F1</text>
<circle cx="102" cy="228" r="3.5" fill="#c0392b" stroke="#c0392b" stroke-width="1"/>
<circle cx="110" cy="228" r="3.5" fill="#c0392b" stroke="#c0392b" stroke-width="1"/>
<circle cx="118" cy="228" r="3.5" fill="#c0392b" stroke="#c0392b" stroke-width="1"/>
<path d="M46,138 l12,-22 l-5,17 l15,-5 l-15,27 l5,-17 z" fill="#c0392b" stroke="#c0392b" stroke-width="1"/>
<text x="110" y="300" font-size="14" fill="#5b6b7a" text-anchor="middle">exposed body</text>
<line x1="176" y1="200" x2="226" y2="200" stroke="#1b2a3a" stroke-width="2" marker-end="url(#ah)"/>
<ellipse cx="290" cy="200" rx="58" ry="74" fill="#fbeaea" stroke="#1b2a3a" stroke-width="2"/>
<text x="290" y="116" font-size="16" fill="#1b2a3a" text-anchor="middle" font-weight="bold">F1</text>
<circle cx="280" cy="214" r="4" fill="#c0392b" stroke="#c0392b" stroke-width="1"/>
<circle cx="290" cy="214" r="4" fill="#c0392b" stroke="#c0392b" stroke-width="1"/>
<circle cx="300" cy="214" r="4" fill="#c0392b" stroke="#c0392b" stroke-width="1"/>
<text x="290" y="300" font-size="14" fill="#5b6b7a" text-anchor="middle">exposed as embryo;</text>
<text x="290" y="318" font-size="14" fill="#5b6b7a" text-anchor="middle">its germ cells (F2)</text>
<text x="290" y="336" font-size="14" fill="#5b6b7a" text-anchor="middle">exposed too</text>
<line x1="356" y1="200" x2="406" y2="200" stroke="#1b2a3a" stroke-width="2" marker-end="url(#ah)"/>
<ellipse cx="460" cy="200" rx="46" ry="60" fill="#fbeaea" stroke="#1b2a3a" stroke-width="2"/>
<text x="460" y="128" font-size="16" fill="#1b2a3a" text-anchor="middle" font-weight="bold">F2</text>
<text x="460" y="300" font-size="14" fill="#5b6b7a" text-anchor="middle">exposed as</text>
<text x="460" y="318" font-size="14" fill="#5b6b7a" text-anchor="middle">germ cell</text>
<line x1="514" y1="200" x2="560" y2="200" stroke="#1b2a3a" stroke-width="2" marker-end="url(#ah)"/>
<ellipse cx="606" cy="200" rx="40" ry="52" fill="#eaf5ee" stroke="#2e8b57" stroke-width="2.5"/>
<text x="606" y="136" font-size="16" fill="#2e8b57" text-anchor="middle" font-weight="bold">F3</text>
<text x="606" y="300" font-size="14" fill="#2e8b57" text-anchor="middle" font-weight="bold">first never</text>
<text x="606" y="318" font-size="14" fill="#2e8b57" text-anchor="middle" font-weight="bold">exposed</text>
<circle cx="34" cy="380" r="5" fill="#c0392b" stroke="#c0392b" stroke-width="1"/>
<text x="46" y="385" font-size="14" fill="#1b2a3a" text-anchor="start">germ cells: the next generation, already inside the exposed body</text>
<line x1="680" y1="60" x2="680" y2="400" stroke="#d5dde5" stroke-width="1.5"/>
<text x="704" y="62" font-size="17" fill="#1b2a3a" text-anchor="start" font-weight="bold">B  Father (or non-pregnant mother) exposed</text>
<ellipse cx="780" cy="200" rx="52" ry="70" fill="#fbeaea" stroke="#1b2a3a" stroke-width="2"/>
<text x="780" y="120" font-size="16" fill="#1b2a3a" text-anchor="middle" font-weight="bold">F0 father</text>
<path d="M716,138 l12,-22 l-5,17 l15,-5 l-15,27 l5,-17 z" fill="#c0392b" stroke="#c0392b" stroke-width="1"/>
<circle cx="770" cy="214" r="4" fill="#c0392b" stroke="#c0392b" stroke-width="1"/>
<circle cx="780" cy="214" r="4" fill="#c0392b" stroke="#c0392b" stroke-width="1"/>
<circle cx="790" cy="214" r="4" fill="#c0392b" stroke="#c0392b" stroke-width="1"/>
<text x="780" y="300" font-size="14" fill="#5b6b7a" text-anchor="middle">exposed body</text>
<text x="780" y="318" font-size="14" fill="#5b6b7a" text-anchor="middle">and sperm (F1)</text>
<line x1="838" y1="200" x2="884" y2="200" stroke="#1b2a3a" stroke-width="2" marker-end="url(#ah)"/>
<ellipse cx="936" cy="200" rx="46" ry="60" fill="#fbeaea" stroke="#1b2a3a" stroke-width="2"/>
<text x="936" y="128" font-size="16" fill="#1b2a3a" text-anchor="middle" font-weight="bold">F1</text>
<text x="936" y="300" font-size="14" fill="#5b6b7a" text-anchor="middle">exposed as</text>
<text x="936" y="318" font-size="14" fill="#5b6b7a" text-anchor="middle">germ cell</text>
<line x1="988" y1="200" x2="1030" y2="200" stroke="#1b2a3a" stroke-width="2" marker-end="url(#ah)"/>
<ellipse cx="1068" cy="200" rx="38" ry="50" fill="#eaf5ee" stroke="#2e8b57" stroke-width="2.5"/>
<text x="1068" y="138" font-size="16" fill="#2e8b57" text-anchor="middle" font-weight="bold">F2</text>
<text x="1068" y="300" font-size="14" fill="#2e8b57" text-anchor="middle" font-weight="bold">first never</text>
<text x="1068" y="318" font-size="14" fill="#2e8b57" text-anchor="middle" font-weight="bold">exposed</text>
<text x="704" y="370" font-size="15" fill="#1b2a3a" text-anchor="start">An effect in F1 (or F2 after a pregnancy exposure) is</text>
<text x="704" y="390" font-size="15" fill="#1b2a3a" text-anchor="start">intergenerational: it can be a direct effect of the exposure.</text>
</svg>
