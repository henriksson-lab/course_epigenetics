<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 330" width="1120" height="330" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a8324a"/></marker><marker id="ahgr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7a"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2a6f97"/></marker></defs>
<rect width="1120" height="330" fill="#ffffff"/>
<text x="24" y="30" font-size="18" fill="#1b2a3a" text-anchor="start" font-weight="bold">How often do heritable changes arise? Arabidopsis mutation-accumulation lines</text>
<line x1="260" y1="250" x2="1060" y2="250" stroke="#1b2a3a" stroke-width="1.5"/>
<line x1="260.0" y1="250" x2="260.0" y2="256" stroke="#1b2a3a" stroke-width="1.5"/>
<text x="260.0" y="276" font-size="14" fill="#1b2a3a" text-anchor="middle">10<tspan dy="-7" font-size="11">−10</tspan></text>
<line x1="360.0" y1="250" x2="360.0" y2="256" stroke="#1b2a3a" stroke-width="1.5"/>
<text x="360.0" y="276" font-size="14" fill="#1b2a3a" text-anchor="middle">10<tspan dy="-7" font-size="11">−9</tspan></text>
<line x1="460.0" y1="250" x2="460.0" y2="256" stroke="#1b2a3a" stroke-width="1.5"/>
<text x="460.0" y="276" font-size="14" fill="#1b2a3a" text-anchor="middle">10<tspan dy="-7" font-size="11">−8</tspan></text>
<line x1="560.0" y1="250" x2="560.0" y2="256" stroke="#1b2a3a" stroke-width="1.5"/>
<text x="560.0" y="276" font-size="14" fill="#1b2a3a" text-anchor="middle">10<tspan dy="-7" font-size="11">−7</tspan></text>
<line x1="660.0" y1="250" x2="660.0" y2="256" stroke="#1b2a3a" stroke-width="1.5"/>
<text x="660.0" y="276" font-size="14" fill="#1b2a3a" text-anchor="middle">10<tspan dy="-7" font-size="11">−6</tspan></text>
<line x1="760.0" y1="250" x2="760.0" y2="256" stroke="#1b2a3a" stroke-width="1.5"/>
<text x="760.0" y="276" font-size="14" fill="#1b2a3a" text-anchor="middle">10<tspan dy="-7" font-size="11">−5</tspan></text>
<line x1="860.0" y1="250" x2="860.0" y2="256" stroke="#1b2a3a" stroke-width="1.5"/>
<text x="860.0" y="276" font-size="14" fill="#1b2a3a" text-anchor="middle">10<tspan dy="-7" font-size="11">−4</tspan></text>
<line x1="960.0" y1="250" x2="960.0" y2="256" stroke="#1b2a3a" stroke-width="1.5"/>
<text x="960.0" y="276" font-size="14" fill="#1b2a3a" text-anchor="middle">10<tspan dy="-7" font-size="11">−3</tspan></text>
<line x1="1060.0" y1="250" x2="1060.0" y2="256" stroke="#1b2a3a" stroke-width="1.5"/>
<text x="1060.0" y="276" font-size="14" fill="#1b2a3a" text-anchor="middle">10<tspan dy="-7" font-size="11">−2</tspan></text>
<text x="660.0" y="306" font-size="15" fill="#1b2a3a" text-anchor="middle">rate per site per generation (log scale)</text>
<text x="248" y="114" font-size="15" fill="#1b2a3a" text-anchor="end" font-weight="bold">DNA base substitution</text>
<rect x="260" y="90" width="184.50980400142566" height="38" rx="3" fill="#5b6b7a" stroke="none" stroke-width="0"/>
<text x="454.50980400142566" y="115" font-size="15" fill="#1b2a3a" text-anchor="start">7 × 10<tspan dy="-7" font-size="11">−9</tspan><tspan dy="7"> (Ossowski et al. 2010)</tspan></text>
<text x="248" y="194" font-size="15" fill="#1b2a3a" text-anchor="end" font-weight="bold">CG methylation gain or loss</text>
<rect x="260" y="170" width="600.0" height="38" rx="3" fill="#c0392b" stroke="none" stroke-width="0"/>
<text x="870.0" y="195" font-size="15" fill="#1b2a3a" text-anchor="start">about 10<tspan dy="-7" font-size="11">−4</tspan><tspan dy="7"> (van der Graaf et al. 2015)</tspan></text>
<text x="260" y="222" font-size="15" fill="#5b6b7a" text-anchor="start">about five orders of magnitude apart: epialleles arise often, and many also revert</text>
</svg>
