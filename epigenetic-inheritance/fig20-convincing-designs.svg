<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 392" width="1120" height="392" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a8324a"/></marker><marker id="ahgr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7a"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2a6f97"/></marker></defs>
<rect width="1120" height="392" fill="#ffffff"/>
<text x="24" y="30" font-size="18" fill="#1b2a3a" text-anchor="start" font-weight="bold">Designs that close the alternative routes</text>
<text x="40" y="66" font-size="15" fill="#5b6b7a" text-anchor="start" font-weight="bold">design element</text>
<text x="300" y="66" font-size="15" fill="#5b6b7a" text-anchor="start" font-weight="bold">what it means</text>
<text x="860" y="66" font-size="15" fill="#5b6b7a" text-anchor="start" font-weight="bold">closes</text>
<rect x="24" y="78" width="1072" height="33" rx="6" fill="#ffffff" stroke="#d5dde5" stroke-width="1"/>
<text x="40" y="100" font-size="15" fill="#1b2a3a" text-anchor="start" font-weight="bold">isogenic animals</text>
<text x="300" y="100" font-size="15" fill="#1b2a3a" text-anchor="start">inbred strain: no genetic differences</text>
<text x="860" y="100" font-size="15" fill="#2e8b57" text-anchor="start" font-weight="bold">shared genes</text>
<rect x="24" y="117" width="1072" height="33" rx="6" fill="#f4f6f8" stroke="#d5dde5" stroke-width="1"/>
<text x="40" y="139" font-size="15" fill="#1b2a3a" text-anchor="start" font-weight="bold">IVF + embryo transfer</text>
<text x="300" y="139" font-size="15" fill="#1b2a3a" text-anchor="start">gametes from exposed parent, unexposed surrogate</text>
<text x="860" y="139" font-size="15" fill="#2e8b57" text-anchor="start" font-weight="bold">uterus, behaviour</text>
<rect x="24" y="156" width="1072" height="33" rx="6" fill="#ffffff" stroke="#d5dde5" stroke-width="1"/>
<text x="40" y="178" font-size="15" fill="#1b2a3a" text-anchor="start" font-weight="bold">cross-fostering</text>
<text x="300" y="178" font-size="15" fill="#1b2a3a" text-anchor="start">pups raised by unexposed mothers</text>
<text x="860" y="178" font-size="15" fill="#2e8b57" text-anchor="start" font-weight="bold">milk, care, microbes</text>
<rect x="24" y="195" width="1072" height="33" rx="6" fill="#f4f6f8" stroke="#d5dde5" stroke-width="1"/>
<text x="40" y="217" font-size="15" fill="#1b2a3a" text-anchor="start" font-weight="bold">the right generation</text>
<text x="300" y="217" font-size="15" fill="#1b2a3a" text-anchor="start">F3 after pregnancy, F2 after paternal exposure</text>
<text x="860" y="217" font-size="15" fill="#2e8b57" text-anchor="start" font-weight="bold">direct exposure</text>
<rect x="24" y="234" width="1072" height="33" rx="6" fill="#ffffff" stroke="#d5dde5" stroke-width="1"/>
<text x="40" y="256" font-size="15" fill="#1b2a3a" text-anchor="start" font-weight="bold">litter as the unit</text>
<text x="300" y="256" font-size="15" fill="#1b2a3a" text-anchor="start">several independent litters per group</text>
<text x="860" y="256" font-size="15" fill="#2e8b57" text-anchor="start" font-weight="bold">pseudo-replication</text>
<rect x="24" y="273" width="1072" height="33" rx="6" fill="#f4f6f8" stroke="#d5dde5" stroke-width="1"/>
<text x="40" y="295" font-size="15" fill="#1b2a3a" text-anchor="start" font-weight="bold">pre-registered tests</text>
<text x="300" y="295" font-size="15" fill="#1b2a3a" text-anchor="start">few outcomes, multiple-testing correction</text>
<text x="860" y="295" font-size="15" fill="#2e8b57" text-anchor="start" font-weight="bold">chance</text>
<rect x="24" y="312" width="1072" height="33" rx="6" fill="#ffffff" stroke="#d5dde5" stroke-width="1"/>
<text x="40" y="334" font-size="15" fill="#1b2a3a" text-anchor="start" font-weight="bold">a carrier</text>
<text x="300" y="334" font-size="15" fill="#1b2a3a" text-anchor="start">inject the RNA, edit the locus: phenotype follows</text>
<text x="860" y="334" font-size="15" fill="#2e8b57" text-anchor="start" font-weight="bold">mechanism</text>
<rect x="24" y="351" width="1072" height="33" rx="6" fill="#f4f6f8" stroke="#d5dde5" stroke-width="1"/>
<text x="40" y="373" font-size="15" fill="#1b2a3a" text-anchor="start" font-weight="bold">replication</text>
<text x="300" y="373" font-size="15" fill="#1b2a3a" text-anchor="start">an independent lab, a second cohort</text>
<text x="860" y="373" font-size="15" fill="#2e8b57" text-anchor="start" font-weight="bold">all of the above</text>
</svg>
