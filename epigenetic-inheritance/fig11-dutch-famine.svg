<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 360" width="1120" height="360" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a8324a"/></marker><marker id="ahgr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7a"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2a6f97"/></marker></defs>
<rect width="1120" height="360" fill="#ffffff"/>
<text x="24" y="30" font-size="18" fill="#1b2a3a" text-anchor="start" font-weight="bold">Dutch Hunger Winter 1944–45: a sibling design (Heijmans et al. 2008)</text>
<line x1="40" y1="120" x2="700" y2="120" stroke="#1b2a3a" stroke-width="2"/>
<line x1="60" y1="114" x2="60" y2="126" stroke="#1b2a3a" stroke-width="1.5"/>
<text x="60" y="146" font-size="14" fill="#1b2a3a" text-anchor="middle">1943</text>
<line x1="220" y1="114" x2="220" y2="126" stroke="#1b2a3a" stroke-width="1.5"/>
<text x="220" y="146" font-size="14" fill="#1b2a3a" text-anchor="middle">1944</text>
<line x1="380" y1="114" x2="380" y2="126" stroke="#1b2a3a" stroke-width="1.5"/>
<text x="380" y="146" font-size="14" fill="#1b2a3a" text-anchor="middle">1945</text>
<line x1="540" y1="114" x2="540" y2="126" stroke="#1b2a3a" stroke-width="1.5"/>
<text x="540" y="146" font-size="14" fill="#1b2a3a" text-anchor="middle">1946</text>
<rect x="353" y="108" width="80" height="24" rx="4" fill="#fbeaea" stroke="#c0392b" stroke-width="1.6"/>
<text x="393" y="98" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="bold">famine</text>
<circle cx="393" cy="120" r="8" fill="#c0392b" stroke="#1b2a3a" stroke-width="1.5"/>
<text x="393" y="180" font-size="14" fill="#1b2a3a" text-anchor="middle">conceived in</text>
<text x="393" y="198" font-size="14" fill="#1b2a3a" text-anchor="middle">the famine (n = 60)</text>
<circle cx="600" cy="120" r="8" fill="#ffffff" stroke="#1b2a3a" stroke-width="1.8"/>
<text x="600" y="180" font-size="14" fill="#1b2a3a" text-anchor="middle">same-sex sibling,</text>
<text x="600" y="198" font-size="14" fill="#1b2a3a" text-anchor="middle">conceived before or after</text>
<line x1="393" y1="206" x2="393" y2="236" stroke="#1b2a3a" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="600" y1="206" x2="600" y2="236" stroke="#1b2a3a" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="496" y="262" font-size="15" fill="#1b2a3a" text-anchor="middle" font-weight="bold">~60 years later: blood DNA, IGF2 DMR methylation</text>
<text x="393" y="290" font-size="18" fill="#c0392b" text-anchor="middle" font-weight="bold">0.488</text>
<text x="600" y="290" font-size="18" fill="#1b2a3a" text-anchor="middle" font-weight="bold">0.515</text>
<text x="496" y="320" font-size="14" fill="#1b2a3a" text-anchor="middle">5.2% lower in the exposed (0.48 SD of the controls), p &lt; 0.0001</text>
<line x1="740" y1="50" x2="740" y2="340" stroke="#d5dde5" stroke-width="1.5"/>
<text x="760" y="72" font-size="16" fill="#1b2a3a" text-anchor="start" font-weight="bold">What the design controls</text>
<text x="760" y="96" font-size="15" fill="#2e8b57" text-anchor="start">half the genetic background</text>
<text x="760" y="117" font-size="15" fill="#2e8b57" text-anchor="start">family environment, social class</text>
<text x="760" y="138" font-size="15" fill="#2e8b57" text-anchor="start">age at sampling (roughly)</text>
<text x="760" y="172" font-size="16" fill="#1b2a3a" text-anchor="start" font-weight="bold">What it does not show</text>
<text x="760" y="196" font-size="15" fill="#1b2a3a" text-anchor="start">inheritance: the exposed person was</text>
<text x="760" y="216" font-size="15" fill="#1b2a3a" text-anchor="start">an embryo at the time (F1)</text>
<text x="760" y="236" font-size="15" fill="#1b2a3a" text-anchor="start"></text>
<text x="760" y="256" font-size="15" fill="#1b2a3a" text-anchor="start">that the methylation change causes</text>
<text x="760" y="276" font-size="15" fill="#1b2a3a" text-anchor="start">disease</text>
<text x="760" y="296" font-size="15" fill="#1b2a3a" text-anchor="start"></text>
<text x="760" y="316" font-size="15" fill="#1b2a3a" text-anchor="start">the effect in other tissues</text>
<text x="760" y="336" font-size="15" fill="#1b2a3a" text-anchor="start">(only blood was measured)</text>
</svg>
