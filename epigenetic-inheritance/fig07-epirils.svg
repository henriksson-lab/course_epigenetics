<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 372" width="1120" height="372" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a8324a"/></marker><marker id="ahgr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7a"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2a6f97"/></marker></defs>
<rect width="1120" height="372" fill="#ffffff"/>
<text x="24" y="30" font-size="18" fill="#1b2a3a" text-anchor="start" font-weight="bold">Arabidopsis epiRILs: same DNA, different methylation, heritable traits</text>
<text x="40" y="72" font-size="15" fill="#1b2a3a" text-anchor="start" font-weight="bold">wild type</text>
<rect x="40" y="82" width="150" height="16" rx="0" fill="#2a6f97" stroke="none" stroke-width="0"/>
<rect x="40" y="82" width="150" height="16" rx="5" fill="none" stroke="#1b2a3a" stroke-width="1.5"/>
<text x="40" y="132" font-size="15" fill="#1b2a3a" text-anchor="start" font-weight="bold">ddm1 or met1 mutant</text>
<rect x="40" y="142" width="150" height="16" rx="0" fill="#e9c46a" stroke="none" stroke-width="0"/>
<rect x="40" y="142" width="150" height="16" rx="5" fill="none" stroke="#1b2a3a" stroke-width="1.5"/>
<text x="40" y="192" font-size="14" fill="#5b6b7a" text-anchor="start">same accession (Col-0):</text>
<text x="40" y="210" font-size="14" fill="#5b6b7a" text-anchor="start">almost no DNA differences</text>
<line x1="206" y1="120" x2="256" y2="120" stroke="#1b2a3a" stroke-width="2" marker-end="url(#ah)"/>
<rect x="262" y="70" width="220" height="140" rx="10" fill="#f4f6f8" stroke="none" stroke-width="0"/>
<text x="372" y="96" font-size="15" fill="#1b2a3a" text-anchor="middle">cross, backcross,</text>
<text x="372" y="116" font-size="15" fill="#1b2a3a" text-anchor="middle">keep plants with</text>
<text x="372" y="136" font-size="15" fill="#1b2a3a" text-anchor="middle">wild-type DDM1/MET1,</text>
<text x="372" y="160" font-size="15" fill="#1b2a3a" text-anchor="middle">then self-fertilise</text>
<text x="372" y="180" font-size="15" fill="#1b2a3a" text-anchor="middle">for ~ 8 generations</text>
<line x1="488" y1="140" x2="538" y2="140" stroke="#1b2a3a" stroke-width="2" marker-end="url(#ah)"/>
<text x="548" y="77" font-size="14" fill="#5b6b7a" text-anchor="start">line 1</text>
<rect x="604" y="64" width="51.0" height="18" rx="0" fill="#2a6f97" stroke="none" stroke-width="0"/>
<rect x="655.0" y="64" width="42.5" height="18" rx="0" fill="#e9c46a" stroke="none" stroke-width="0"/>
<rect x="697.5" y="64" width="76.5" height="18" rx="0" fill="#2a6f97" stroke="none" stroke-width="0"/>
<rect x="604" y="64" width="170" height="18" rx="5" fill="none" stroke="#1b2a3a" stroke-width="1.5"/>
<text x="548" y="111" font-size="14" fill="#5b6b7a" text-anchor="start">line 2</text>
<rect x="604" y="98" width="102.0" height="18" rx="0" fill="#e9c46a" stroke="none" stroke-width="0"/>
<rect x="706.0" y="98" width="68.0" height="18" rx="0" fill="#2a6f97" stroke="none" stroke-width="0"/>
<rect x="604" y="98" width="170" height="18" rx="5" fill="none" stroke="#1b2a3a" stroke-width="1.5"/>
<text x="548" y="145" font-size="14" fill="#5b6b7a" text-anchor="start">line 3</text>
<rect x="604" y="132" width="25.5" height="18" rx="0" fill="#2a6f97" stroke="none" stroke-width="0"/>
<rect x="629.5" y="132" width="34.0" height="18" rx="0" fill="#e9c46a" stroke="none" stroke-width="0"/>
<rect x="663.5" y="132" width="51.0" height="18" rx="0" fill="#2a6f97" stroke="none" stroke-width="0"/>
<rect x="714.5" y="132" width="59.49999999999999" height="18" rx="0" fill="#e9c46a" stroke="none" stroke-width="0"/>
<rect x="604" y="132" width="170" height="18" rx="5" fill="none" stroke="#1b2a3a" stroke-width="1.5"/>
<text x="548" y="179" font-size="14" fill="#5b6b7a" text-anchor="start">line 4</text>
<rect x="604" y="166" width="136.0" height="18" rx="0" fill="#2a6f97" stroke="none" stroke-width="0"/>
<rect x="740.0" y="166" width="34.0" height="18" rx="0" fill="#e9c46a" stroke="none" stroke-width="0"/>
<rect x="604" y="166" width="170" height="18" rx="5" fill="none" stroke="#1b2a3a" stroke-width="1.5"/>
<text x="548" y="213" font-size="14" fill="#5b6b7a" text-anchor="start">line 5</text>
<rect x="604" y="200" width="68.0" height="18" rx="0" fill="#e9c46a" stroke="none" stroke-width="0"/>
<rect x="672.0" y="200" width="102.0" height="18" rx="0" fill="#2a6f97" stroke="none" stroke-width="0"/>
<rect x="604" y="200" width="170" height="18" rx="5" fill="none" stroke="#1b2a3a" stroke-width="1.5"/>
<text x="690" y="250" font-size="14" fill="#1b2a3a" text-anchor="middle">each line: a different mosaic</text>
<text x="690" y="268" font-size="14" fill="#1b2a3a" text-anchor="middle">of methylation epialleles</text>
<rect x="548" y="290" width="14" height="14" fill="#2a6f97"/>
<text x="568" y="302" font-size="14" fill="#1b2a3a" text-anchor="start">wild-type methylation</text>
<rect x="548" y="314" width="14" height="14" fill="#e9c46a"/>
<text x="568" y="326" font-size="14" fill="#1b2a3a" text-anchor="start">hypomethylated (from mutant)</text>
<line x1="800" y1="50" x2="800" y2="330" stroke="#d5dde5" stroke-width="1.5"/>
<text x="820" y="72" font-size="16" fill="#1b2a3a" text-anchor="start" font-weight="bold">What it showed</text>
<text x="820" y="100" font-size="15" fill="#1b2a3a" text-anchor="start">flowering time and plant height</text>
<text x="820" y="121" font-size="15" fill="#1b2a3a" text-anchor="start">vary between lines and are</text>
<text x="820" y="142" font-size="15" fill="#1b2a3a" text-anchor="start">heritable (~30%; Johannes 2009)</text>
<text x="820" y="163" font-size="15" fill="#1b2a3a" text-anchor="start"></text>
<text x="820" y="184" font-size="15" fill="#1b2a3a" text-anchor="start">DMRs mapped as epigenetic QTL</text>
<text x="820" y="205" font-size="15" fill="#1b2a3a" text-anchor="start">explain 60–90% of the heritability</text>
<text x="820" y="226" font-size="15" fill="#1b2a3a" text-anchor="start">of flowering time and root length</text>
<text x="820" y="247" font-size="15" fill="#1b2a3a" text-anchor="start">(Cortijo et al. 2014)</text>
<text x="820" y="268" font-size="15" fill="#5b6b7a" text-anchor="start"></text>
<text x="820" y="289" font-size="15" fill="#5b6b7a" text-anchor="start">induced epialleles: proof of</text>
<text x="820" y="310" font-size="15" fill="#5b6b7a" text-anchor="start">principle, not natural variation</text>
<text x="24" y="360" font-size="14" fill="#5b6b7a" text-anchor="start">Most epialleles were stable for 8 generations; some regained methylation (guided by small RNAs, RNA-directed DNA methylation).</text>
</svg>
