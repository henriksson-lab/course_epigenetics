<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 390" width="1120" height="390" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a8324a"/></marker><marker id="ahgr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7a"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2a6f97"/></marker></defs>
<rect width="1120" height="390" fill="#ffffff"/>
<text x="24" y="24" font-size="18" fill="#1b2a3a" text-anchor="start" font-weight="bold">Two waves of DNA methylation reprogramming in the mouse</text>
<line x1="110" y1="330" x2="1090" y2="330" stroke="#1b2a3a" stroke-width="1.8"/>
<line x1="110" y1="330" x2="110" y2="100" stroke="#1b2a3a" stroke-width="1.8"/>
<text x="40" y="205" font-size="15" fill="#1b2a3a" text-anchor="middle">CpG</text>
<text x="40" y="225" font-size="15" fill="#1b2a3a" text-anchor="middle">methylation</text>
<text x="102" y="115" font-size="13" fill="#5b6b7a" text-anchor="end">high</text>
<text x="102" y="330" font-size="13" fill="#5b6b7a" text-anchor="end">low</text>
<line x1="140" y1="330" x2="140" y2="336" stroke="#1b2a3a" stroke-width="1.5"/>
<text x="140" y="354" font-size="14" fill="#1b2a3a" text-anchor="middle">gametes</text>
<line x1="230" y1="330" x2="230" y2="336" stroke="#1b2a3a" stroke-width="1.5"/>
<text x="230" y="354" font-size="14" fill="#1b2a3a" text-anchor="middle">zygote</text>
<line x1="350" y1="330" x2="350" y2="336" stroke="#1b2a3a" stroke-width="1.5"/>
<text x="350" y="354" font-size="14" fill="#1b2a3a" text-anchor="middle">blastocyst</text>
<line x1="470" y1="330" x2="470" y2="336" stroke="#1b2a3a" stroke-width="1.5"/>
<text x="470" y="354" font-size="14" fill="#1b2a3a" text-anchor="middle">epiblast</text>
<line x1="590" y1="330" x2="590" y2="336" stroke="#1b2a3a" stroke-width="1.5"/>
<text x="590" y="354" font-size="14" fill="#1b2a3a" text-anchor="middle">PGCs</text>
<line x1="760" y1="330" x2="760" y2="336" stroke="#1b2a3a" stroke-width="1.5"/>
<text x="760" y="354" font-size="14" fill="#1b2a3a" text-anchor="middle">PGCs in gonad</text>
<line x1="940" y1="330" x2="940" y2="336" stroke="#1b2a3a" stroke-width="1.5"/>
<text x="940" y="354" font-size="14" fill="#1b2a3a" text-anchor="middle">new gametes</text>
<path d="M140,143.0 C200,198.0 260,253.0 350,281.6 C400,286.0 420,176.0 470,165.0 L1080,165.0" fill="none" stroke="#2a6f97" stroke-width="3"/>
<text x="1080" y="187.0" font-size="14" fill="#2a6f97" text-anchor="end" font-weight="bold">body (soma)</text>
<path d="M520,165.0 C560,198.0 600,253.0 680,286.0 C720,312.4 760,321.2 820,321.2 C880,319.0 900,198.0 960,154.0 L1000,149.60000000000002" fill="none" stroke="#c0392b" stroke-width="3"/>
<text x="560" y="281.6" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="bold">germline</text>
<rect x="180" y="40" width="250" height="54" rx="8" fill="#eaf1f7" stroke="none" stroke-width="0"/>
<text x="305" y="62" font-size="15" fill="#2a6f97" text-anchor="middle" font-weight="bold">wave 1: preimplantation</text>
<text x="305" y="84" font-size="14" fill="#1b2a3a" text-anchor="middle">imprints are protected</text>
<rect x="560" y="40" width="300" height="54" rx="8" fill="#fbeaea" stroke="none" stroke-width="0"/>
<text x="710" y="62" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="bold">wave 2: primordial germ cells</text>
<text x="710" y="84" font-size="14" fill="#1b2a3a" text-anchor="middle">imprints are erased and reset</text>
<text x="1090" y="376" font-size="13" fill="#5b6b7a" text-anchor="end">schematic, after Seisenberger et al. 2012</text>
</svg>
