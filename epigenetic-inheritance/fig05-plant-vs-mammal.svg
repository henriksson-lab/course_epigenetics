<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 380" width="1120" height="380" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a8324a"/></marker><marker id="ahgr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7a"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2a6f97"/></marker></defs>
<rect width="1120" height="380" fill="#ffffff"/>
<text x="24" y="30" font-size="18" fill="#1b2a3a" text-anchor="start" font-weight="bold">A  Mammals: germline set aside early</text>
<ellipse cx="120" cy="170" rx="80" ry="70" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="2"/>
<text x="120" y="90" font-size="15" fill="#1b2a3a" text-anchor="middle">early embryo</text>
<circle cx="108" cy="190" r="6" fill="#c0392b" stroke="#1b2a3a" stroke-width="1.2"/>
<circle cx="120" cy="190" r="6" fill="#c0392b" stroke="#1b2a3a" stroke-width="1.2"/>
<circle cx="132" cy="190" r="6" fill="#c0392b" stroke="#1b2a3a" stroke-width="1.2"/>
<text x="120" y="150" font-size="15" fill="#2a6f97" text-anchor="middle" font-weight="bold">soma</text>
<line x1="206" y1="170" x2="262" y2="170" stroke="#1b2a3a" stroke-width="2" marker-end="url(#ah)"/>
<ellipse cx="340" cy="170" rx="70" ry="90" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="2"/>
<text x="340" y="150" font-size="15" fill="#2a6f97" text-anchor="middle" font-weight="bold">adult body</text>
<circle cx="328" cy="200" r="6" fill="#c0392b" stroke="#1b2a3a" stroke-width="1.2"/>
<circle cx="340" cy="200" r="6" fill="#c0392b" stroke="#1b2a3a" stroke-width="1.2"/>
<circle cx="352" cy="200" r="6" fill="#c0392b" stroke="#1b2a3a" stroke-width="1.2"/>
<text x="340" y="290" font-size="15" fill="#1b2a3a" text-anchor="middle">germ cells were separated</text>
<text x="340" y="310" font-size="15" fill="#1b2a3a" text-anchor="middle">before the body formed;</text>
<text x="340" y="330" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="bold">methylation erased in PGCs</text>
<circle cx="40" cy="362" r="6" fill="#c0392b" stroke="#1b2a3a" stroke-width="1.2"/>
<text x="54" y="367" font-size="14" fill="#1b2a3a" text-anchor="start">germ cells</text>
<line x1="560" y1="50" x2="560" y2="370" stroke="#d5dde5" stroke-width="1.5"/>
<text x="584" y="30" font-size="18" fill="#1b2a3a" text-anchor="start" font-weight="bold">B  Plants: germ cells form late, from the shoot</text>
<line x1="780" y1="320" x2="780" y2="120" stroke="#2e8b57" stroke-width="4"/>
<ellipse cx="740" cy="260" rx="38" ry="12" fill="#8ab17d" stroke="#2e8b57" stroke-width="1.5" transform="rotate(20 740 260)"/>
<ellipse cx="820" cy="220" rx="38" ry="12" fill="#8ab17d" stroke="#2e8b57" stroke-width="1.5" transform="rotate(-20 820 220)"/>
<ellipse cx="740" cy="180" rx="38" ry="12" fill="#8ab17d" stroke="#2e8b57" stroke-width="1.5" transform="rotate(20 740 180)"/>
<circle cx="802.0" cy="105.0" r="13" fill="#f4a261" stroke="#1b2a3a" stroke-width="1.2"/>
<circle cx="791.0" cy="124.05255888325765" r="13" fill="#f4a261" stroke="#1b2a3a" stroke-width="1.2"/>
<circle cx="769.0" cy="124.05255888325766" r="13" fill="#f4a261" stroke="#1b2a3a" stroke-width="1.2"/>
<circle cx="758.0" cy="105.0" r="13" fill="#f4a261" stroke="#1b2a3a" stroke-width="1.2"/>
<circle cx="769.0" cy="85.94744111674235" r="13" fill="#f4a261" stroke="#1b2a3a" stroke-width="1.2"/>
<circle cx="791.0" cy="85.94744111674235" r="13" fill="#f4a261" stroke="#1b2a3a" stroke-width="1.2"/>
<circle cx="780" cy="105" r="9" fill="#c0392b" stroke="#1b2a3a" stroke-width="1.5"/>
<line x1="808" y1="92" x2="880" y2="72" stroke="#1b2a3a" stroke-width="1.5"/>
<text x="886" y="70" font-size="15" fill="#1b2a3a" text-anchor="start">flower: gametes made here,</text>
<text x="886" y="90" font-size="15" fill="#1b2a3a" text-anchor="start">from cells of the shoot meristem</text>
<text x="886" y="140" font-size="15" fill="#c0392b" text-anchor="start" font-weight="bold">CG methylation is largely kept</text>
<text x="886" y="160" font-size="15" fill="#1b2a3a" text-anchor="start">through meiosis (MET1)</text>
<text x="886" y="200" font-size="15" fill="#1b2a3a" text-anchor="start">most demethylation happens in</text>
<text x="886" y="220" font-size="15" fill="#1b2a3a" text-anchor="start">companion cells, not in the</text>
<text x="886" y="240" font-size="15" fill="#1b2a3a" text-anchor="start">gametes themselves</text>
<text x="584" y="342" font-size="15" fill="#1b2a3a" text-anchor="start">An epiallele that arises in the shoot can reach the seed:</text>
<text x="584" y="362" font-size="15" fill="#1b2a3a" text-anchor="start">there is no complete reset each generation.</text>
</svg>
