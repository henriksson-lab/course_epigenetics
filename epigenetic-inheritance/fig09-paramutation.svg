<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 360" width="1120" height="360" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a8324a"/></marker><marker id="ahgr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7a"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2a6f97"/></marker></defs>
<rect width="1120" height="360" fill="#ffffff"/>
<text x="24" y="30" font-size="18" fill="#1b2a3a" text-anchor="start" font-weight="bold">Paramutation at maize b1: one allele permanently converts the other</text>
<rect x="70" y="90" width="80" height="120" rx="14" fill="#6b4fa0" stroke="#1b2a3a" stroke-width="1.8"/>
<text x="110" y="234" font-size="16" fill="#1b2a3a" text-anchor="middle" font-weight="bold">B-I / B-I</text>
<text x="110" y="254" font-size="14" fill="#5b6b7a" text-anchor="middle">dark purple</text>
<text x="200" y="155" font-size="28" fill="#1b2a3a" text-anchor="middle">×</text>
<rect x="250" y="90" width="80" height="120" rx="14" fill="#d9cfe8" stroke="#1b2a3a" stroke-width="1.8"/>
<text x="290" y="234" font-size="16" fill="#1b2a3a" text-anchor="middle" font-weight="bold">B' / B'</text>
<text x="290" y="254" font-size="14" fill="#5b6b7a" text-anchor="middle">light</text>
<line x1="350" y1="150" x2="420" y2="150" stroke="#1b2a3a" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="450" y="90" width="80" height="120" rx="14" fill="#d9cfe8" stroke="#1b2a3a" stroke-width="1.8"/>
<text x="490" y="234" font-size="16" fill="#1b2a3a" text-anchor="middle" font-weight="bold">B' / B'*</text>
<text x="490" y="254" font-size="14" fill="#5b6b7a" text-anchor="middle">all light</text>
<text x="490" y="284" font-size="14" fill="#a8324a" text-anchor="middle">the B-I copy</text>
<text x="490" y="302" font-size="14" fill="#a8324a" text-anchor="middle">became B'*</text>
<line x1="556" y1="150" x2="620" y2="150" stroke="#1b2a3a" stroke-width="2.2" marker-end="url(#ah)"/>
<text x="588" y="138" font-size="13" fill="#5b6b7a" text-anchor="middle">cross to B-I</text>
<rect x="650" y="90" width="80" height="120" rx="14" fill="#d9cfe8" stroke="#1b2a3a" stroke-width="1.8"/>
<text x="690" y="234" font-size="16" fill="#1b2a3a" text-anchor="middle" font-weight="bold">B'* / B-I</text>
<text x="690" y="254" font-size="14" fill="#5b6b7a" text-anchor="middle">light</text>
<text x="690" y="284" font-size="14" fill="#a8324a" text-anchor="middle">B'* converts</text>
<text x="690" y="302" font-size="14" fill="#a8324a" text-anchor="middle">a new B-I too</text>
<line x1="780" y1="50" x2="780" y2="340" stroke="#d5dde5" stroke-width="1.5"/>
<text x="800" y="72" font-size="16" fill="#1b2a3a" text-anchor="start" font-weight="bold">What is needed</text>
<text x="800" y="98" font-size="15" fill="#1b2a3a" text-anchor="start">seven tandem copies of an 853 bp</text>
<text x="800" y="119" font-size="15" fill="#1b2a3a" text-anchor="start">repeat about 100 kb upstream of b1</text>
<text x="800" y="140" font-size="15" fill="#1b2a3a" text-anchor="start">(alleles with one copy do not take</text>
<text x="800" y="161" font-size="15" fill="#1b2a3a" text-anchor="start">part; Stam et al. 2002)</text>
<text x="800" y="182" font-size="15" fill="#1b2a3a" text-anchor="start"></text>
<text x="800" y="203" font-size="15" fill="#1b2a3a" text-anchor="start">DNA sequence of B-I and B' is the</text>
<text x="800" y="224" font-size="15" fill="#1b2a3a" text-anchor="start">same: the difference is chromatin</text>
<text x="800" y="245" font-size="15" fill="#1b2a3a" text-anchor="start">and methylation of the repeats,</text>
<text x="800" y="266" font-size="15" fill="#1b2a3a" text-anchor="start">and requires an RNA-directed</text>
<text x="800" y="287" font-size="15" fill="#1b2a3a" text-anchor="start">silencing pathway</text>
<text x="24" y="345" font-size="15" fill="#1b2a3a" text-anchor="start">Not Mendelian: the B-I allele that went through a B' plant comes out changed, and stays changed for generations.</text>
</svg>
