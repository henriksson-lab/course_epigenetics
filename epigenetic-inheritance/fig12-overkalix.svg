<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 370" width="1120" height="370" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a8324a"/></marker><marker id="ahgr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7a"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2a6f97"/></marker></defs>
<rect width="1120" height="370" fill="#ffffff"/>
<text x="24" y="30" font-size="18" fill="#1b2a3a" text-anchor="start" font-weight="bold">Överkalix and Uppsala: grandparents' food supply and grandchildren's mortality</text>
<rect x="40" y="80" width="180" height="60" rx="10" fill="#fbeaea" stroke="#1b2a3a" stroke-width="1.6"/>
<text x="130" y="106" font-size="15" fill="#1b2a3a" text-anchor="middle" font-weight="bold">G0 grandparent</text>
<text x="130" y="126" font-size="14" fill="#5b6b7a" text-anchor="middle">harvest in childhood</text>
<rect x="310" y="80" width="180" height="60" rx="10" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="1.6"/>
<text x="400" y="106" font-size="15" fill="#1b2a3a" text-anchor="middle" font-weight="bold">G1 parent</text>
<text x="400" y="126" font-size="14" fill="#5b6b7a" text-anchor="middle">not studied as exposed</text>
<rect x="580" y="80" width="180" height="60" rx="10" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="1.6"/>
<text x="670" y="106" font-size="15" fill="#1b2a3a" text-anchor="middle" font-weight="bold">G2 grandchild</text>
<text x="670" y="126" font-size="14" fill="#5b6b7a" text-anchor="middle">death records</text>
<line x1="222" y1="110" x2="306" y2="110" stroke="#1b2a3a" stroke-width="2" marker-end="url(#ah)"/>
<line x1="492" y1="110" x2="576" y2="110" stroke="#1b2a3a" stroke-width="2" marker-end="url(#ah)"/>
<text x="130" y="170" font-size="14" fill="#1b2a3a" text-anchor="middle">good or poor harvest</text>
<text x="130" y="188" font-size="14" fill="#1b2a3a" text-anchor="middle">before puberty</text>
<line x1="780" y1="50" x2="780" y2="360" stroke="#d5dde5" stroke-width="1.5"/>
<text x="800" y="72" font-size="15" fill="#1b2a3a" text-anchor="start" font-weight="bold">Överkalix (Kaati 2002;</text>
<text x="800" y="92" font-size="15" fill="#1b2a3a" text-anchor="start" font-weight="bold">Pembrey 2006)</text>
<text x="800" y="116" font-size="15" fill="#1b2a3a" text-anchor="start">303 probands, born 1890, 1905,</text>
<text x="800" y="136" font-size="15" fill="#1b2a3a" text-anchor="start">1920 in one parish</text>
<text x="800" y="156" font-size="15" fill="#1b2a3a" text-anchor="start">many grandparent × sex × cause</text>
<text x="800" y="176" font-size="15" fill="#1b2a3a" text-anchor="start">comparisons</text>
<text x="800" y="214" font-size="15" fill="#1b2a3a" text-anchor="start" font-weight="bold">Uppsala (Vågerö 2018)</text>
<text x="800" y="238" font-size="15" fill="#1b2a3a" text-anchor="start">11,561 grandchildren</text>
<text x="800" y="258" font-size="15" fill="#1b2a3a" text-anchor="start">paternal grandfather, good harvest:</text>
<text x="800" y="278" font-size="15" fill="#1b2a3a" text-anchor="start">grandsons HR 1.55 (1.02–2.35)</text>
<text x="800" y="298" font-size="15" fill="#1b2a3a" text-anchor="start">diabetes and heart findings not reproduced</text>
<text x="24" y="250" font-size="15" fill="#1b2a3a" text-anchor="start" font-weight="bold">Alternatives to a germline signal that must be ruled out:</text>
<text x="40" y="276" font-size="15" fill="#1b2a3a" text-anchor="start">– birth-year and cohort effects (harvests happen in particular years)</text>
<text x="40" y="297" font-size="15" fill="#1b2a3a" text-anchor="start">– family wealth, diet traditions and other culture passed down</text>
<text x="40" y="318" font-size="15" fill="#1b2a3a" text-anchor="start">– genetics shared by relatives; who survived and had children</text>
<text x="40" y="339" font-size="15" fill="#1b2a3a" text-anchor="start">– many comparisons in a small sample</text>
</svg>
