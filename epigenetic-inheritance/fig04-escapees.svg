<text x="24" y="236" font-size="14" fill="#5b6b7a" text-anchor="start">erased in PGCs, then reset by the sex of the parent</text>
<text x="24" y="340" font-size="15" fill="#1b2a3a" text-anchor="start">To pass a mark to a grandchild, it must escape both waves, or be rebuilt each generation from something that does</text>
<text x="24" y="360" font-size="15" fill="#1b2a3a" text-anchor="start">(DNA sequence, small RNAs, or a self-reinforcing loop).</text>
