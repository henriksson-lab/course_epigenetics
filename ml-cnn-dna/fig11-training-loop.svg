<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 380" width="1120" height="380" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7a"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="ahgr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2a6f97"/></marker><marker id="aho" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e67e22"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b4fa0"/></marker></defs>
<rect width="1120" height="380" fill="#ffffff"/>
<text x="20.0" y="30.0" font-size="17" fill="#1b2a3a" text-anchor="start" font-weight="bold">One training step (repeated for every mini-batch)</text>
<rect x="20.0" y="70.0" width="170.0" height="74.0" rx="8" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="1.6"/>
<text x="105.0" y="102.0" font-size="16" fill="#1b2a3a" text-anchor="middle" font-weight="bold">mini-batch</text>
<text x="105.0" y="124.0" font-size="14" fill="#5b6b7a" text-anchor="middle">128 sequences + labels</text>
<rect x="240.0" y="70.0" width="170.0" height="74.0" rx="8" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="1.6"/>
<text x="325.0" y="102.0" font-size="16" fill="#1b2a3a" text-anchor="middle" font-weight="bold">forward pass</text>
<text x="325.0" y="124.0" font-size="14" fill="#5b6b7a" text-anchor="middle">predictions p</text>
<rect x="460.0" y="70.0" width="170.0" height="74.0" rx="8" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="1.6"/>
<text x="545.0" y="102.0" font-size="16" fill="#1b2a3a" text-anchor="middle" font-weight="bold">loss</text>
<text x="545.0" y="124.0" font-size="14" fill="#5b6b7a" text-anchor="middle">average log loss</text>
<rect x="680.0" y="70.0" width="170.0" height="74.0" rx="8" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="1.6"/>
<text x="765.0" y="102.0" font-size="16" fill="#1b2a3a" text-anchor="middle" font-weight="bold">backward pass</text>
<text x="765.0" y="124.0" font-size="14" fill="#5b6b7a" text-anchor="middle">gradient for every weight</text>
<line x1="194.0" y1="107.0" x2="234.0" y2="107.0" stroke="#1b2a3a" stroke-width="2.2" marker-end="url(#ah)"/>
<line x1="414.0" y1="107.0" x2="454.0" y2="107.0" stroke="#1b2a3a" stroke-width="2.2" marker-end="url(#ah)"/>
<line x1="634.0" y1="107.0" x2="674.0" y2="107.0" stroke="#1b2a3a" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="900.0" y="70.0" width="190.0" height="74.0" rx="8" fill="#fbe9e7" stroke="#c0392b" stroke-width="1.8"/>
<text x="995.0" y="102.0" font-size="16" fill="#c0392b" text-anchor="middle" font-weight="bold">update weights</text>
<text x="995.0" y="124.0" font-size="14" fill="#c0392b" text-anchor="middle">w ← w − η × gradient</text>
<line x1="854.0" y1="107.0" x2="894.0" y2="107.0" stroke="#1b2a3a" stroke-width="2.2" marker-end="url(#ah)"/>
<path d="M995,148 V184 H105 V152" fill="none" stroke="#5b6b7a" stroke-width="2" marker-end="url(#ahg)"/>
<text x="550.0" y="176.0" font-size="14" fill="#5b6b7a" text-anchor="middle">next mini-batch (a fresh random set of 128)</text>
<text x="20.0" y="230.0" font-size="17" fill="#1b2a3a" text-anchor="start" font-weight="bold">One epoch = one pass over all training sequences</text>
<text x="20.0" y="260.0" font-size="15" fill="#1b2a3a" text-anchor="start">76 015 training sequences / 128 = 594 steps per epoch. After each epoch:</text>
<rect x="20.0" y="280.0" width="520.0" height="86.0" rx="8" fill="#f4f6f8" stroke="#5b6b7a" stroke-width="1.2"/>
<text x="36.0" y="306.0" font-size="15" fill="#1b2a3a" text-anchor="start">1. compute the loss on the validation chromosome (chr7)</text>
<text x="36.0" y="330.0" font-size="15" fill="#1b2a3a" text-anchor="start">2. better than ever before? save this model</text>
<text x="36.0" y="354.0" font-size="15" fill="#1b2a3a" text-anchor="start">3. no improvement for 3 epochs? stop (early stopping)</text>
<text x="580.0" y="306.0" font-size="15" fill="#1b2a3a" text-anchor="start">The weights only ever see the training chromosomes.</text>
<text x="580.0" y="330.0" font-size="15" fill="#1b2a3a" text-anchor="start">Validation decides when to stop; the test chromosomes</text>
<text x="580.0" y="354.0" font-size="15" fill="#1b2a3a" text-anchor="start">are used once, to report how well the final model works.</text>
</svg>
