<text x="173.0" y="145.3" font-size="14" fill="#2e8b57" text-anchor="start" font-weight="bold">p = 0.1: 2.30</text>
<circle cx="569.0" cy="322.1" r="6.0" fill="#2e8b57" stroke="#ffffff" stroke-width="1.5"/>
<text x="569.0" y="292.1" font-size="14" fill="#2e8b57" text-anchor="middle" font-weight="bold">p = 0.9: 0.11</text>
<line x1="365.0" y1="278.0" x2="365.0" y2="330.0" stroke="#5b6b7a" stroke-width="1.2" stroke-dasharray="4 3"/>
<circle cx="365.0" cy="278.0" r="5.0" fill="#5b6b7a" stroke="#ffffff" stroke-width="1.2"/>
<text x="373.0" y="320.0" font-size="13" fill="#5b6b7a" text-anchor="start">p = 0.5: 0.69</text>
<text x="670.0" y="60.0" font-size="17" fill="#1b2a3a" text-anchor="start" font-weight="bold">Binary cross-entropy (log loss)</text>
<text x="670.0" y="95.0" font-size="16" fill="#1b2a3a" text-anchor="start">loss = −[ y log p + (1 − y) log(1 − p) ]</text>
<text x="670.0" y="135.0" font-size="15" fill="#1b2a3a" text-anchor="start">• Small when the model is confident and right.</text>
<text x="670.0" y="160.0" font-size="15" fill="#1b2a3a" text-anchor="start">• Very large when it is confident and wrong.</text>
<text x="670.0" y="185.0" font-size="15" fill="#1b2a3a" text-anchor="start">• The training loss is the average over sequences.</text>
<text x="670.0" y="230.0" font-size="15" fill="#5b6b7a" text-anchor="start">It is minus the log-likelihood of logistic</text>
<text x="670.0" y="252.0" font-size="15" fill="#5b6b7a" text-anchor="start">regression: the same quantity glm() maximises.</text>
<text x="670.0" y="295.0" font-size="15" fill="#5b6b7a" text-anchor="start">Reference: predicting 0.5 for everything</text>
<text x="670.0" y="317.0" font-size="15" fill="#5b6b7a" text-anchor="start">gives log 2 = 0.693 on balanced data.</text>
</svg>
