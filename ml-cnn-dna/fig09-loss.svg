<text x="140.6" y="82.5" font-size="15" fill="#2e8b57" text-anchor="start" font-weight="bold">bound site (y = 1):</text>
<text x="140.6" y="102.5" font-size="15" fill="#2e8b57" text-anchor="start">loss = −log p</text>
<text x="446.6" y="82.5" font-size="15" fill="#a8324a" text-anchor="start" font-weight="bold">background (y = 0):</text>
<text x="446.6" y="102.5" font-size="15" fill="#a8324a" text-anchor="start">loss = −log(1 − p)</text>
