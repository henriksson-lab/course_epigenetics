<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 400" width="1120" height="400" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="aB" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2a6f97"/></marker>
    <marker id="aO" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e67e22"/></marker>
    <marker id="dim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/></marker>
  </defs>
  <rect width="1120" height="400" fill="#ffffff"/>
  <!-- LEFT: ChIP-seq -->
  <text x="20" y="28" font-size="18" font-weight="bold" fill="#1b2a3a">ChIP-seq: the fragment ends are random</text>
  <rect x="266" y="44" width="28" height="22" rx="6" fill="#8c564b" stroke="#1b2a3a"/>
  <line x1="40" y1="70" x2="520" y2="70" stroke="#1b2a3a" stroke-width="3"/>
  <g stroke-width="4" stroke-linecap="round">
    <line x1="150" y1="92" x2="320" y2="92" stroke="#1b2a3a"/><line x1="200" y1="106" x2="400" y2="106" stroke="#1b2a3a"/>
    <line x1="230" y1="120" x2="340" y2="120" stroke="#1b2a3a"/><line x1="120" y1="134" x2="310" y2="134" stroke="#1b2a3a"/>
  </g>
  <g stroke-width="4" marker-end="url(#aB)">
    <line x1="150" y1="92" x2="180" y2="92" stroke="#2a6f97"/><line x1="230" y1="120" x2="260" y2="120" stroke="#2a6f97"/><line x1="120" y1="134" x2="150" y2="134" stroke="#2a6f97"/>
  </g>
  <g stroke-width="4" marker-end="url(#aO)">
    <line x1="400" y1="106" x2="370" y2="106" stroke="#e67e22"/>
  </g>
  <text x="20" y="170" font-size="15" fill="#1b2a3a">Sonication breaks DNA anywhere within ~100–300 bp of</text>
  <text x="20" y="190" font-size="15" fill="#1b2a3a">the protein. The read starts tell you where the break was.</text>
  <path d="M40,290 L150,290 C190,290 220,226 280,226 C340,226 370,290 410,290 L520,290" fill="#8c564b" fill-opacity="0.3" stroke="#8c564b" stroke-width="2.2"/>
  <line x1="40" y1="290" x2="520" y2="290" stroke="#1b2a3a" stroke-width="1.5"/>
  <line x1="190" y1="308" x2="370" y2="308" stroke="#1b2a3a" stroke-width="1.5" marker-start="url(#dim)" marker-end="url(#dim)"/>
  <text x="280" y="328" font-size="15" fill="#1b2a3a" text-anchor="middle">peak ~2 fragment lengths wide</text>
  <text x="20" y="360" font-size="15" fill="#1b2a3a">The <tspan font-weight="bold">summit</tspan> still places the site to within ~10–50 bp,</text>
  <text x="20" y="380" font-size="15" fill="#1b2a3a">given enough reads; a motif in the summit narrows it further.</text>

  <line x1="560" y1="16" x2="560" y2="390" stroke="#cfd8e0" stroke-width="1.5"/>

  <!-- RIGHT: ChIP-exo -->
  <text x="590" y="28" font-size="18" font-weight="bold" fill="#1b2a3a">ChIP-exo: trim each fragment to the protein</text>
  <rect x="836" y="44" width="28" height="22" rx="6" fill="#8c564b" stroke="#1b2a3a"/>
  <line x1="610" y1="70" x2="1090" y2="70" stroke="#1b2a3a" stroke-width="3"/>
  <g stroke-width="4" stroke-linecap="round" stroke="#cfd8e0">
    <line x1="720" y1="92" x2="836" y2="92"/><line x1="864" y1="106" x2="970" y2="106"/><line x1="800" y1="120" x2="836" y2="120"/><line x1="690" y1="134" x2="836" y2="134"/>
  </g>
  <g stroke-width="4" stroke-linecap="round" stroke="#1b2a3a">
    <line x1="836" y1="92" x2="890" y2="92"/><line x1="770" y1="106" x2="864" y2="106"/><line x1="836" y1="120" x2="910" y2="120"/><line x1="836" y1="134" x2="880" y2="134"/>
  </g>
  <text x="590" y="170" font-size="15" fill="#1b2a3a">A 5'→3' exonuclease chews each strand (grey) until it hits</text>
  <text x="590" y="190" font-size="15" fill="#1b2a3a">the crosslinked protein. The read starts now mark its edges.</text>
  <rect x="836" y="200" width="28" height="94" fill="#8c564b" fill-opacity="0.12"/>
  <path d="M610,290 L820,290 C826,290 830,220 834,220 C838,220 840,290 846,290 L1090,290" fill="#2a6f97" fill-opacity="0.35" stroke="#2a6f97" stroke-width="2.2"/>
  <path d="M610,290 L854,290 C860,290 862,226 866,226 C870,226 874,290 880,290 L1090,290" fill="#e67e22" fill-opacity="0.35" stroke="#e67e22" stroke-width="2.2"/>
  <line x1="610" y1="290" x2="1090" y2="290" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="820" y="244" font-size="14" fill="#2a6f97" text-anchor="end">+ strand starts</text>
  <text x="886" y="244" font-size="14" fill="#e67e22">− strand starts</text>
  <text x="850" y="328" font-size="15" fill="#1b2a3a" text-anchor="middle">two sharp borders, ~protein footprint apart</text>
  <text x="590" y="360" font-size="15" fill="#1b2a3a">Near base-pair resolution: ChIP-exo (2011), ChIP-nexus (2015).</text>
  <text x="590" y="380" font-size="15" fill="#5b6b7a">CUT&amp;RUN reaches similar resolution by cutting next to the protein.</text>
</svg>
