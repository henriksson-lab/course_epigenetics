<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1120 400" width="1120" height="400" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6b7a"/>
    </marker>
    <!-- nucleosome -->
    <g id="nuc"><ellipse cx="0" cy="0" rx="15" ry="12" fill="#2a9d8f" stroke="#1b2a3a" stroke-width="1.2"/></g>
    <!-- transcription factor -->
    <g id="tf"><rect x="-10" y="-22" width="20" height="18" rx="5" fill="#8c564b" stroke="#1b2a3a" stroke-width="1.2"/></g>
    <!-- antibody (Y) -->
    <g id="ab" stroke="#c0392b" stroke-width="3.2" stroke-linecap="round" fill="none">
      <line x1="0" y1="0" x2="0" y2="-16"/><line x1="0" y1="-16" x2="-9" y2="-28"/><line x1="0" y1="-16" x2="9" y2="-28"/>
    </g>
  </defs>
  <rect width="1120" height="400" fill="#ffffff"/>

  <!-- panel frames -->
  <g fill="#f4f6f8" stroke="#cfd8e0" stroke-width="1.2">
    <rect x="10" y="10" width="172" height="250" rx="8"/>
    <rect x="194" y="10" width="172" height="250" rx="8"/>
    <rect x="378" y="10" width="172" height="250" rx="8"/>
    <rect x="562" y="10" width="172" height="250" rx="8"/>
    <rect x="746" y="10" width="172" height="250" rx="8"/>
    <rect x="930" y="10" width="180" height="250" rx="8"/>
  </g>
  <g font-size="17" font-weight="bold" fill="#1b2a3a">
    <text x="22" y="36">1 Crosslink</text>
    <text x="206" y="36">2 Fragment</text>
    <text x="390" y="36">3 Immuno-</text>
    <text x="390" y="56">precipitate</text>
    <text x="574" y="36">4 Reverse</text>
    <text x="574" y="56">crosslinks</text>
    <text x="758" y="36">5 Library,</text>
    <text x="758" y="56">sequence</text>
    <text x="942" y="36">6 Map, compare</text>
    <text x="942" y="56">with the input</text>
  </g>

  <!-- 1: chromatin with TF, crosslinks -->
  <line x1="22" y1="140" x2="170" y2="140" stroke="#1b2a3a" stroke-width="3"/>
  <use xlink:href="#nuc" x="45" y="140"/>
  <use xlink:href="#nuc" x="80" y="140"/>
  <use xlink:href="#nuc" x="150" y="140"/>
  <use xlink:href="#tf" x="115" y="140"/>
  <g stroke="#c0392b" stroke-width="2.2">
    <line x1="111" y1="131" x2="119" y2="139"/><line x1="119" y1="131" x2="111" y2="139"/>
    <line x1="41" y1="146" x2="49" y2="154"/><line x1="49" y1="146" x2="41" y2="154"/>
  </g>
  <text x="22" y="208" font-size="15" fill="#1b2a3a">formaldehyde</text>
  <text x="22" y="226" font-size="15" fill="#1b2a3a">fixes proteins</text>
  <text x="22" y="244" font-size="15" fill="#1b2a3a">to DNA <tspan fill="#c0392b">(×)</tspan></text>

  <!-- 2: fragments -->
  <line x1="208" y1="110" x2="262" y2="110" stroke="#1b2a3a" stroke-width="3"/>
  <use xlink:href="#nuc" x="236" y="110"/>
  <line x1="280" y1="110" x2="350" y2="110" stroke="#1b2a3a" stroke-width="3"/>
  <use xlink:href="#tf" x="314" y="110"/>
  <line x1="208" y1="160" x2="286" y2="160" stroke="#1b2a3a" stroke-width="3"/>
  <use xlink:href="#nuc" x="230" y="160"/>
  <use xlink:href="#nuc" x="264" y="160"/>
  <line x1="300" y1="160" x2="350" y2="160" stroke="#1b2a3a" stroke-width="3"/>
  <use xlink:href="#nuc" x="326" y="160"/>
  <text x="206" y="226" font-size="15" fill="#1b2a3a">sonication or</text>
  <text x="206" y="244" font-size="15" fill="#1b2a3a">MNase: 100–500 bp</text>

  <!-- 3: IP -->
  <circle cx="464" cy="184" r="26" fill="#cfd8e0" stroke="#5b6b7a" stroke-width="1.5"/>
  <text x="464" y="189" font-size="13" fill="#1b2a3a" text-anchor="middle">bead</text>
  <use xlink:href="#ab" x="464" y="158"/>
  <line x1="420" y1="108" x2="508" y2="108" stroke="#1b2a3a" stroke-width="3"/>
  <rect x="454" y="111" width="20" height="18" rx="5" fill="#8c564b" stroke="#1b2a3a" stroke-width="1.2"/>
  <!-- washed away -->
  <g opacity="0.35">
    <line x1="396" y1="84" x2="436" y2="84" stroke="#1b2a3a" stroke-width="3"/>
    <use xlink:href="#nuc" x="416" y="84"/>
    <line x1="470" y1="84" x2="530" y2="84" stroke="#1b2a3a" stroke-width="3"/>
  </g>
  <text x="390" y="226" font-size="15" fill="#1b2a3a">antibody pulls</text>
  <text x="390" y="244" font-size="15" fill="#1b2a3a">down its target</text>

  <!-- 4: reverse crosslinks -->
  <line x1="590" y1="120" x2="680" y2="120" stroke="#1b2a3a" stroke-width="3"/>
  <line x1="600" y1="150" x2="710" y2="150" stroke="#1b2a3a" stroke-width="3"/>
  <line x1="585" y1="180" x2="660" y2="180" stroke="#1b2a3a" stroke-width="3"/>
  <text x="574" y="208" font-size="15" fill="#1b2a3a">65 °C, proteinase K:</text>
  <text x="574" y="226" font-size="15" fill="#1b2a3a">pure DNA, often</text>
  <text x="574" y="244" font-size="15" fill="#1b2a3a">only 1–10 ng</text>

  <!-- 5: library -->
  <g stroke-width="3">
    <line x1="770" y1="110" x2="786" y2="110" stroke="#e67e22"/><line x1="786" y1="110" x2="874" y2="110" stroke="#1b2a3a"/><line x1="874" y1="110" x2="890" y2="110" stroke="#2a6f97"/>
    <line x1="770" y1="135" x2="786" y2="135" stroke="#e67e22"/><line x1="786" y1="135" x2="854" y2="135" stroke="#1b2a3a"/><line x1="854" y1="135" x2="870" y2="135" stroke="#2a6f97"/>
    <line x1="770" y1="160" x2="786" y2="160" stroke="#e67e22"/><line x1="786" y1="160" x2="884" y2="160" stroke="#1b2a3a"/><line x1="884" y1="160" x2="900" y2="160" stroke="#2a6f97"/>
  </g>
  <line x1="786" y1="182" x2="822" y2="182" stroke="#2a6f97" stroke-width="4" marker-end="url(#ar)"/>
  <text x="828" y="187" font-size="14" fill="#5b6b7a">read</text>
  <text x="758" y="208" font-size="15" fill="#1b2a3a">adapters, PCR,</text>
  <text x="758" y="226" font-size="15" fill="#1b2a3a">sequence one or</text>
  <text x="758" y="244" font-size="15" fill="#1b2a3a">both ends</text>

  <!-- 6: tracks -->
  <text x="942" y="92" font-size="14" fill="#8c564b" font-weight="bold">ChIP</text>
  <path d="M942,130 L1000,130 C1012,130 1014,82 1024,82 C1034,82 1036,130 1048,130 L1100,130" fill="#8c564b" fill-opacity="0.35" stroke="#8c564b" stroke-width="2"/>
  <text x="942" y="160" font-size="14" fill="#5b6b7a" font-weight="bold">input</text>
  <path d="M942,196 L980,196 C990,196 992,188 1000,188 C1008,188 1012,196 1024,193 C1034,190 1040,196 1060,196 L1100,196" fill="#5b6b7a" fill-opacity="0.3" stroke="#5b6b7a" stroke-width="2"/>
  <line x1="942" y1="198" x2="1100" y2="198" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="942" y="226" font-size="15" fill="#1b2a3a">peaks: more reads</text>
  <text x="942" y="244" font-size="15" fill="#1b2a3a">than the input</text>

  <!-- flow arrows between panels -->
  <g stroke="#5b6b7a" stroke-width="2" marker-end="url(#ar)">
    <line x1="170" y1="70" x2="204" y2="70"/>
    <line x1="354" y1="70" x2="388" y2="70"/>
    <line x1="538" y1="70" x2="572" y2="70"/>
    <line x1="722" y1="70" x2="756" y2="70"/>
    <line x1="906" y1="70" x2="940" y2="70"/>
  </g>

  <!-- input path -->
  <rect x="10" y="282" width="1100" height="50" rx="8" fill="#eaf1f7" stroke="#cfd8e0"/>
  <text x="26" y="313" font-size="16" fill="#1b2a3a"><tspan font-weight="bold">Input control:</tspan> a sample of the same crosslinked, fragmented chromatin goes through steps 1, 2, 4, 5 and 6, but not 3.</text>
  <text x="26" y="362" font-size="15" fill="#5b6b7a">ChIP-chip (2000) read step 6 on a microarray; ChIP-seq (2007) by sequencing. Steps 1–4 are the same, and so are their artefacts.</text>
  <text x="26" y="386" font-size="15" fill="#5b6b7a">Native ChIP skips step 1 and uses MNase in step 2; CUT&amp;RUN and CUT&amp;Tag replace steps 2–3 by an antibody-tethered enzyme.</text>
</svg>
