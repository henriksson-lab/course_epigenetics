<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 360" width="1120" height="360" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/></marker>
  </defs>
  <rect width="1120" height="360" fill="#ffffff"/>
  <!-- scale: x = 60 + (year - 1984) * 27.78 -->
  <rect x="40" y="150" width="464" height="26" fill="#f4f6f8"/>
  <rect x="504" y="150" width="195" height="26" fill="#eaf1f7"/>
  <rect x="699" y="150" width="381" height="26" fill="#e6f2ec"/>
  <text x="290" y="168" font-size="15" fill="#5b6b7a" text-anchor="middle">one locus at a time (PCR, blots)</text>
  <text x="600" y="168" font-size="15" fill="#2a6f97" text-anchor="middle">arrays</text>
  <text x="905" y="168" font-size="15" fill="#2e8b57" text-anchor="middle">sequencing</text>
  <line x1="40" y1="190" x2="1090" y2="190" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ar)"/>
  <g font-size="14" fill="#5b6b7a" text-anchor="middle">
    <text x="60" y="210">1984</text><text x="171" y="210">1988</text><text x="504" y="210">2000</text>
    <text x="699" y="210">2007</text><text x="810" y="210">2011</text><text x="977" y="210">2017</text><text x="1038" y="210">2019</text>
  </g>
  <g fill="#1b2a3a">
    <circle cx="60" cy="190" r="6"/><circle cx="171" cy="190" r="6"/><circle cx="504" cy="190" r="6"/>
    <circle cx="699" cy="190" r="6"/><circle cx="727" cy="190" r="4.5"/><circle cx="810" cy="190" r="6"/>
    <circle cx="838" cy="190" r="4.5"/><circle cx="977" cy="190" r="6"/><circle cx="1032" cy="190" r="6"/>
  </g>
  <!-- above the axis -->
  <g stroke="#cfd8e0" stroke-width="1.5">
    <line x1="60" y1="184" x2="60" y2="98"/><line x1="504" y1="148" x2="504" y2="98"/>
    <line x1="810" y1="148" x2="810" y2="98"/><line x1="1004" y1="148" x2="1004" y2="120"/>
  </g>
  <text x="50" y="30" font-size="16" font-weight="bold" fill="#1b2a3a">UV crosslinking</text>
  <text x="50" y="50" font-size="14" fill="#1b2a3a">RNA polymerase on</text>
  <text x="50" y="68" font-size="14" fill="#1b2a3a">E. coli genes</text>
  <text x="50" y="88" font-size="13" fill="#5b6b7a">Gilmour &amp; Lis</text>
  <text x="440" y="30" font-size="16" font-weight="bold" fill="#2a6f97">ChIP-chip</text>
  <text x="440" y="50" font-size="14" fill="#1b2a3a">genome-wide binding of</text>
  <text x="440" y="68" font-size="14" fill="#1b2a3a">yeast TFs, on microarrays</text>
  <text x="440" y="88" font-size="13" fill="#5b6b7a">Ren et al.; Iyer et al. 2001</text>
  <text x="750" y="30" font-size="16" font-weight="bold" fill="#1b2a3a">ChIP-exo</text>
  <text x="750" y="50" font-size="14" fill="#1b2a3a">exonuclease trims to</text>
  <text x="750" y="68" font-size="14" fill="#1b2a3a">the crosslink: ~1 bp</text>
  <text x="750" y="88" font-size="13" fill="#5b6b7a">Rhee &amp; Pugh</text>
  <text x="1086" y="34" font-size="16" font-weight="bold" fill="#1b2a3a" text-anchor="end">CUT&amp;RUN, CUT&amp;Tag</text>
  <text x="1086" y="54" font-size="14" fill="#1b2a3a" text-anchor="end">no IP: an antibody-</text>
  <text x="1086" y="72" font-size="14" fill="#1b2a3a" text-anchor="end">tethered nuclease or Tn5</text>
  <text x="1086" y="92" font-size="13" fill="#5b6b7a" text-anchor="end">Skene &amp; Henikoff;</text>
  <text x="1086" y="109" font-size="13" fill="#5b6b7a" text-anchor="end">Kaya-Okur et al.</text>
  <!-- below the axis -->
  <g stroke="#cfd8e0" stroke-width="1.5">
    <line x1="171" y1="196" x2="171" y2="236"/><line x1="699" y1="196" x2="699" y2="236"/>
    <line x1="727" y1="196" x2="727" y2="276"/><line x1="838" y1="196" x2="838" y2="236"/>
  </g>
  <text x="110" y="256" font-size="16" font-weight="bold" fill="#1b2a3a">Formaldehyde ChIP</text>
  <text x="110" y="276" font-size="14" fill="#1b2a3a">histone H4 stays on a</text>
  <text x="110" y="294" font-size="14" fill="#1b2a3a">transcribed fly gene</text>
  <text x="110" y="313" font-size="13" fill="#5b6b7a">Solomon, Larsen &amp; Varshavsky</text>
  <text x="110" y="336" font-size="13" fill="#5b6b7a">(native ChIP: Hebbes et al. 1988)</text>
  <text x="540" y="256" font-size="16" font-weight="bold" fill="#2e8b57">ChIP-seq</text>
  <text x="540" y="276" font-size="14" fill="#1b2a3a">NRSF, STAT1 (TFs);</text>
  <text x="540" y="294" font-size="14" fill="#1b2a3a">histone methylation</text>
  <text x="540" y="313" font-size="13" fill="#5b6b7a">Johnson; Robertson;</text>
  <text x="540" y="330" font-size="13" fill="#5b6b7a">Barski; Mikkelsen</text>
  <text x="712" y="296" font-size="14" fill="#1b2a3a">2008: MACS,</text>
  <text x="712" y="314" font-size="14" fill="#1b2a3a">SPP peak callers</text>
  <text x="850" y="256" font-size="16" font-weight="bold" fill="#1b2a3a">2012: ENCODE guidelines</text>
  <text x="850" y="276" font-size="14" fill="#1b2a3a">replicates, inputs,</text>
  <text x="850" y="294" font-size="14" fill="#1b2a3a">antibodies, IDR</text>
  <text x="850" y="313" font-size="13" fill="#5b6b7a">Landt et al.</text>
</svg>
