<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 330" width="1120" height="330" font-family="Helvetica, Arial, sans-serif">
<rect width="1120" height="330" fill="#ffffff"/>
<text x="20" y="30" font-size="17" font-weight="bold" fill="#1b2a3a">Autoimmune loci vs GM12878-specific peaks (±1 kb)</text>
<text x="290" y="68" font-size="15" font-weight="bold" fill="#1b2a3a" text-anchor="middle">near a peak</text>
<text x="440" y="68" font-size="15" font-weight="bold" fill="#1b2a3a" text-anchor="middle">not near</text>
<text x="200" y="110" font-size="15" font-weight="bold" fill="#c0392b" text-anchor="end">770 autoimmune loci</text>
<text x="200" y="180" font-size="15" font-weight="bold" fill="#5b6b7a" text-anchor="end">background SNPs</text>
<rect x="215" y="80" width="150" height="56" fill="#c0392b" fill-opacity="0.15" stroke="#1b2a3a"/>
<rect x="365" y="80" width="150" height="56" fill="#f4f6f8" stroke="#1b2a3a"/>
<rect x="215" y="150" width="150" height="56" fill="#f4f6f8" stroke="#1b2a3a"/>
<rect x="365" y="150" width="150" height="56" fill="#f4f6f8" stroke="#1b2a3a"/>
<g font-size="16" fill="#1b2a3a" text-anchor="middle">
<text x="290" y="114" font-weight="bold">51 (6.6%)</text>
<text x="440" y="114">719</text>
<text x="290" y="184">2.8%</text>
<text x="440" y="184">97.2%</text>
</g>
<g font-size="15" fill="#1b2a3a">
<text x="20" y="240">expected if no enrichment: 770 × 0.028 ≈ 21.6 loci</text>
<text x="20" y="264">enrichment = 6.6% / 2.8% = <tspan font-weight="bold">2.3</tspan>; binomial test p = 4 × 10<tspan dy="-6" font-size="11">−8</tspan></text>
<text x="20" y="300" fill="#5b6b7a">One locus = one test: SNPs within 250 kb of a stronger one are pruned.</text>
</g>
<!-- backgrounds -->
<text x="620" y="30" font-size="17" font-weight="bold" fill="#1b2a3a">Which background?</text>
<g font-size="15" fill="#1b2a3a">
<rect x="620" y="52" width="16" height="16" fill="#a8324a"/>
<text x="646" y="66" font-weight="bold">random genome positions</text>
<text x="646" y="88" fill="#5b6b7a">ignores that GWAS SNPs sit near genes, in common,</text>
<text x="646" y="108" fill="#5b6b7a">well-genotyped, gene-rich regions: inflated</text>
<rect x="620" y="132" width="16" height="16" fill="#d4a017"/>
<text x="646" y="146" font-weight="bold">all GWAS SNPs (used here)</text>
<text x="646" y="168" fill="#5b6b7a">same ascertainment; asks "more than other traits?"</text>
<text x="646" y="188" fill="#5b6b7a">conservative if many traits share the annotation</text>
<rect x="620" y="212" width="16" height="16" fill="#2e8b57"/>
<text x="646" y="226" font-weight="bold">matched SNPs</text>
<text x="646" y="248" fill="#5b6b7a">same allele frequency, LD block size and distance</text>
<text x="646" y="268" fill="#5b6b7a">to the TSS (e.g. GREGOR, SNPsnap); S-LDSC models</text>
<text x="646" y="288" fill="#5b6b7a">all SNPs and LD explicitly</text>
</g>
</svg>
