<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 400" width="1120" height="400" font-family="Helvetica, Arial, sans-serif">
  <rect width="1120" height="400" fill="#ffffff"/>
  <g fill="#f4f6f8" stroke="#cfd8e0" stroke-width="1.2">
    <rect x="10" y="10" width="270" height="380" rx="8"/><rect x="292" y="10" width="270" height="380" rx="8"/>
    <rect x="574" y="10" width="270" height="380" rx="8"/><rect x="856" y="10" width="254" height="380" rx="8"/>
  </g>
  <g font-size="17" font-weight="bold" fill="#1b2a3a">
    <text x="24" y="38">Library size</text><text x="306" y="38">Reads in peaks</text><text x="588" y="38">Background bins</text><text x="870" y="38">Spike-in</text>
  </g>
  <g font-size="14" fill="#5b6b7a"><text x="24" y="58">(CPM)</text><text x="306" y="58">(DESeq2 RLE, edgeR TMM)</text><text x="588" y="58">(csaw: 10-kb bins)</text><text x="870" y="58">(ChIP-Rx)</text></g>
  <!-- mini genome tracks: peaks (tall) and background (low) for 2 samples -->
  <g>
    <line x1="24" y1="120" x2="266" y2="120" stroke="#1b2a3a"/>
    <rect x="50" y="90" width="20" height="30" fill="#2a6f97"/><rect x="120" y="100" width="20" height="20" fill="#2a6f97"/><rect x="190" y="80" width="20" height="40" fill="#2a6f97"/>
    <rect x="24" y="114" width="242" height="6" fill="#2a6f97" fill-opacity="0.25"/>
    <rect x="24" y="74" width="242" height="54" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="5 3"/>
  </g>
  <g>
    <line x1="306" y1="120" x2="548" y2="120" stroke="#1b2a3a"/>
    <rect x="332" y="90" width="20" height="30" fill="#2a6f97"/><rect x="402" y="100" width="20" height="20" fill="#2a6f97"/><rect x="472" y="80" width="20" height="40" fill="#2a6f97"/>
    <rect x="306" y="114" width="242" height="6" fill="#2a6f97" fill-opacity="0.25"/>
    <rect x="328" y="74" width="28" height="50" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="5 3"/>
    <rect x="398" y="74" width="28" height="50" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="5 3"/>
    <rect x="468" y="74" width="28" height="50" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="5 3"/>
  </g>
  <g>
    <line x1="588" y1="120" x2="830" y2="120" stroke="#1b2a3a"/>
    <rect x="614" y="90" width="20" height="30" fill="#2a6f97"/><rect x="684" y="100" width="20" height="20" fill="#2a6f97"/><rect x="754" y="80" width="20" height="40" fill="#2a6f97"/>
    <rect x="588" y="114" width="242" height="6" fill="#2a6f97" fill-opacity="0.25"/>
    <rect x="588" y="108" width="22" height="16" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="5 3"/>
    <rect x="640" y="108" width="40" height="16" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="5 3"/>
    <rect x="710" y="108" width="40" height="16" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="5 3"/>
    <rect x="780" y="108" width="48" height="16" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="5 3"/>
  </g>
  <g>
    <line x1="870" y1="120" x2="1096" y2="120" stroke="#1b2a3a"/>
    <rect x="890" y="90" width="20" height="30" fill="#2a6f97"/><rect x="950" y="100" width="20" height="20" fill="#2a6f97"/>
    <rect x="1020" y="86" width="60" height="34" fill="#6b4fa0" fill-opacity="0.8"/>
    <text x="1050" y="108" font-size="13" fill="#ffffff" text-anchor="middle">fly</text>
    <rect x="1014" y="74" width="72" height="50" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="5 3"/>
  </g>
  <text x="24" y="150" font-size="13" fill="#c0392b">dashed: what is made equal</text>
  <g font-size="15" fill="#1b2a3a">
    <text x="24" y="186" font-weight="bold">Assumes</text>
    <text x="24" y="208">the total of all reads</text><text x="24" y="228">corresponds to the same</text><text x="24" y="248">amount of material</text>
    <text x="24" y="282" font-weight="bold" fill="#a8324a">Breaks when</text>
    <text x="24" y="304">signal-to-noise (FRiP)</text><text x="24" y="324">differs: a better IP looks</text><text x="24" y="344">"up" everywhere</text>
    <text x="306" y="186" font-weight="bold">Assumes</text>
    <text x="306" y="208">most peaks do not change</text><text x="306" y="228">(as for genes in RNA-seq)</text>
    <text x="306" y="282" font-weight="bold" fill="#a8324a">Breaks when</text>
    <text x="306" y="304">most peaks change in one</text><text x="306" y="324">direction, or the peaks</text><text x="306" y="344">differ a lot between groups</text>
    <text x="588" y="186" font-weight="bold">Assumes</text>
    <text x="588" y="208">the background (non-peak</text><text x="588" y="228">DNA) is the same in all</text><text x="588" y="248">samples</text>
    <text x="588" y="282" font-weight="bold" fill="#a8324a">Breaks when</text>
    <text x="588" y="304">FRiP differs (efficiency</text><text x="588" y="324">bias), or copy number</text><text x="588" y="344">differs between samples</text>
    <text x="870" y="186" font-weight="bold">Assumes</text>
    <text x="870" y="208">the same amount of</text><text x="870" y="228">foreign chromatin went</text><text x="870" y="248">into every IP</text>
    <text x="870" y="282" font-weight="bold" fill="#a8324a">Needed when</text>
    <text x="870" y="304">the total amount of the</text><text x="870" y="324">mark changes (inhibitor,</text><text x="870" y="344">knockout of a writer)</text>
  </g>
  <text x="24" y="376" font-size="13" fill="#5b6b7a">CPM tracks; DiffBind ≥ 3 default</text>
  <text x="306" y="376" font-size="13" fill="#5b6b7a">the default in DESeq2 and edgeR</text>
  <text x="588" y="376" font-size="13" fill="#5b6b7a">Lun &amp; Smyth 2016</text>
  <text x="870" y="376" font-size="13" fill="#5b6b7a">Orlando et al. 2014</text>
</svg>
