<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 380" width="1120" height="380" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="dim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/></marker>
  </defs>
  <rect width="1120" height="380" fill="#ffffff"/>
  <text x="20" y="28" font-size="18" font-weight="bold" fill="#1b2a3a">Each peak gets one category, by priority</text>
  <!-- gene A on + strand -->
  <line x1="300" y1="120" x2="760" y2="120" stroke="#1b2a3a" stroke-width="1.8"/>
  <rect x="300" y="108" width="26" height="24" fill="#e9c46a" stroke="#1b2a3a"/>
  <rect x="320" y="108" width="20" height="24" fill="#1b2a3a"/>
  <rect x="450" y="108" width="30" height="24" fill="#1b2a3a"/>
  <rect x="600" y="108" width="30" height="24" fill="#1b2a3a"/>
  <rect x="720" y="108" width="20" height="24" fill="#1b2a3a"/><rect x="740" y="108" width="20" height="24" fill="#e9c46a" stroke="#1b2a3a"/>
  <path d="M300,108 L300,90 L330,90" fill="none" stroke="#1b2a3a" stroke-width="2"/><path d="M326,85 L336,90 L326,95 z" fill="#1b2a3a"/>
  <text x="310" y="80" font-size="14" fill="#1b2a3a">TSS of gene A</text>
  <!-- promoter window -->
  <rect x="250" y="146" width="100" height="18" fill="#c0392b" fill-opacity="0.25" stroke="#c0392b"/>
  <line x1="250" y1="176" x2="350" y2="176" stroke="#1b2a3a" stroke-width="1.3" marker-start="url(#dim)" marker-end="url(#dim)"/>
  <text x="300" y="196" font-size="14" fill="#1b2a3a" text-anchor="middle">TSS ± 1 kb</text>
  <!-- peaks -->
  <g font-size="14" fill="#1b2a3a" text-anchor="middle">
    <rect x="276" y="216" width="26" height="14" rx="3" fill="#c0392b"/><text x="289" y="248">promoter</text>
    <rect x="452" y="216" width="26" height="14" rx="3" fill="#e9c46a"/><text x="465" y="248">exon</text>
    <rect x="530" y="216" width="26" height="14" rx="3" fill="#2a9d8f"/><text x="543" y="248">intron</text>
    <rect x="760" y="216" width="26" height="14" rx="3" fill="#9aa5b1"/><text x="773" y="248">downstream</text>
    <rect x="930" y="216" width="26" height="14" rx="3" fill="#9aa5b1"/><text x="943" y="248">distal intergenic</text>
    <rect x="110" y="216" width="26" height="14" rx="3" fill="#9aa5b1"/><text x="123" y="248">distal intergenic</text>
  </g>
  <line x1="40" y1="212" x2="1100" y2="212" stroke="#cfd8e0" stroke-width="1"/>
  <text x="20" y="290" font-size="15" fill="#1b2a3a"><tspan font-weight="bold">Priority</tspan> (ChIPseeker default): promoter &gt; 5' UTR &gt; 3' UTR &gt; exon &gt; intron &gt; downstream &gt; distal intergenic. A peak in the first</text>
  <text x="20" y="312" font-size="15" fill="#1b2a3a">intron within 1 kb of the TSS counts as "promoter". The answer depends on the promoter window, on the annotation (all</text>
  <text x="20" y="334" font-size="15" fill="#1b2a3a">transcripts or one per gene; protein-coding only or with lncRNAs) and on the priority order. Report all three.</text>
  <text x="20" y="364" font-size="15" fill="#5b6b7a">Separately, each peak is assigned its nearest TSS (and the distance), whatever its category.</text>
</svg>
