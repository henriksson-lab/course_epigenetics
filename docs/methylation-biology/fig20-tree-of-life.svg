<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 382" width="1120" height="382" font-family="Helvetica, Arial, sans-serif">
<rect width="1120" height="382" fill="white"/>
<text x="30" y="28" font-size="16" font-weight="bold" fill="#5b6b7a">organism</text>
<text x="300" y="28" font-size="16" font-weight="bold" fill="#5b6b7a">5mC?</text>
<text x="370" y="28" font-size="16" font-weight="bold" fill="#5b6b7a">where</text>
<text x="840" y="28" font-size="16" font-weight="bold" fill="#5b6b7a">enzymes</text>
<line x1="30" y1="40" x2="1090" y2="40" stroke="#dfe6ec" stroke-width="1.5"/>
<rect x="20" y="44" width="1080" height="38" fill="#f4f6f8"/>
<text x="30" y="68" font-size="16" fill="#1b2a3a">mammals (human, mouse)</text>
<circle cx="318" cy="62" r="8" fill="#1b2a3a"/>
<text x="370" y="68" font-size="16" fill="#1b2a3a">CpG, genome-wide (70–80% of CpGs), not CGIs</text>
<text x="840" y="68" font-size="16" fill="#1b2a3a">DNMT1, DNMT3A/B/L</text>
<text x="30" y="108" font-size="16" fill="#1b2a3a">honey bee</text>
<circle cx="318" cy="102" r="8" fill="#1b2a3a"/>
<text x="370" y="108" font-size="16" fill="#1b2a3a">CpG, low; gene bodies only (mosaic)</text>
<text x="840" y="108" font-size="16" fill="#1b2a3a">DNMT1, DNMT3</text>
<rect x="20" y="124" width="1080" height="38" fill="#f4f6f8"/>
<text x="30" y="148" font-size="16" fill="#1b2a3a">fruit fly (Drosophila)</text>
<circle cx="318" cy="142" r="8" fill="white" stroke="#1b2a3a" stroke-width="2"/>
<text x="370" y="148" font-size="16" fill="#1b2a3a">essentially none</text>
<text x="840" y="148" font-size="16" fill="#1b2a3a">DNMT2 only (tRNA)</text>
<text x="30" y="188" font-size="16" fill="#1b2a3a">nematode (C. elegans)</text>
<circle cx="318" cy="182" r="8" fill="white" stroke="#1b2a3a" stroke-width="2"/>
<text x="370" y="188" font-size="16" fill="#1b2a3a">none</text>
<text x="840" y="188" font-size="16" fill="#1b2a3a">no DNMT</text>
<rect x="20" y="204" width="1080" height="38" fill="#f4f6f8"/>
<text x="30" y="228" font-size="16" fill="#1b2a3a">yeasts (budding, fission)</text>
<circle cx="318" cy="222" r="8" fill="white" stroke="#1b2a3a" stroke-width="2"/>
<text x="370" y="228" font-size="16" fill="#1b2a3a">none</text>
<text x="840" y="228" font-size="16" fill="#1b2a3a">no DNMT</text>
<text x="30" y="268" font-size="16" fill="#1b2a3a">Neurospora (a fungus)</text>
<circle cx="318" cy="262" r="8" fill="#1b2a3a"/>
<text x="370" y="268" font-size="16" fill="#1b2a3a">repeats mutated by RIP</text>
<text x="840" y="268" font-size="16" fill="#1b2a3a">DIM-2, guided by H3K9me3</text>
<rect x="20" y="284" width="1080" height="38" fill="#f4f6f8"/>
<text x="30" y="308" font-size="16" fill="#1b2a3a">plants (Arabidopsis, poplar)</text>
<circle cx="318" cy="302" r="8" fill="#1b2a3a"/>
<text x="370" y="308" font-size="16" fill="#1b2a3a">CG, CHG, CHH: transposons; CG in gene bodies</text>
<text x="840" y="308" font-size="16" fill="#1b2a3a">MET1, CMT2/3, DRM2</text>
<text x="30" y="348" font-size="16" fill="#1b2a3a">bacteria (E. coli)</text>
<circle cx="318" cy="342" r="8" fill="#1b2a3a"/>
<text x="370" y="348" font-size="16" fill="#1b2a3a">5mC, 6mA, 4mC: self vs foreign DNA</text>
<text x="840" y="348" font-size="16" fill="#1b2a3a">restriction–modification</text>
</svg>