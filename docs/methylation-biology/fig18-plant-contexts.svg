<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 412" width="1120" height="412" font-family="Helvetica, Arial, sans-serif">
<rect width="1120" height="412" fill="white"/>
<text x="30" y="28" font-size="16" font-weight="bold" fill="#5b6b7a">context</text>
<text x="150" y="28" font-size="16" font-weight="bold" fill="#5b6b7a">both strands</text>
<text x="400" y="28" font-size="16" font-weight="bold" fill="#5b6b7a">symmetric?</text>
<text x="540" y="28" font-size="16" font-weight="bold" fill="#5b6b7a">maintained by</text>
<text x="800" y="28" font-size="16" font-weight="bold" fill="#5b6b7a">level in Arabidopsis</text>
<line x1="30" y1="40" x2="1090" y2="40" stroke="#dfe6ec" stroke-width="1.5"/>
<text x="30" y="104" font-size="24" font-weight="bold" fill="#1b2a3a">CG</text>
<text x="144" y="88" font-size="14" text-anchor="end" fill="#5b6b7a">5&#39;</text>
<text x="144" y="134" font-size="14" text-anchor="end" fill="#5b6b7a">3&#39;</text>
<rect x="150" y="68" width="34" height="28" fill="#f4f6f8" stroke="#1b2a3a" stroke-width="1.2"/>
<text x="167" y="88" font-size="18" text-anchor="middle" font-weight="bold" fill="#1b2a3a">C</text>
<rect x="150" y="110" width="34" height="28" fill="#f4f6f8" stroke="#1b2a3a" stroke-width="1.2"/>
<text x="167" y="130" font-size="18" text-anchor="middle" font-weight="bold" fill="#1b2a3a">G</text>
<line x1="167" y1="68" x2="167" y2="61" stroke="#1b2a3a" stroke-width="2"/><circle cx="167" cy="56" r="5" fill="#1b2a3a"/>
<rect x="190" y="68" width="34" height="28" fill="#f4f6f8" stroke="#1b2a3a" stroke-width="1.2"/>
<text x="207" y="88" font-size="18" text-anchor="middle" font-weight="bold" fill="#1b2a3a">G</text>
<rect x="190" y="110" width="34" height="28" fill="#f4f6f8" stroke="#1b2a3a" stroke-width="1.2"/>
<text x="207" y="130" font-size="18" text-anchor="middle" font-weight="bold" fill="#1b2a3a">C</text>
<line x1="207" y1="138" x2="207" y2="145" stroke="#1b2a3a" stroke-width="2"/><circle cx="207" cy="150" r="5" fill="#1b2a3a"/>
<text x="236" y="88" font-size="14" fill="#5b6b7a">3&#39;</text>
<text x="236" y="134" font-size="14" fill="#5b6b7a">5&#39;</text>
<text x="400" y="110" font-size="17" fill="#2e8b57" font-weight="bold">yes</text>
<text x="540" y="100" font-size="16" fill="#1b2a3a">MET1 (a DNMT1)</text>
<text x="540" y="121" font-size="16" fill="#1b2a3a">with VIM (UHRF1-like)</text>
<text x="800" y="110" font-size="16" fill="#1b2a3a">~24% of CGs</text>
<line x1="30" y1="166" x2="1090" y2="166" stroke="#dfe6ec" stroke-width="1.5"/>
<text x="30" y="219" font-size="24" font-weight="bold" fill="#1b2a3a">CHG</text>
<text x="144" y="203" font-size="14" text-anchor="end" fill="#5b6b7a">5&#39;</text>
<text x="144" y="249" font-size="14" text-anchor="end" fill="#5b6b7a">3&#39;</text>
<rect x="150" y="183" width="34" height="28" fill="#f4f6f8" stroke="#1b2a3a" stroke-width="1.2"/>
<text x="167" y="203" font-size="18" text-anchor="middle" font-weight="bold" fill="#1b2a3a">C</text>
<rect x="150" y="225" width="34" height="28" fill="#f4f6f8" stroke="#1b2a3a" stroke-width="1.2"/>
<text x="167" y="245" font-size="18" text-anchor="middle" font-weight="bold" fill="#1b2a3a">G</text>
<line x1="167" y1="183" x2="167" y2="176" stroke="#1b2a3a" stroke-width="2"/><circle cx="167" cy="171" r="5" fill="#1b2a3a"/>
<rect x="190" y="183" width="34" height="28" fill="#f4f6f8" stroke="#1b2a3a" stroke-width="1.2"/>
<text x="207" y="203" font-size="18" text-anchor="middle" font-weight="bold" fill="#1b2a3a">H</text>
<rect x="190" y="225" width="34" height="28" fill="#f4f6f8" stroke="#1b2a3a" stroke-width="1.2"/>
<text x="207" y="245" font-size="18" text-anchor="middle" font-weight="bold" fill="#1b2a3a">D</text>
<rect x="230" y="183" width="34" height="28" fill="#f4f6f8" stroke="#1b2a3a" stroke-width="1.2"/>
<text x="247" y="203" font-size="18" text-anchor="middle" font-weight="bold" fill="#1b2a3a">G</text>
<rect x="230" y="225" width="34" height="28" fill="#f4f6f8" stroke="#1b2a3a" stroke-width="1.2"/>
<text x="247" y="245" font-size="18" text-anchor="middle" font-weight="bold" fill="#1b2a3a">C</text>
<line x1="247" y1="253" x2="247" y2="260" stroke="#1b2a3a" stroke-width="2"/><circle cx="247" cy="265" r="5" fill="#1b2a3a"/>
<text x="276" y="203" font-size="14" fill="#5b6b7a">3&#39;</text>
<text x="276" y="249" font-size="14" fill="#5b6b7a">5&#39;</text>
<text x="400" y="225" font-size="17" fill="#2e8b57" font-weight="bold">yes</text>
<text x="540" y="215" font-size="16" fill="#1b2a3a">CMT3, in a loop with</text>
<text x="540" y="236" font-size="16" fill="#1b2a3a">H3K9me2 (KYP/SUVH4)</text>
<text x="800" y="225" font-size="16" fill="#1b2a3a">~7% of CHGs</text>
<line x1="30" y1="281" x2="1090" y2="281" stroke="#dfe6ec" stroke-width="1.5"/>
<text x="30" y="334" font-size="24" font-weight="bold" fill="#1b2a3a">CHH</text>
<text x="144" y="318" font-size="14" text-anchor="end" fill="#5b6b7a">5&#39;</text>
<text x="144" y="364" font-size="14" text-anchor="end" fill="#5b6b7a">3&#39;</text>
<rect x="150" y="298" width="34" height="28" fill="#f4f6f8" stroke="#1b2a3a" stroke-width="1.2"/>
<text x="167" y="318" font-size="18" text-anchor="middle" font-weight="bold" fill="#1b2a3a">C</text>
<rect x="150" y="340" width="34" height="28" fill="#f4f6f8" stroke="#1b2a3a" stroke-width="1.2"/>
<text x="167" y="360" font-size="18" text-anchor="middle" font-weight="bold" fill="#1b2a3a">G</text>
<line x1="167" y1="298" x2="167" y2="291" stroke="#1b2a3a" stroke-width="2"/><circle cx="167" cy="286" r="5" fill="#1b2a3a"/>
<rect x="190" y="298" width="34" height="28" fill="#f4f6f8" stroke="#1b2a3a" stroke-width="1.2"/>
<text x="207" y="318" font-size="18" text-anchor="middle" font-weight="bold" fill="#1b2a3a">H</text>
<rect x="190" y="340" width="34" height="28" fill="#f4f6f8" stroke="#1b2a3a" stroke-width="1.2"/>
<text x="207" y="360" font-size="18" text-anchor="middle" font-weight="bold" fill="#1b2a3a">D</text>
<rect x="230" y="298" width="34" height="28" fill="#f4f6f8" stroke="#1b2a3a" stroke-width="1.2"/>
<text x="247" y="318" font-size="18" text-anchor="middle" font-weight="bold" fill="#1b2a3a">H</text>
<rect x="230" y="340" width="34" height="28" fill="#f4f6f8" stroke="#1b2a3a" stroke-width="1.2"/>
<text x="247" y="360" font-size="18" text-anchor="middle" font-weight="bold" fill="#1b2a3a">D</text>
<text x="276" y="318" font-size="14" fill="#5b6b7a">3&#39;</text>
<text x="276" y="364" font-size="14" fill="#5b6b7a">5&#39;</text>
<text x="400" y="340" font-size="17" fill="#a8324a" font-weight="bold">no</text>
<text x="540" y="330" font-size="16" fill="#1b2a3a">DRM2 by RNA-directed</text>
<text x="540" y="351" font-size="16" fill="#1b2a3a">methylation; CMT2 (with DDM1)</text>
<text x="800" y="340" font-size="16" fill="#1b2a3a">~2% of CHHs</text>
<text x="30" y="402" font-size="14" fill="#5b6b7a">H = A, C or T; D = its complement (A, G or T). Levels: genome-wide averages (Cokus et al. 2008; Lister et al. 2008).</text>
</svg>