<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 400" width="1120" height="400" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7a"/></marker></defs>
<rect width="1120" height="400" fill="#ffffff"/>
<text x="560" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1b2a3a">Modified-base tags in a BAM record (SAM tags specification)</text>
<!-- tag strings -->
<rect x="150" y="50" width="820" height="66" rx="8" fill="#f4f6f8"/>
<text x="170" y="76" font-size="17" font-family="Courier New, monospace" fill="#1b2a3a">SEQ  A C G T C A C G G C G T</text>
<text x="170" y="102" font-size="17" font-family="Courier New, monospace" fill="#1b2a3a">MM:Z:<tspan fill="#2a6f97" font-weight="bold">C+m?</tspan>,<tspan fill="#c0392b" font-weight="bold">0,1,0</tspan>;    ML:B:C,<tspan fill="#2e8b57" font-weight="bold">242,13,128</tspan></text>
<!-- read bases -->
<g font-size="22" font-family="Courier New, monospace" font-weight="bold" text-anchor="middle" fill="#1b2a3a">
<text x="160" y="190">A</text><text x="230" y="190">C</text><text x="300" y="190">G</text><text x="370" y="190">T</text><text x="440" y="190">C</text><text x="510" y="190">A</text><text x="580" y="190">C</text><text x="650" y="190">G</text><text x="720" y="190">G</text><text x="790" y="190">C</text><text x="860" y="190">G</text><text x="930" y="190">T</text>
</g>
<g font-size="13" text-anchor="middle" fill="#5b6b7a">
<text x="230" y="158">C #1</text><text x="440" y="158">C #2</text><text x="580" y="158">C #3</text><text x="790" y="158">C #4</text>
</g>
<!-- skip annotations -->
<g font-size="15" text-anchor="middle">
<text x="230" y="226" fill="#c0392b">skip 0 → call</text>
<text x="440" y="226" fill="#5b6b7a">skipped (?)</text>
<text x="580" y="226" fill="#c0392b">skip 1 → call</text>
<text x="790" y="226" fill="#c0392b">skip 0 → call</text>
</g>
<!-- lollipops with probabilities -->
<line x1="230" y1="244" x2="230" y2="262" stroke="#1b2a3a" stroke-width="2"/><circle cx="230" cy="270" r="9" fill="#1b2a3a"/>
<line x1="580" y1="244" x2="580" y2="262" stroke="#1b2a3a" stroke-width="2"/><circle cx="580" cy="270" r="9" fill="#ffffff" stroke="#1b2a3a" stroke-width="2"/>
<line x1="790" y1="244" x2="790" y2="262" stroke="#1b2a3a" stroke-width="2"/><circle cx="790" cy="270" r="9" fill="#ffffff" stroke="#5b6b7a" stroke-width="2" stroke-dasharray="3,2"/>
<g font-size="15" text-anchor="middle" fill="#2e8b57">
<text x="230" y="302">242 → p = 0.95</text><text x="580" y="302">13 → p = 0.05</text><text x="790" y="302">128 → p = 0.50</text>
</g>
<g font-size="14" text-anchor="middle" fill="#1b2a3a">
<text x="230" y="322">5mC</text><text x="580" y="322">unmodified</text><text x="790" y="322">uncertain: filtered</text>
</g>
<!-- legend box -->
<rect x="40" y="342" width="1040" height="46" rx="8" fill="#f4f6f8"/>
<text x="60" y="362" font-size="15" fill="#1b2a3a"><tspan fill="#2a6f97" font-weight="bold">C+m?</tspan>: base C, top strand, 5mC; "?" = Cs without a call are unknown ("." would mean unmodified).</text>
<text x="60" y="381" font-size="15" fill="#1b2a3a"><tspan fill="#c0392b" font-weight="bold">MM</tspan>: Cs to skip before the next call.  <tspan fill="#2e8b57" font-weight="bold">ML</tspan>: probability × 256 (one byte).  Real reads also carry C+h? (5hmC).</text>
</svg>
