<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 330" width="1120" height="330" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7a"/></marker></defs>
<rect width="1120" height="330" fill="#ffffff"/>
<g font-size="15" text-anchor="middle" fill="#1b2a3a">
<!-- boxes row -->
<rect x="20" y="60" width="150" height="70" rx="10" fill="#f4f6f8" stroke="#5b6b7a" stroke-width="1.5"/>
<text x="95" y="90">raw signal</text><text x="95" y="112" fill="#5b6b7a" font-size="14">POD5 / BAM kinetics</text>
<rect x="210" y="60" width="170" height="70" rx="10" fill="#eaf1f7" stroke="#2a6f97" stroke-width="1.5"/>
<text x="295" y="90">basecall + mods</text><text x="295" y="112" fill="#5b6b7a" font-size="14">dorado / jasmine</text>
<rect x="420" y="60" width="150" height="70" rx="10" fill="#eaf1f7" stroke="#2a6f97" stroke-width="1.5"/>
<text x="495" y="90">align</text><text x="495" y="112" fill="#5b6b7a" font-size="14">minimap2 / pbmm2</text>
<rect x="610" y="60" width="170" height="70" rx="10" fill="#fdf1e6" stroke="#e67e22" stroke-width="1.5"/>
<text x="695" y="90">modBAM</text><text x="695" y="112" fill="#5b6b7a" font-size="14">reads + MM/ML tags</text>
<rect x="820" y="20" width="280" height="56" rx="10" fill="#eaf5ee" stroke="#2e8b57" stroke-width="1.5"/>
<text x="960" y="44">modkit pileup → bedMethyl</text><text x="960" y="64" fill="#5b6b7a" font-size="14">per-CpG (or per-A) counts</text>
<rect x="820" y="112" width="280" height="56" rx="10" fill="#eaf5ee" stroke="#2e8b57" stroke-width="1.5"/>
<text x="960" y="136">modkit extract → per-read calls</text><text x="960" y="156" fill="#5b6b7a" font-size="14">single-molecule plots, footprints</text>
<!-- phasing branch -->
<rect x="420" y="210" width="150" height="70" rx="10" fill="#f4f6f8" stroke="#5b6b7a" stroke-width="1.5"/>
<text x="495" y="240">call SNPs</text><text x="495" y="262" fill="#5b6b7a" font-size="14">Clair3 / DeepVariant</text>
<rect x="610" y="210" width="170" height="70" rx="10" fill="#f4f6f8" stroke="#5b6b7a" stroke-width="1.5"/>
<text x="695" y="240">phase + haplotag</text><text x="695" y="262" fill="#5b6b7a" font-size="14">WhatsHap / LongPhase</text>
<rect x="820" y="210" width="280" height="70" rx="10" fill="#eaf5ee" stroke="#2e8b57" stroke-width="1.5"/>
<text x="960" y="240">modkit pileup --phased</text><text x="960" y="262" fill="#5b6b7a" font-size="14">hp1 / hp2 bedMethyl; DMRs (modkit dmr)</text>
</g>
<g stroke="#5b6b7a" stroke-width="2.2" fill="none">
<line x1="170" y1="95" x2="206" y2="95" marker-end="url(#ah)"/>
<line x1="380" y1="95" x2="416" y2="95" marker-end="url(#ah)"/>
<line x1="570" y1="95" x2="606" y2="95" marker-end="url(#ah)"/>
<line x1="780" y1="84" x2="816" y2="54" marker-end="url(#ah)"/>
<line x1="780" y1="106" x2="816" y2="136" marker-end="url(#ah)"/>
<line x1="495" y1="130" x2="495" y2="206" marker-end="url(#ah)"/>
<line x1="695" y1="130" x2="695" y2="206" marker-end="url(#ah)"/>
<line x1="570" y1="245" x2="606" y2="245" marker-end="url(#ah)"/>
<line x1="780" y1="245" x2="816" y2="245" marker-end="url(#ah)"/>
</g>
<text x="20" y="200" font-size="15" fill="#1b2a3a">Production: ONT wf-human-variation</text>
<text x="20" y="222" font-size="15" fill="#1b2a3a">or PacBio HiFi-human-WGS run all of it</text>
<text x="20" y="244" font-size="15" fill="#1b2a3a">(Nextflow / WDL).</text>
<text x="20" y="282" font-size="14" fill="#5b6b7a">The exercise starts at the modBAM:</text>
<text x="20" y="302" font-size="14" fill="#5b6b7a">basecalling needs GPUs and raw data.</text>
</svg>
