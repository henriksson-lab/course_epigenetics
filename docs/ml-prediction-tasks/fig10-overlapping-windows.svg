<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 380" width="1120" height="380" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7a"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker></defs>
<rect width="1120" height="380" fill="#ffffff"/>
<text x="40" y="30" font-size="18" font-weight="bold" fill="#1b2a3a">Shifted copies of one region, split at random</text>
<line x1="60" y1="110" x2="560" y2="110" stroke="#1b2a3a" stroke-width="2"/>
<rect x="260" y="80" width="100" height="22" fill="#2e8b57" fill-opacity="0.35" stroke="#2e8b57"/>
<text x="310" y="72" text-anchor="middle" font-size="14" fill="#2e8b57">ATAC peak</text>
<rect x="110.0" y="128" width="250" height="22" rx="3" fill="#2a6f97" fill-opacity="0.8"/>
<text x="235.0" y="144" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">train  (shift -150 bp)</text>
<rect x="185.0" y="160" width="250" height="22" rx="3" fill="#c0392b" fill-opacity="0.8"/>
<text x="310.0" y="176" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">test  (shift +0 bp)</text>
<rect x="260.0" y="192" width="250" height="22" rx="3" fill="#2a6f97" fill-opacity="0.8"/>
<text x="385.0" y="208" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">train  (shift +150 bp)</text>
<text x="60" y="244" font-size="15" fill="#1b2a3a">Each window shares 70% of its bases with its neighbour.</text>
<text x="60" y="268" font-size="15" fill="#1b2a3a">The test window’s nearest training example is its own copy.</text>
<text x="640" y="64" font-size="16" font-weight="bold" fill="#1b2a3a">Same problem, by design: genome tiling</text>
<rect x="650" y="90" width="240" height="18" rx="3" fill="#5b6b7a" fill-opacity="0.25" stroke="#5b6b7a"/>
<rect x="746" y="90" width="48" height="18" fill="#e67e22" fill-opacity="0.85"/>
<rect x="698" y="116" width="240" height="18" rx="3" fill="#5b6b7a" fill-opacity="0.25" stroke="#5b6b7a"/>
<rect x="794" y="116" width="48" height="18" fill="#e67e22" fill-opacity="0.85"/>
<rect x="746" y="142" width="240" height="18" rx="3" fill="#5b6b7a" fill-opacity="0.25" stroke="#5b6b7a"/>
<rect x="842" y="142" width="48" height="18" fill="#e67e22" fill-opacity="0.85"/>
<rect x="794" y="168" width="240" height="18" rx="3" fill="#5b6b7a" fill-opacity="0.25" stroke="#5b6b7a"/>
<rect x="890" y="168" width="48" height="18" fill="#e67e22" fill-opacity="0.85"/>
<rect x="842" y="194" width="240" height="18" rx="3" fill="#5b6b7a" fill-opacity="0.25" stroke="#5b6b7a"/>
<rect x="938" y="194" width="48" height="18" fill="#e67e22" fill-opacity="0.85"/>
<text x="650" y="244" font-size="15" fill="#1b2a3a">label: centre 200 bp (orange); input: 1000 bp (grey)</text>
<text x="650" y="268" font-size="15" fill="#1b2a3a">neighbouring inputs share 800 bp</text>
<text x="40" y="320" font-size="16" fill="#1b2a3a">Also: one peak listed several times (ENCODE IDR files: 155 153 lines, 75 409 distinct regions in GM12878 ATAC).</text>
<text x="40" y="350" font-size="16" font-weight="bold" fill="#1b2a3a">Split first, by region or chromosome; augment afterwards, within each set.</text>
