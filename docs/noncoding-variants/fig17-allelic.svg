<text x="20" y="276.5" font-size="15" fill="#1b2a3a">reads covering the SNP: 14 with A, 5 with G. Same cells, same nucleus:</text>
<text x="20" y="298.5" font-size="15" fill="#1b2a3a">only the allele differs. Under no effect, A ~ Binomial(19, 0.5): p = 0.06.</text>
