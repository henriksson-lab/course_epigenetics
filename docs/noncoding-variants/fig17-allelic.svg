<text x="640" y="210" font-size="15" fill="#1b2a3a">Reads with the non-reference allele are lost more often,</text>
<text x="640" y="232" font-size="15" fill="#1b2a3a">so the reference fraction drifts above 0.5.</text>
<text x="640" y="266" font-size="15" fill="#1b2a3a">Fixes: test against the genome-wide reference fraction;</text>
<text x="640" y="288" font-size="15" fill="#1b2a3a">WASP (re-map each read with the other allele, drop reads</text>
<text x="640" y="310" font-size="15" fill="#1b2a3a">that map differently); align to a personal genome.</text>
