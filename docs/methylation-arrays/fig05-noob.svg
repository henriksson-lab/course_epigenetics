<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 380" width="1120" height="380" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7a"/></marker></defs>
<rect width="1120" height="380" fill="#ffffff"/>
<!-- Panel A -->
<text x="185" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1b2a3a">A. Where background comes from</text>
<text x="185" y="54" text-anchor="middle" font-size="15" fill="#5b6b7a">a Type I probe pair designed for red</text>
<line x1="60" y1="250" x2="320" y2="250" stroke="#1b2a3a" stroke-width="1.5"/>
<rect x="80" y="100" width="44" height="150" fill="#c0392b"/>
<rect x="134" y="226" width="44" height="24" fill="#2e8b57"/>
<rect x="210" y="150" width="44" height="100" fill="#c0392b"/>
<rect x="264" y="229" width="44" height="21" fill="#2e8b57"/>
<text x="129" y="272" text-anchor="middle" font-size="15" fill="#1b2a3a">M bead</text>
<text x="259" y="272" text-anchor="middle" font-size="15" fill="#1b2a3a">U bead</text>
<text x="102" y="92" text-anchor="middle" font-size="14" fill="#c0392b">red</text>
<text x="156" y="218" text-anchor="middle" font-size="14" fill="#2e8b57">green</text>
<text x="185" y="304" text-anchor="middle" font-size="15" fill="#1b2a3a">The green ("out-of-band") signal</text>
<text x="185" y="324" text-anchor="middle" font-size="15" fill="#1b2a3a">of red probes is pure background:</text>
<text x="185" y="344" text-anchor="middle" font-size="15" fill="#1b2a3a">measured for free on every array</text>
<!-- Panel B -->
<text x="570" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1b2a3a">B. Normal + exponential model</text>
<line x1="400" y1="250" x2="740" y2="250" stroke="#1b2a3a" stroke-width="1.5"/>
<text x="570" y="272" text-anchor="middle" font-size="15" fill="#1b2a3a">intensity</text>
<!-- background normal -->
<path d="M410,250 C430,250 440,246 450,225 C458,205 464,120 472,120 C480,120 486,205 494,225 C504,246 514,250 534,250" fill="#5b6b7a" fill-opacity="0.18" stroke="#5b6b7a" stroke-width="2"/>
<text x="470" y="92" text-anchor="middle" font-size="14" fill="#5b6b7a">background</text>
<text x="470" y="108" text-anchor="middle" font-size="14" fill="#5b6b7a">(normal)</text>
<!-- signal exponential -->
<path d="M472,150 C520,190 580,225 730,246" fill="none" stroke="#2a6f97" stroke-width="2.5"/>
<text x="610" y="190" font-size="14" fill="#2a6f97">true signal (exponential)</text>
<text x="570" y="306" text-anchor="middle" font-size="15" fill="#1b2a3a">observed = background + signal</text>
<text x="570" y="326" text-anchor="middle" font-size="15" fill="#1b2a3a">noob reports E[ signal | observed ]:</text>
<text x="570" y="346" text-anchor="middle" font-size="15" fill="#1b2a3a">low values shrink towards 0, never below</text>
<!-- Panel C -->
<text x="945" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1b2a3a">C. Dye bias</text>
<text x="945" y="54" text-anchor="middle" font-size="15" fill="#5b6b7a">control probes with equal target</text>
<line x1="800" y1="250" x2="1090" y2="250" stroke="#1b2a3a" stroke-width="1.5"/>
<rect x="830" y="110" width="50" height="140" fill="#c0392b"/>
<rect x="890" y="160" width="50" height="90" fill="#2e8b57"/>
<line x1="950" y1="180" x2="990" y2="180" stroke="#5b6b7a" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="1000" y="110" width="50" height="140" fill="#2e8b57"/>
<text x="855" y="272" text-anchor="middle" font-size="15" fill="#1b2a3a">red</text>
<text x="915" y="272" text-anchor="middle" font-size="15" fill="#1b2a3a">green</text>
<text x="1025" y="272" text-anchor="middle" font-size="15" fill="#1b2a3a">green</text>
<text x="1025" y="290" text-anchor="middle" font-size="14" fill="#5b6b7a">rescaled</text>
<text x="945" y="324" text-anchor="middle" font-size="15" fill="#1b2a3a">Scale one channel so the</text>
<text x="945" y="344" text-anchor="middle" font-size="15" fill="#1b2a3a">NORM controls agree</text>
</svg>
