<text x="324.0" y="52" text-anchor="middle" font-size="13" fill="#5b6b7a">1050</text>
<line x1="444.0" y1="57" x2="444.0" y2="67" stroke="#5b6b7a" stroke-width="1.5"/>
<text x="444.0" y="52" text-anchor="middle" font-size="13" fill="#5b6b7a">1100</text>
<line x1="564.0" y1="57" x2="564.0" y2="67" stroke="#5b6b7a" stroke-width="1.5"/>
<text x="564.0" y="52" text-anchor="middle" font-size="13" fill="#5b6b7a">1150</text>
<line x1="684.0" y1="57" x2="684.0" y2="67" stroke="#5b6b7a" stroke-width="1.5"/>
<text x="684.0" y="52" text-anchor="middle" font-size="13" fill="#5b6b7a">1200</text>
<line x1="804.0" y1="57" x2="804.0" y2="67" stroke="#5b6b7a" stroke-width="1.5"/>
<text x="804.0" y="52" text-anchor="middle" font-size="13" fill="#5b6b7a">1250</text>
<line x1="924.0" y1="57" x2="924.0" y2="67" stroke="#5b6b7a" stroke-width="1.5"/>
<text x="924.0" y="52" text-anchor="middle" font-size="13" fill="#5b6b7a">1300</text>
<text x="170.0" y="67" text-anchor="end" font-size="14" fill="#5b6b7a">BED coordinate</text>
<rect x="204.0" y="84" width="21.599999999999998" height="76" fill="#e67e22" fill-opacity="0.22"/>
<rect x="902.4" y="84" width="21.599999999999998" height="76" fill="#e67e22" fill-opacity="0.22"/>
