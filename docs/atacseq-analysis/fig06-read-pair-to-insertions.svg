<rect x="924.0" y="124" width="34" height="12" fill="#d9dee3" stroke="#5b6b7a"/>
<line x1="204.0" y1="130" x2="924.0" y2="130" stroke="#1b2a3a" stroke-width="5"/>
<text x="968.0" y="135" font-size="15" fill="#1b2a3a">300-bp fragment</text>
<text x="164.0" y="135" text-anchor="end" font-size="14" fill="#5b6b7a">adapter</text>
<line x1="204.0" y1="108" x2="324.0" y2="108" stroke="#2a6f97" stroke-width="3" marker-end="url(#aa)"/>
<text x="334.0" y="113" font-size="15" fill="#2a6f97">read 1 (+)  [1000, 1050)</text>
<line x1="924.0" y1="152" x2="804.0" y2="152" stroke="#2a6f97" stroke-width="3" marker-end="url(#aa)"/>
<text x="794.0" y="157" text-anchor="end" font-size="15" fill="#2a6f97">read 2 (−)  [1250, 1300)</text>
<path d="M207.79999999999998,182 L221.79999999999998,182 L214.79999999999998,168 z" fill="#c0392b"/>
<text x="210.79999999999998" y="202" text-anchor="start" font-size="15" font-weight="bold" fill="#c0392b">insertion 1004</text>
<path d="M906.2,182 L920.2,182 L913.2,168 z" fill="#c0392b"/>
<text x="917.2" y="202" text-anchor="end" font-size="15" font-weight="bold" fill="#c0392b">insertion 1295</text>
<text x="564.0" y="202" text-anchor="middle" font-size="14" fill="#e67e22">orange: the 9-bp duplications at the two ends</text>
<text x="40" y="248" font-size="15" font-weight="bold" fill="#1b2a3a"></text>
<text x="300" y="248" font-size="15" font-weight="bold" fill="#1b2a3a">in the BAM (SAM text, 1-based)</text>
<text x="600" y="248" font-size="15" font-weight="bold" fill="#1b2a3a">as BED (0-based)</text>
<text x="860" y="248" font-size="15" font-weight="bold" fill="#1b2a3a">insertion site (BED)</text>
<line x1="40" y1="258" x2="1090" y2="258" stroke="#5b6b7a" stroke-width="1"/>
<text x="40" y="284" font-size="15" fill="#1b2a3a">read 1, + strand</text>
<text x="300" y="284" font-size="15" fill="#1b2a3a">POS 1001, CIGAR 50M</text>
<text x="600" y="284" font-size="15" fill="#1b2a3a">start 1000, end 1050</text>
<text x="860" y="284" font-size="15" fill="#c0392b">start + 4 = 1004</text>
<text x="40" y="314" font-size="15" fill="#1b2a3a">read 2, − strand</text>
<text x="300" y="314" font-size="15" fill="#1b2a3a">POS 1251, CIGAR 50M</text>
<text x="600" y="314" font-size="15" fill="#1b2a3a">start 1250, end 1300</text>
<text x="860" y="314" font-size="15" fill="#c0392b">end − 5 = 1295</text>
<text x="40" y="344" font-size="15" fill="#1b2a3a">fragment</text>
<text x="300" y="344" font-size="15" fill="#1b2a3a">TLEN 300</text>
<text x="600" y="344" font-size="15" fill="#1b2a3a">[1000, 1300)</text>
<text x="860" y="344" font-size="15" fill="#1b2a3a">insertions 291 bp apart</text>
<text x="40" y="386" font-size="14" fill="#5b6b7a">A − strand read is reported by its leftmost base (POS): its 5&#39; end, where Tn5 cut, is the alignment end, 1251 + 50 − 1 = 1300 (1-based).</text>
</svg>