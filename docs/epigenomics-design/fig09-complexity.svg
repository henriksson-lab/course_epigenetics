<text x="910" y="54" font-size="15" fill="#5b6b7a" text-anchor="start">reads</text>
<text x="720" y="82" font-size="16" fill="#1b2a3a" font-weight="bold">M<tspan font-size="12" dy="4">distinct</tspan><tspan dy="-4"> = 12</tspan></text>
<text x="910" y="82" font-size="15" fill="#5b6b7a" text-anchor="start">distinct positions</text>
<text x="720" y="110" font-size="16" fill="#1b2a3a" font-weight="bold">M<tspan font-size="12" dy="4">1</tspan><tspan dy="-4"> = 8</tspan></text>
<text x="910" y="110" font-size="15" fill="#5b6b7a" text-anchor="start">positions with 1 read</text>
<text x="720" y="138" font-size="16" fill="#1b2a3a" font-weight="bold">M<tspan font-size="12" dy="4">2</tspan><tspan dy="-4"> = 2</tspan></text>
<text x="910" y="138" font-size="15" fill="#5b6b7a" text-anchor="start">positions with 2 reads</text>
<text x="720" y="180" font-size="16" fill="#2a6f97" font-weight="bold">NRF</text>
<text x="790" y="180" font-size="16" fill="#1b2a3a">= M<tspan font-size="12" dy="4">distinct</tspan><tspan dy="-4"> / N = 12 / 20 = </tspan><tspan font-weight="bold">0.60</tspan></text>
<text x="720" y="214" font-size="16" fill="#2a6f97" font-weight="bold">PBC1</text>
<text x="790" y="214" font-size="16" fill="#1b2a3a">= M<tspan font-size="12" dy="4">1</tspan><tspan dy="-4"> / M</tspan><tspan font-size="12" dy="4">distinct</tspan><tspan dy="-4"> = 8 / 12 = </tspan><tspan font-weight="bold">0.67</tspan></text>
