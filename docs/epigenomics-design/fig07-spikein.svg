<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 250" width="1120" height="250" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7a"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2a6f97"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e67e22"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8c564b"/></marker></defs>
<rect width="1120" height="250" fill="#ffffff"/>
<text x="95" y="30" font-size="15" fill="#1b2a3a" text-anchor="middle" font-weight="bold">human cells</text>
<circle cx="73" cy="67" r="11" fill="#8ab17d" stroke="#1b2a3a" stroke-width="1.5"/>
<circle cx="95" cy="61" r="11" fill="#8ab17d" stroke="#1b2a3a" stroke-width="1.5"/>
<circle cx="117" cy="69" r="11" fill="#8ab17d" stroke="#1b2a3a" stroke-width="1.5"/>
<circle cx="84" cy="87" r="11" fill="#8ab17d" stroke="#1b2a3a" stroke-width="1.5"/>
<circle cx="108" cy="87" r="11" fill="#8ab17d" stroke="#1b2a3a" stroke-width="1.5"/>
<text x="95" y="152" font-size="30" fill="#1b2a3a" text-anchor="middle" font-weight="bold">+</text>
<text x="95" y="186" font-size="15" fill="#e67e22" text-anchor="middle" font-weight="bold">fly chromatin</text>
<circle cx="73" cy="214" r="11" fill="#f4c27a" stroke="#1b2a3a" stroke-width="1.5"/>
<circle cx="95" cy="208" r="11" fill="#f4c27a" stroke="#1b2a3a" stroke-width="1.5"/>
<circle cx="117" cy="216" r="11" fill="#f4c27a" stroke="#1b2a3a" stroke-width="1.5"/>
<text x="240" y="106" font-size="14" fill="#5b6b7a" text-anchor="middle" font-style="italic"><tspan x="240" dy="0">fixed amount</tspan><tspan x="240" dy="18">per sample</tspan></text>
<line x1="180" y1="140" x2="300" y2="140" stroke="#5b6b7a" stroke-width="2" marker-end="url(#ag)"/>
<rect x="310" y="70" width="170" height="140" rx="6" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="2" />
<text x="395" y="112" font-size="15" fill="#1b2a3a" text-anchor="middle"><tspan x="395" dy="0">IP with one</tspan><tspan x="395" dy="19">antibody: binds</tspan><tspan x="395" dy="19">human and fly</tspan><tspan x="395" dy="19">H3K27me3</tspan></text>
<line x1="482" y1="140" x2="518" y2="140" stroke="#1b2a3a" stroke-width="2" marker-end="url(#ak)"/>
<rect x="520" y="70" width="170" height="140" rx="6" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="2" />
<text x="605" y="112" font-size="15" fill="#1b2a3a" text-anchor="middle"><tspan x="605" dy="0">sequence; align</tspan><tspan x="605" dy="19">to the combined</tspan><tspan x="605" dy="19">human + fly</tspan><tspan x="605" dy="19">genome</tspan></text>
<line x1="692" y1="140" x2="728" y2="140" stroke="#1b2a3a" stroke-width="2" marker-end="url(#ak)"/>
<rect x="730" y="70" width="170" height="140" rx="6" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="2" />
<text x="815" y="112" font-size="15" fill="#1b2a3a" text-anchor="middle"><tspan x="815" dy="0">count fly reads</tspan><tspan x="815" dy="19">N(fly) in each</tspan><tspan x="815" dy="19">sample</tspan></text>
<line x1="902" y1="140" x2="938" y2="140" stroke="#1b2a3a" stroke-width="2" marker-end="url(#ak)"/>
<rect x="940" y="70" width="170" height="140" rx="6" fill="#eaf5ee" stroke="#2e8b57" stroke-width="2" />
<text x="1025" y="112" font-size="15" fill="#1b2a3a" text-anchor="middle"><tspan x="1025" dy="0">scale human</tspan><tspan x="1025" dy="19">signal by</tspan><tspan x="1025" dy="19">α = 1 / N(fly)</tspan></text>
<text x="1025" y="46" font-size="13" fill="#5b6b7a" text-anchor="middle" font-style="italic"><tspan x="1025" dy="0">fewer fly reads relative to</tspan><tspan x="1025" dy="16">human → more human mark</tspan></text>
</svg>
