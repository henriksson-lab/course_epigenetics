<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 360" width="1120" height="360" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a6f97"/>
    </marker>
  </defs>
  <rect width="1120" height="360" fill="#ffffff"/>

  <!-- scale: 2.4 px per bp; molecule starts at x=200 -->
  <!-- A: long insert -->
  <text x="20" y="36" font-size="17" font-weight="bold" fill="#1b2a3a">Fragment longer than the read</text>
  <rect x="140" y="62" width="60" height="22" fill="#f4a261"/>
  <rect x="200" y="62" width="480" height="22" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="1.5"/>
  <rect x="680" y="62" width="60" height="22" fill="#f4a261"/>
  <text x="440" y="78" font-size="15" fill="#1b2a3a" text-anchor="middle">genomic insert, 200 bp</text>
  <text x="170" y="56" font-size="13" fill="#5b6b7a" text-anchor="middle">adapter</text>
  <text x="710" y="56" font-size="13" fill="#5b6b7a" text-anchor="middle">adapter</text>
  <!-- read 1 -->
  <line x1="200" y1="104" x2="436" y2="104" stroke="#2a6f97" stroke-width="5" marker-end="url(#arrB)"/>
  <text x="452" y="109" font-size="15" fill="#2a6f97">read: 100 bp, all genomic</text>
  <text x="780" y="78" font-size="15" fill="#2e8b57">aligns as it is</text>

  <!-- B: short insert -->
  <text x="20" y="168" font-size="17" font-weight="bold" fill="#1b2a3a">Fragment shorter than the read: read-through</text>
  <rect x="140" y="194" width="60" height="22" fill="#f4a261"/>
  <rect x="200" y="194" width="144" height="22" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="1.5"/>
  <rect x="344" y="194" width="180" height="22" fill="#f4a261"/>
  <text x="272" y="210" font-size="15" fill="#1b2a3a" text-anchor="middle">insert, 60 bp</text>
  <text x="434" y="210" font-size="14" fill="#1b2a3a" text-anchor="middle">adapter …</text>
  <!-- read -->
  <line x1="200" y1="236" x2="344" y2="236" stroke="#2a6f97" stroke-width="5"/>
  <line x1="344" y1="236" x2="440" y2="236" stroke="#c0392b" stroke-width="5" marker-end="url(#arrR)"/>
  <text x="452" y="241" font-size="15" fill="#1b2a3a">read: 60 bp genome + <tspan fill="#c0392b">40 bp adapter</tspan></text>
  <g font-family="Courier New, monospace" font-size="15">
    <text x="200" y="272" fill="#2a6f97">GATTACAGGCTTAC…TTGACC</text>
    <text x="398" y="272" fill="#c0392b">CTGTCTCTTATACACATCT</text>
  </g>
  <text x="200" y="296" font-size="13" fill="#5b6b7a">genomic part</text>
  <text x="398" y="296" font-size="13" fill="#5b6b7a">Nextera/Tn5 adapter (ATAC, CUT&amp;Tag)</text>
  <text x="780" y="210" font-size="15" fill="#c0392b">adapter does not match the genome:</text>
  <text x="780" y="230" font-size="15" fill="#c0392b">mismatches, low MAPQ or unmapped</text>
  <!-- trimming arrow -->
  <line x1="780" y1="262" x2="838" y2="262" stroke="#1b2a3a" stroke-width="2.2" marker-end="url(#arr)"/>
  <text x="850" y="267" font-size="15" fill="#2e8b57">trim the adapter, keep 60 bp</text>

  <rect x="20" y="316" width="1080" height="34" rx="6" fill="#f4f6f8" stroke="#cfd8e0"/>
  <text x="560" y="339" font-size="15" fill="#1b2a3a" text-anchor="middle">Short fragments are common in ATAC (nucleosome-free, &lt; 100 bp) and CUT&amp;Tag; rarer in sonicated ChIP with short reads.</text>
</svg>
