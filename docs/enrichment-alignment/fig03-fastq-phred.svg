<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 446" width="1120" height="446" font-family="Helvetica, Arial, sans-serif">
  <rect width="1120" height="446" fill="#ffffff"/>

  <!-- record -->
  <text x="20" y="30" font-size="17" font-weight="bold" fill="#1b2a3a">One FASTQ record (first read of the CTCF ChIP file, 36 bp, 2011)</text>
  <rect x="20" y="44" width="560" height="120" rx="6" fill="#f4f6f8" stroke="#cfd8e0"/>
  <g font-family="Courier New, monospace" font-size="17" fill="#1b2a3a" xml:space="preserve">
    <text x="34" y="72">@MAGNUM:8:1:1064:11147#0/1</text>
    <text x="34" y="98">TCAACATTCATATTAAAAATTCTTAGTAAATTAGAA</text>
    <text x="34" y="124">+</text>
    <text x="34" y="150">eeecceee^aY^^`ddaadda^ddceee^edLYddd</text>
  </g>
  <!-- highlight L (position 32) : char width ~ 10.2 -->
  <rect x="348" y="134" width="12" height="22" fill="#c0392b" fill-opacity="0.2"/>
  <rect x="33" y="134" width="12" height="22" fill="#2e8b57" fill-opacity="0.2"/>
  <g font-size="15" fill="#5b6b7a">
    <text x="600" y="72">name (instrument, lane, tile, x, y)</text>
    <text x="600" y="98">sequence, one letter per base</text>
    <text x="600" y="124">separator</text>
    <text x="600" y="150">quality, one character per base</text>
  </g>

  <!-- decoding -->
  <text x="20" y="206" font-size="17" font-weight="bold" fill="#1b2a3a">Character → Q → error probability</text>
  <g font-size="15" fill="#1b2a3a">
    <text x="20" y="234">Q = ASCII code − offset,   p = 10<tspan dy="-7" font-size="11">−Q/10</tspan></text>
  </g>
  <g font-size="15">
    <text x="20" y="262" fill="#2e8b57"><tspan font-family="Courier New, monospace">e</tspan> = 101;  101 − 64 = Q37;  p = 10<tspan dy="-7" font-size="11">−3.7</tspan><tspan dy="7"> = 0.0002</tspan></text>
    <text x="20" y="288" fill="#c0392b"><tspan font-family="Courier New, monospace">L</tspan> = 76;  76 − 64 = Q12;  p = 10<tspan dy="-7" font-size="11">−1.2</tspan><tspan dy="7"> = 0.063</tspan></text>
  </g>

  <!-- table -->
  <g font-size="15" fill="#1b2a3a">
    <text x="20" y="324" font-weight="bold">Q</text>
    <text x="90" y="324">10</text><text x="180" y="324">20</text><text x="280" y="324">30</text><text x="390" y="324">40</text>
    <text x="20" y="350" font-weight="bold">error</text>
    <text x="90" y="350">1 in 10</text><text x="180" y="350">1 in 100</text><text x="280" y="350">1 in 1000</text><text x="390" y="350">1 in 10 000</text>
  </g>
  <line x1="20" y1="332" x2="500" y2="332" stroke="#cfd8e0" stroke-width="1.5"/>

  <!-- offsets box -->
  <rect x="580" y="186" width="520" height="164" rx="8" fill="#fdf2e9" stroke="#e67e22" stroke-width="1.5"/>
  <text x="596" y="212" font-size="16" font-weight="bold" fill="#1b2a3a">Two offsets exist</text>
  <text x="596" y="238" font-size="15" fill="#1b2a3a"><tspan font-weight="bold">Phred+33</tspan> (Sanger, every Illumina run since 2011):</text>
  <text x="596" y="258" font-size="15" fill="#1b2a3a">characters <tspan font-family="Courier New, monospace">!"#…I</tspan> for Q0 to Q40.</text>
  <text x="596" y="284" font-size="15" fill="#1b2a3a"><tspan font-weight="bold">Phred+64</tspan> (Illumina 1.3–1.7, old ENCODE data):</text>
  <text x="596" y="304" font-size="15" fill="#1b2a3a">characters <tspan font-family="Courier New, monospace">@A…h</tspan>; <tspan font-family="Courier New, monospace">B</tspan> = Q2 marks an unusable tail.</text>
  <text x="596" y="330" font-size="15" fill="#c0392b">Read as +33, <tspan font-family="Courier New, monospace">e</tspan> would be Q68: impossible. Check first!</text>

  <rect x="20" y="374" width="1080" height="60" rx="6" fill="#f4f6f8" stroke="#cfd8e0"/>
  <text x="36" y="399" font-size="15" fill="#1b2a3a">Q is the sequencer's own estimate. Aligners use it to forgive mismatches at low-quality bases; trimmers use it to cut bad tails.</text>
  <text x="36" y="422" font-size="15" fill="#1b2a3a">In this file the quality falls along the read: typical of older Illumina chemistry.</text>
</svg>
