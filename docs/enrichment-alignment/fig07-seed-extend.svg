<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 470" width="1120" height="470" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
  </defs>
  <rect width="1120" height="470" fill="#ffffff"/>

  <!-- 1 seeds -->
  <text x="20" y="30" font-size="17" font-weight="bold" fill="#1b2a3a">1. Seed: look up short exact substrings in the genome index</text>
  <text x="20" y="72" font-size="15" fill="#5b6b7a">read</text>
  <text x="80" y="72" font-family="Courier New, monospace" font-size="17" fill="#1b2a3a" xml:space="preserve">ACGTTGCAGGCTAACCTGAGTTCAAGTCCGATTGCA</text>
  <!-- seed boxes (char width ~10.2) -->
  <g fill="none" stroke-width="2.2">
    <rect x="78" y="80" width="165" height="10" stroke="#2a6f97"/>
    <rect x="200" y="94" width="165" height="10" stroke="#e67e22"/>
    <rect x="282" y="108" width="165" height="10" stroke="#2e8b57"/>
  </g>
  <text x="460" y="104" font-size="14" fill="#5b6b7a">overlapping seeds (16 nt here)</text>
  <!-- index box -->
  <rect x="700" y="46" width="200" height="80" rx="8" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="2"/>
  <text x="800" y="76" font-size="16" font-weight="bold" fill="#1b2a3a" text-anchor="middle">genome index</text>
  <text x="800" y="98" font-size="14" fill="#5b6b7a" text-anchor="middle">FM index</text>
  <text x="800" y="116" font-size="14" fill="#5b6b7a" text-anchor="middle">(bowtie2-build, once)</text>
  <line x1="655" y1="86" x2="696" y2="86" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="902" y1="86" x2="950" y2="86" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="960" y="80" font-size="15" fill="#1b2a3a">candidate</text>
  <text x="960" y="98" font-size="15" fill="#1b2a3a">loci A, B</text>

  <!-- 2 extend -->
  <text x="20" y="168" font-size="17" font-weight="bold" fill="#1b2a3a">2. Extend: align the whole read at each candidate, score mismatches and gaps</text>
  <g font-family="Courier New, monospace" font-size="17" xml:space="preserve">
    <text x="80" y="206" fill="#1b2a3a">ACGTTGCAGGCTAACCTGAGTTCAAGTCCGATTGCA</text>
    <text x="80" y="228" fill="#2e8b57">||||||||||||||||||||||||||||||||||||</text>
    <text x="80" y="250" fill="#1b2a3a">ACGTTGCAGGCTAACCTGAGTTCAAGTCCGATTGCA</text>
  </g>
  <text x="20" y="250" font-size="15" fill="#5b6b7a">locus A</text>
  <text x="480" y="228" font-size="15" fill="#2e8b57">0 mismatches: score 0 (best)</text>
  <g font-family="Courier New, monospace" font-size="17" xml:space="preserve">
    <text x="80" y="288" fill="#1b2a3a">ACGTTGCAGGCTAACCTGAGTTCAAGTCCGATTGCA</text>
    <text x="80" y="310" fill="#2e8b57">||||||||||||||| ||||||||||||| ||||||</text>
    <text x="80" y="332" fill="#1b2a3a">ACGTTGCAGGCTAACGTGAGTTCAAGTCCCATTGCA</text>
  </g>
  <rect x="231" y="316" width="11" height="20" fill="#c0392b" fill-opacity="0.25"/>
  <rect x="384" y="316" width="11" height="20" fill="#c0392b" fill-opacity="0.25"/>
  <text x="20" y="332" font-size="15" fill="#5b6b7a">locus B</text>
  <text x="480" y="310" font-size="15" fill="#c0392b">2 mismatches: score −12 (second best)</text>
  <!-- MAPQ box -->
  <rect x="790" y="196" width="310" height="128" rx="8" fill="#f4f6f8" stroke="#cfd8e0"/>
  <text x="805" y="222" font-size="15" font-weight="bold" fill="#1b2a3a">report the best: locus A</text>
  <text x="805" y="246" font-size="15" fill="#1b2a3a">MAPQ from the gap between</text>
  <text x="805" y="266" font-size="15" fill="#1b2a3a">best and second best:</text>
  <text x="805" y="290" font-size="15" fill="#1b2a3a">big gap → high MAPQ</text>
  <text x="805" y="312" font-size="15" fill="#1b2a3a">tie (a repeat) → MAPQ 0 or 1</text>

  <!-- 3 end-to-end vs local -->
  <text x="20" y="378" font-size="17" font-weight="bold" fill="#1b2a3a">3. End-to-end or local?</text>
  <text x="20" y="408" font-size="15" fill="#1b2a3a"><tspan font-weight="bold">end-to-end</tspan> (bowtie2 default): every base of the read must be aligned; an untrimmed adapter tail costs mismatches.</text>
  <text x="20" y="434" font-size="15" fill="#1b2a3a"><tspan font-weight="bold">local</tspan> (<tspan font-family="Courier New, monospace">--local</tspan>, BWA-MEM): ends that do not match are <tspan font-weight="bold">soft-clipped</tspan>, CIGAR <tspan font-family="Courier New, monospace">60M40S</tspan>. Forgiving, but hides problems.</text>
  <text x="20" y="460" font-size="15" fill="#5b6b7a">Trim first, then align end-to-end: the usual choice for ChIP and ATAC.</text>
</svg>
