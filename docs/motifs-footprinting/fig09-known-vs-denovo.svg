<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 400" width="1120" height="400" font-family="Helvetica, Arial, sans-serif">
  <rect width="1120" height="400" fill="#ffffff"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
  </defs>
  <!-- Known motifs row -->
  <text x="20" y="40" font-size="18" font-weight="bold" fill="#1b2a3a">Known motifs</text>
  <text x="165" y="40" font-size="15" fill="#5b6b7a">(HOMER known, MEME SEA / AME, motifmatchr + Fisher)</text>
  <rect x="20" y="60" width="230" height="110" rx="8" fill="#eaf1f7" stroke="#2a6f97" stroke-width="2"/>
  <text x="135" y="88" font-size="16" font-weight="bold" fill="#1b2a3a" text-anchor="middle">database</text>
  <text x="135" y="112" font-size="15" fill="#1b2a3a" text-anchor="middle">879 JASPAR motifs</text>
  <text x="135" y="134" font-size="15" fill="#1b2a3a" text-anchor="middle">(CIS-BP, HOCOMOCO, …)</text>
  <text x="135" y="156" font-size="15" fill="#5b6b7a" text-anchor="middle">fixed in advance</text>
  <line x1="255" y1="115" x2="320" y2="115" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ar)"/>
  <rect x="325" y="60" width="260" height="110" rx="8" fill="#f4f6f8" stroke="#5b6b7a" stroke-width="1.5"/>
  <text x="455" y="88" font-size="16" font-weight="bold" fill="#1b2a3a" text-anchor="middle">scan target + background</text>
  <text x="455" y="114" font-size="15" fill="#1b2a3a" text-anchor="middle">one 2×2 table per motif</text>
  <text x="455" y="138" font-size="15" fill="#1b2a3a" text-anchor="middle">879 tests → correct for</text>
  <text x="455" y="160" font-size="15" fill="#1b2a3a" text-anchor="middle">multiple testing</text>
  <line x1="590" y1="115" x2="655" y2="115" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ar)"/>
  <rect x="660" y="60" width="440" height="110" rx="8" fill="#f4f6f8" stroke="#5b6b7a" stroke-width="1.5"/>
  <text x="680" y="88" font-size="16" font-weight="bold" fill="#1b2a3a">ranked list of database motifs</text>
  <text x="680" y="114" font-size="15" fill="#1b2a3a">+ fast, directly named, easy to compare</text>
  <text x="680" y="138" font-size="15" fill="#a8324a">− misses motifs not in the database;</text>
  <text x="680" y="160" font-size="15" fill="#a8324a">  a poor PWM for the real TF looks "not enriched"</text>

  <!-- De novo row -->
  <text x="20" y="225" font-size="18" font-weight="bold" fill="#1b2a3a">De novo motifs</text>
  <text x="165" y="225" font-size="15" fill="#5b6b7a">(HOMER de novo, MEME / STREME, chromBPNet + TF-MoDISco)</text>
  <rect x="20" y="245" width="230" height="135" rx="8" fill="#eaf1f7" stroke="#2a6f97" stroke-width="2"/>
  <text x="135" y="273" font-size="16" font-weight="bold" fill="#1b2a3a" text-anchor="middle">count all k-mers</text>
  <g font-family="Courier New, monospace" font-size="15" fill="#1b2a3a">
    <text x="45" y="300">TCCCAAGGGA  ×3.1</text>
    <text x="45" y="322">TCCCTTGGGA  ×2.9</text>
    <text x="45" y="344">CCCAAGGG    ×2.6</text>
    <text x="45" y="366">AAAGAGGAAG  ×2.4</text>
  </g>
  <line x1="255" y1="312" x2="320" y2="312" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ar)"/>
  <rect x="325" y="245" width="260" height="135" rx="8" fill="#f4f6f8" stroke="#5b6b7a" stroke-width="1.5"/>
  <text x="455" y="273" font-size="16" font-weight="bold" fill="#1b2a3a" text-anchor="middle">grow into a PWM</text>
  <text x="455" y="299" font-size="15" fill="#1b2a3a" text-anchor="middle">merge similar enriched words,</text>
  <text x="455" y="321" font-size="15" fill="#1b2a3a" text-anchor="middle">optimise the matrix to separate</text>
  <text x="455" y="343" font-size="15" fill="#1b2a3a" text-anchor="middle">target from background</text>
  <text x="455" y="365" font-size="15" fill="#5b6b7a" text-anchor="middle">(slow: many candidates)</text>
  <line x1="590" y1="312" x2="655" y2="312" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ar)"/>
  <rect x="660" y="245" width="440" height="135" rx="8" fill="#f4f6f8" stroke="#5b6b7a" stroke-width="1.5"/>
  <text x="680" y="273" font-size="16" font-weight="bold" fill="#1b2a3a">new motif → "best match: EBF1 (similarity 0.93)"</text>
  <text x="680" y="299" font-size="15" fill="#1b2a3a">compare with the database (Tomtom, compareMotifs)</text>
  <text x="680" y="323" font-size="15" fill="#1b2a3a">+ finds unknown motifs, cell-type-specific variants,</text>
  <text x="680" y="345" font-size="15" fill="#1b2a3a">  composite sites (e.g. ETS–IRF)</text>
  <text x="680" y="369" font-size="15" fill="#a8324a">− the name is still a guess within a TF family</text>
</svg>
