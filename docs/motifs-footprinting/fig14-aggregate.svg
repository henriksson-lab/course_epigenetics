<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 430" width="1120" height="430" font-family="Helvetica, Arial, sans-serif">
  <rect width="1120" height="430" fill="#ffffff"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a6f97"/>
    </marker>
    <marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#e67e22"/>
    </marker>
  </defs>
  <text x="20" y="30" font-size="18" font-weight="bold" fill="#1b2a3a">1. Read pair → two insertion sites</text>
  <line x1="40" y1="120" x2="420" y2="120" stroke="#5b6b7a" stroke-width="2"/>
  <text x="430" y="125" font-size="15" fill="#5b6b7a">genome</text>
  <line x1="70" y1="90" x2="188" y2="90" stroke="#2a6f97" stroke-width="5"/><path d="M186,82 L202,90 L186,98 z" fill="#2a6f97"/>
  <text x="70" y="78" font-size="15" fill="#2a6f97">read 1 (+)</text>
  <line x1="390" y1="150" x2="272" y2="150" stroke="#e67e22" stroke-width="5"/><path d="M274,142 L258,150 L274,158 z" fill="#e67e22"/>
  <text x="390" y="176" font-size="15" fill="#e67e22" text-anchor="end">read 2 (−)</text>
  <line x1="70" y1="98" x2="70" y2="120" stroke="#2a6f97" stroke-width="1.5" stroke-dasharray="3,2"/>
  <path d="M86,112 L100,112 L93,124 z" fill="#c0392b"/>
  <text x="93" y="146" font-size="15" fill="#c0392b" text-anchor="middle">start + 4</text>
  <line x1="390" y1="142" x2="390" y2="120" stroke="#e67e22" stroke-width="1.5" stroke-dasharray="3,2"/>
  <path d="M355,112 L369,112 L362,124 z" fill="#c0392b"/>
  <text x="330" y="105" font-size="15" fill="#c0392b" text-anchor="middle">end − 5</text>
  <text x="40" y="215" font-size="15" fill="#1b2a3a">Tn5 cuts the two strands 9 bp apart; shifting</text>
  <text x="40" y="237" font-size="15" fill="#1b2a3a">+4 / −5 puts both ends on the centre of the</text>
  <text x="40" y="259" font-size="15" fill="#1b2a3a">insertion (as in <tspan font-style="italic">ATAC-seq processing</tspan>).</text>
  <text x="40" y="295" font-size="15" fill="#1b2a3a">Each fragment gives two single-base events.</text>
  <text x="40" y="317" font-size="15" fill="#1b2a3a">Footprinting counts these, not coverage.</text>
  <rect x="40" y="345" width="420" height="62" rx="6" fill="#f4f6f8" stroke="#5b6b7a"/>
  <text x="55" y="370" font-family="Courier New, monospace" font-size="15" fill="#1b2a3a">+ strand read: start(read) + 4</text>
  <text x="55" y="394" font-family="Courier New, monospace" font-size="15" fill="#1b2a3a">− strand read: end(read)   − 5</text>

  <text x="560" y="30" font-size="18" font-weight="bold" fill="#1b2a3a">2. Orient every site by its motif, then add up</text>
  <line x1="580" y1="70" x2="880" y2="70" stroke="#5b6b7a" stroke-width="1.5"/>
  <rect x="710.0" y="61" width="40" height="18" fill="#8c564b" opacity="0.3"/>
  <line x1="714.0" y1="70" x2="746.0" y2="70" stroke="#8c564b" stroke-width="3" marker-end="url(#ar)"/>
  <text x="570" y="75" font-size="15" fill="#1b2a3a" text-anchor="end">site, + strand</text>
  <line x1="774.0" y1="60" x2="774.0" y2="68" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="838.0" y1="60" x2="838.0" y2="68" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="696.0" y1="60" x2="696.0" y2="68" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="659.0" y1="60" x2="659.0" y2="68" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="641.0" y1="60" x2="641.0" y2="68" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="701.0" y1="60" x2="701.0" y2="68" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="650.0" y1="60" x2="650.0" y2="68" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="763.0" y1="60" x2="763.0" y2="68" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="694.0" y1="60" x2="694.0" y2="68" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="580" y1="112" x2="880" y2="112" stroke="#5b6b7a" stroke-width="1.5"/>
  <rect x="710.0" y="103" width="40" height="18" fill="#8c564b" opacity="0.3"/>
  <line x1="746.0" y1="112" x2="714.0" y2="112" stroke="#8c564b" stroke-width="3" marker-end="url(#ar)"/>
  <text x="570" y="117" font-size="15" fill="#1b2a3a" text-anchor="end">site, − strand</text>
  <line x1="762.0" y1="102" x2="762.0" y2="110" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="677.0" y1="102" x2="677.0" y2="110" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="632.0" y1="102" x2="632.0" y2="110" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="761.0" y1="102" x2="761.0" y2="110" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="700.0" y1="102" x2="700.0" y2="110" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="668.0" y1="102" x2="668.0" y2="110" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="773.0" y1="102" x2="773.0" y2="110" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="632.0" y1="102" x2="632.0" y2="110" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="826.0" y1="102" x2="826.0" y2="110" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="580" y1="154" x2="880" y2="154" stroke="#5b6b7a" stroke-width="1.5"/>
  <rect x="710.0" y="145" width="40" height="18" fill="#8c564b" opacity="0.3"/>
  <line x1="714.0" y1="154" x2="746.0" y2="154" stroke="#8c564b" stroke-width="3" marker-end="url(#ar)"/>
  <text x="570" y="159" font-size="15" fill="#1b2a3a" text-anchor="end">site, + strand</text>
  <line x1="692.0" y1="144" x2="692.0" y2="152" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="658.0" y1="144" x2="658.0" y2="152" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="635.0" y1="144" x2="635.0" y2="152" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="633.0" y1="144" x2="633.0" y2="152" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="626.0" y1="144" x2="626.0" y2="152" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="642.0" y1="144" x2="642.0" y2="152" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="854.0" y1="144" x2="854.0" y2="152" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="814.0" y1="144" x2="814.0" y2="152" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="801.0" y1="144" x2="801.0" y2="152" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="580" y1="196" x2="880" y2="196" stroke="#5b6b7a" stroke-width="1.5"/>
  <rect x="710.0" y="187" width="40" height="18" fill="#8c564b" opacity="0.3"/>
  <line x1="746.0" y1="196" x2="714.0" y2="196" stroke="#8c564b" stroke-width="3" marker-end="url(#ar)"/>
  <text x="570" y="201" font-size="15" fill="#1b2a3a" text-anchor="end">site, − strand</text>
  <line x1="786.0" y1="186" x2="786.0" y2="194" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="616.0" y1="186" x2="616.0" y2="194" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="695.0" y1="186" x2="695.0" y2="194" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="822.0" y1="186" x2="822.0" y2="194" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="867.0" y1="186" x2="867.0" y2="194" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="848.0" y1="186" x2="848.0" y2="194" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="791.0" y1="186" x2="791.0" y2="194" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="690.0" y1="186" x2="690.0" y2="194" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="776.0" y1="186" x2="776.0" y2="194" stroke="#c0392b" stroke-width="2.5"/>
  <text x="895" y="91" font-size="15" fill="#5b6b7a">− strand sites are</text>
  <text x="895" y="113" font-size="15" fill="#5b6b7a">flipped left–right</text>
  <text x="895" y="135" font-size="15" fill="#5b6b7a">so the motif always</text>
  <text x="895" y="157" font-size="15" fill="#5b6b7a">reads 5' → 3'</text>
  <text x="730.0" y="232" font-size="15" fill="#5b6b7a" text-anchor="middle">… thousands of sites …</text>
  <line x1="730.0" y1="242" x2="730.0" y2="270" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ar)"/>
  <line x1="580" y1="400" x2="880" y2="400" stroke="#1b2a3a" stroke-width="2"/>
  <path d="M580,361.5 L583,361.5 L586,361.5 L589,361.5 L592,361.5 L595,361.5 L598,361.5 L601,361.5 L604,361.5 L607,361.5 L610,361.5 L613,361.5 L616,361.5 L619,361.5 L622,361.5 L625,361.5 L628,361.5 L631,361.5 L634,361.5 L637,361.5 L640,361.5 L643,361.5 L646,361.5 L649,361.5 L652,361.4 L655,361.2 L658,360.8 L661,360.1 L664,358.7 L667,356.2 L670,352.4 L673,346.7 L676,339.2 L679,330.2 L682,320.6 L685,311.5 L688,304.7 L691,301.2 L694,301.9 L697,306.6 L700,314.4 L703,323.8 L706,333.7 L709,344.0 L712,356.0 L715,368.8 L718,379.0 L721,385.1 L724,387.6 L727,388.3 L730,388.4 L733,388.3 L736,387.6 L739,385.1 L742,379.0 L745,368.8 L748,356.0 L751,344.0 L754,333.7 L757,323.8 L760,314.4 L763,306.6 L766,301.9 L769,301.2 L772,304.7 L775,311.5 L778,320.6 L781,330.2 L784,339.2 L787,346.7 L790,352.4 L793,356.2 L796,358.7 L799,360.1 L802,360.8 L805,361.2 L808,361.4 L811,361.5 L814,361.5 L817,361.5 L820,361.5 L823,361.5 L826,361.5 L829,361.5 L832,361.5 L835,361.5 L838,361.5 L841,361.5 L844,361.5 L847,361.5 L850,361.5 L853,361.5 L856,361.5 L859,361.5 L862,361.5 L865,361.5 L868,361.5 L871,361.5 L874,361.5 L877,361.5 L880,361.5" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <text x="895" y="340" font-size="15" fill="#1b2a3a">aggregate footprint:</text>
  <text x="895" y="362" font-size="15" fill="#1b2a3a">mean insertions per site</text>
  <text x="895" y="384" font-size="15" fill="#1b2a3a">at each offset</text>
  <text x="580" y="420" font-size="14" fill="#5b6b7a" text-anchor="middle">−100</text>
  <text x="730.0" y="420" font-size="14" fill="#5b6b7a" text-anchor="middle">0</text>
