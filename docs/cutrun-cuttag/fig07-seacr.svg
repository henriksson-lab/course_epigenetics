  <text x="485.0" y="208" font-size="13" fill="#5b6b7a" text-anchor="middle">AUC 7</text>
  <text x="20" y="240" font-size="14" fill="#5b6b7a">AUC = Σ coverage × bp of a block (arbitrary units here)</text>
  <text x="20" y="290" font-size="17" fill="#1b2a3a" font-weight="bold">C. Then</text>
  <text x="40" y="318" font-size="15" fill="#1b2a3a">1. keep target blocks with AUC above t</text>
  <text x="40" y="342" font-size="15" fill="#1b2a3a">2. merge blocks closer than 1/10 of the mean block width</text>
  <text x="40" y="366" font-size="15" fill="#1b2a3a">3. drop blocks that overlap an IgG block above t</text>
  <text x="40" y="400" font-size="14" fill="#5b6b7a">No control? keep the top 1% of blocks by AUC (threshold 0.01)</text>
  <text x="600" y="28" font-size="17" fill="#1b2a3a" font-weight="bold">B. Choose the AUC threshold t</text>
