  <rect x="300" y="184" width="10" height="6" rx="0" fill="#5b6b7a"/>
  <text x="305.0" y="208" font-size="13" fill="#5b6b7a" text-anchor="middle">AUC 1</text>
  <rect x="470" y="182" width="10" height="8" rx="0" fill="#5b6b7a"/>
  <rect x="480" y="176" width="10" height="14" rx="0" fill="#5b6b7a"/>
