<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 330" width="1120" height="330" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a8324a"/></marker><marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7a"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e67e22"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2a6f97"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b4fa0"/></marker><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2a9d8f"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8c564b"/></marker></defs>
<rect width="1120" height="330" fill="#ffffff"/>
<text x="30" y="30" font-size="17" text-anchor="start" font-weight="bold" fill="#1b2a3a">One nucleosome-depleted region, two directions</text>
<line x1="30" y1="200" x2="700" y2="200" stroke="#1b2a3a" stroke-width="2.5"/>
<rect x="300" y="130" width="130" height="90" rx="0" fill="#eaf1f7" stroke="none" stroke-width="1.5"/>
<text x="365" y="252" font-size="16" text-anchor="middle" font-weight="bold" fill="#1b2a3a">NDR</text>
<ellipse cx="140" cy="200" rx="34" ry="22" fill="#c9d8e6" stroke="#1b2a3a" stroke-width="1.5"/>
<ellipse cx="230" cy="200" rx="34" ry="22" fill="#c9d8e6" stroke="#1b2a3a" stroke-width="1.5"/>
<text x="230" y="205" font-size="14" text-anchor="middle" font-weight="normal" fill="#1b2a3a">−1</text>
<ellipse cx="500" cy="200" rx="34" ry="22" fill="#c9d8e6" stroke="#1b2a3a" stroke-width="1.5"/>
<text x="500" y="205" font-size="14" text-anchor="middle" font-weight="normal" fill="#1b2a3a">+1</text>
<ellipse cx="590" cy="200" rx="34" ry="22" fill="#c9d8e6" stroke="#1b2a3a" stroke-width="1.5"/>
<ellipse cx="680" cy="200" rx="34" ry="22" fill="#c9d8e6" stroke="#1b2a3a" stroke-width="1.5"/>
<path d="M330.0,200 C326.0,168 374.0,168 370.0,200 Z" fill="#2a9d8f" stroke="#1b2a3a" stroke-width="1.5"/>
<text x="350" y="187.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#ffffff">TF</text>
<path d="M375.0,200 C371.0,168 419.0,168 415.0,200 Z" fill="#6b4fa0" stroke="#1b2a3a" stroke-width="1.5"/>
<text x="395" y="187.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#ffffff">TF</text>
<path d="M420,166 V120 H690" fill="none" stroke="#2e8b57" stroke-width="3" marker-end="url(#ag)"/>
<text x="440" y="108" font-size="15" text-anchor="start" font-weight="bold" fill="#2e8b57">sense: mRNA, long, spliced, stable</text>
<path d="M325,166 V120 H215" fill="none" stroke="#5b6b7a" stroke-width="3" marker-end="url(#as)"/>
<text x="30" y="75" font-size="15" text-anchor="start" font-weight="bold" fill="#5b6b7a">antisense: PROMPT / uaRNA</text>
<text x="30" y="94" font-size="15" text-anchor="start" font-weight="normal" fill="#5b6b7a">short (&lt;2 kb), degraded by the exosome</text>
<text x="30" y="300" font-size="15" text-anchor="start" font-weight="normal" fill="#5b6b7a">Each core promoter has its own pre-initiation complex; a promoter NDR usually holds two, back to back.</text>
<line x1="745" y1="30" x2="745" y2="280" stroke="#d0d7de" stroke-width="1.5"/>
<text x="770" y="30" font-size="17" text-anchor="start" font-weight="bold" fill="#1b2a3a">Head-to-head gene pair</text>
<line x1="770" y1="200" x2="1100" y2="200" stroke="#1b2a3a" stroke-width="2.5"/>
<rect x="950" y="188" width="40" height="24" rx="0" fill="#5b6b7a" stroke="#1b2a3a" stroke-width="1.5"/>
<rect x="1030" y="188" width="30" height="24" rx="0" fill="#5b6b7a" stroke="#1b2a3a" stroke-width="1.5"/>
<rect x="880" y="188" width="40" height="24" rx="0" fill="#5b6b7a" stroke="#1b2a3a" stroke-width="1.5"/>
<rect x="800" y="188" width="30" height="24" rx="0" fill="#5b6b7a" stroke="#1b2a3a" stroke-width="1.5"/>
<path d="M950,188 V148 H990" fill="none" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ak)"/>
<path d="M920,188 V148 H880" fill="none" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ak)"/>
<text x="1010" y="240" font-size="15" text-anchor="middle" font-weight="normal" fill="#1b2a3a">gene B (+)</text>
<text x="860" y="240" font-size="15" text-anchor="middle" font-weight="normal" fill="#1b2a3a">gene A (−)</text>
<path d="M920,252 v8 H950 v-8" fill="none" stroke="#1b2a3a" stroke-width="1.5"/>
<text x="935" y="282" font-size="15" text-anchor="middle" font-weight="normal" fill="#5b6b7a">&lt; 1 kb apart, shared NDR</text>
</svg>
