<text x="30" y="264" font-size="15" fill="#1b2a3a">Every read starts at a cut site (CGG…): no deduplication possible. The end-repaired 3&#39; end adds an artificial C: trim 2 bp (Trim Galore --rrbs).</text>
<text x="30" y="288" font-size="15" fill="#1b2a3a">About 1–3 million CpGs (5–10% of all) are covered, but deeply, and most CpG-island promoters are among them.</text>
