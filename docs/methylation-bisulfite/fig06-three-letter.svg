<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 340" width="1120" height="340" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7a"/></marker></defs>
<rect width="1120" height="340" fill="white"/>
<rect x="20" y="120" width="210" height="92" rx="10" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="1.5"/>
<text x="125.0" y="144" font-size="16" text-anchor="middle" font-weight="bold" fill="#1b2a3a">read</text>
<text x="125.0" y="170" font-size="17" text-anchor="middle" fill="#1b2a3a" font-family="Courier New, monospace" font-weight="bold">TTGCGATTTAG</text>
<text x="125.0" y="192" font-size="15" text-anchor="middle" fill="#1b2a3a">C at a methylated CpG</text>
<rect x="270" y="120" width="210" height="92" rx="10" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="1.5"/>
<text x="375.0" y="144" font-size="16" text-anchor="middle" font-weight="bold" fill="#1b2a3a">read, all C to T</text>
<text x="375.0" y="170" font-size="17" text-anchor="middle" fill="#1b2a3a" font-family="Courier New, monospace" font-weight="bold">TTGTGATTTAG</text>
<text x="375.0" y="192" font-size="15" text-anchor="middle" fill="#1b2a3a">(in silico)</text>
<line x1="232" y1="166" x2="266" y2="166" stroke="#1b2a3a" stroke-width="2" marker-end="url(#ah)"/>
<rect x="540" y="30" width="250" height="92" rx="10" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="1.5"/>
<text x="665.0" y="54" font-size="16" text-anchor="middle" font-weight="bold" fill="#1b2a3a">genome, C to T</text>
<text x="665.0" y="80" font-size="17" text-anchor="middle" fill="#1b2a3a" font-family="Courier New, monospace" font-weight="bold">TTGTGATTTAG</text>
<text x="665.0" y="102" font-size="15" text-anchor="middle" fill="#1b2a3a">bowtie2 index 1</text>
<rect x="540" y="210" width="250" height="92" rx="10" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="1.5"/>
<text x="665.0" y="234" font-size="16" text-anchor="middle" font-weight="bold" fill="#1b2a3a">genome, G to A</text>
<text x="665.0" y="260" font-size="17" text-anchor="middle" fill="#1b2a3a" font-family="Courier New, monospace" font-weight="bold">CTACAATCCAA</text>
<text x="665.0" y="282" font-size="15" text-anchor="middle" fill="#1b2a3a">bowtie2 index 2</text>
<line x1="482" y1="150" x2="536" y2="90" stroke="#1b2a3a" stroke-width="2" marker-end="url(#ah)"/>
<line x1="482" y1="182" x2="536" y2="240" stroke="#1b2a3a" stroke-width="2" marker-end="url(#ah)"/>
<text x="808" y="80" font-size="15" fill="#2e8b57" font-weight="bold">match: read is from the top strand (OT)</text>
<text x="800" y="296" font-size="15" fill="#a8324a" font-weight="bold">no match</text>
<rect x="840" y="120" width="250" height="92" rx="10" fill="#f4f6f8" stroke="#1b2a3a" stroke-width="1.5"/>
<text x="965.0" y="144" font-size="16" text-anchor="middle" font-weight="bold" fill="#1b2a3a">keep a unique best hit</text>
<text x="965.0" y="170" font-size="15" text-anchor="middle" fill="#1b2a3a">then compare the original</text>
<text x="965.0" y="192" font-size="15" text-anchor="middle" fill="#1b2a3a">read with the real genome</text>
<line x1="792" y1="90" x2="900" y2="118" stroke="#1b2a3a" stroke-width="2" marker-end="url(#ah)"/>
<text x="20" y="250" font-size="15" fill="#5b6b7a">converted reads have only A, G, T:</text>
<text x="20" y="272" font-size="15" fill="#5b6b7a">a 3-letter alphabet, so fewer</text>
<text x="20" y="294" font-size="15" fill="#5b6b7a">unique alignments than normal DNA</text>
<text x="840" y="238" font-size="15" fill="#5b6b7a">directional: 2 alignments per read;</text>
<text x="840" y="258" font-size="15" fill="#5b6b7a">non-directional: 4 (also CTOT, CTOB)</text>
</svg>