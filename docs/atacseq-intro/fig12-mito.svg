<text x="250.0" y="26.0" font-size="17" text-anchor="middle" font-weight="bold" fill="#1b2a3a">one cell</text>
<text x="300.0" y="100.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#9c6644">mitochondria</text>
<text x="540.0" y="70.0" font-size="17" text-anchor="start" font-weight="bold" fill="#1b2a3a">nuclear genome</text>
<text x="540.0" y="96.0" font-size="15" text-anchor="start" fill="#1b2a3a">6.4 Gb (diploid), wrapped in nucleosomes</text>
<text x="540.0" y="118.0" font-size="15" text-anchor="start" fill="#1b2a3a">≈ 2 % open → ≈ 130 Mb that Tn5 can reach</text>
<text x="540.0" y="168.0" font-size="17" text-anchor="start" font-weight="bold" fill="#c0392b">mitochondrial genome (chrM)</text>
<text x="540.0" y="194.0" font-size="15" text-anchor="start" fill="#1b2a3a">16.6 kb circle, no nucleosomes: all of it open</text>
<text x="540.0" y="216.0" font-size="15" text-anchor="start" fill="#1b2a3a">100 to 10 000 copies per cell</text>
<text x="540.0" y="238.0" font-size="15" text-anchor="start" fill="#1b2a3a">1000 copies × 16.6 kb ≈ 17 Mb of naked DNA</text>
<text x="540.0" y="290.0" font-size="16" text-anchor="start" font-weight="bold" fill="#1b2a3a">→ a large share of all Tn5 insertions can land in chrM</text>
<text x="540.0" y="314.0" font-size="15" text-anchor="start" fill="#5b6b7a">reads that tell you nothing about the nuclear regulatory DNA</text>
