<line x1="20.0" y1="222.0" x2="1100.0" y2="250.0" stroke="#eaf1f7" stroke-width="2"/>
<text x="20.0" y="257.0" font-size="16" fill="#1b2a3a" text-anchor="start">Every single-base change leaves one intact copy, so ISM gives Δ = 0 at all 9 positions: "nothing matters".</text>
<text x="20.0" y="284.0" font-size="16" fill="#1b2a3a" text-anchor="start">The motif is redundant, not unimportant. Max pooling (and biology: a backup site) makes the effect saturate.</text>
<text x="20.0" y="311.0" font-size="16" fill="#5b6b7a" text-anchor="start">Remedies: mutate pairs or whole motifs, or compare with a reference sequence in which all motifs are gone (DeepLIFT, SHAP).</text>
</svg>
