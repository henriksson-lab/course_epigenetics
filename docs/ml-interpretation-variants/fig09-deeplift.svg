<text x="640.0" y="104.0" font-size="15" fill="#1b2a3a" text-anchor="start">• Gradient: which direction is uphill, right here?</text>
<text x="640.0" y="128.0" font-size="15" fill="#1b2a3a" text-anchor="start">• DeepLIFT / SHAP: how much did each base contribute</text>
<text x="640.0" y="150.0" font-size="15" fill="#1b2a3a" text-anchor="start">  to the difference from a neutral reference?</text>
<text x="640.0" y="190.0" font-size="15" fill="#5b6b7a" text-anchor="start">Because contributions are measured against a</text>
<text x="640.0" y="212.0" font-size="15" fill="#5b6b7a" text-anchor="start">reference without the motifs, two redundant copies</text>
<text x="640.0" y="234.0" font-size="15" fill="#5b6b7a" text-anchor="start">share the credit instead of both getting zero.</text>
<text x="640.0" y="274.0" font-size="15" fill="#5b6b7a" text-anchor="start">DeepSHAP averages DeepLIFT over many references;</text>
<text x="640.0" y="296.0" font-size="15" fill="#5b6b7a" text-anchor="start">BPNet and chromBPNet use it, and their contribution</text>
<text x="640.0" y="318.0" font-size="15" fill="#5b6b7a" text-anchor="start">scores feed TF-MoDISco (next slide).</text>
