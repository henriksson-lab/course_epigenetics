  <text x="28" y="280" font-size="14" fill="#5b6b7a">best path ending here</text>
  <text x="28" y="312" font-size="13" fill="#5b6b7a">δ(s) = max over r [δ(r) × P(r→s)]</text>
  <text x="60" y="330" font-size="13" fill="#5b6b7a">× P(observation | s)</text>
  <text x="334" y="70" font-size="14" fill="#5b6b7a" text-anchor="end">observed</text>
