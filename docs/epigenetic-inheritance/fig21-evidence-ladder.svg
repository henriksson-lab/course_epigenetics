<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 400" width="1120" height="400" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a8324a"/></marker><marker id="ahgr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7a"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2a6f97"/></marker></defs>
<rect width="1120" height="400" fill="#ffffff"/>
<text x="24" y="30" font-size="18" fill="#1b2a3a" text-anchor="start" font-weight="bold">How strong is the evidence for inheritance through the germline?</text>
<rect x="24" y="60" width="1072" height="58" rx="8" fill="#ffffff" stroke="#d5dde5" stroke-width="1"/>
<text x="40" y="94" font-size="16" fill="#1b2a3a" text-anchor="start" font-weight="bold">plants</text>
<text x="240" y="84" font-size="15" fill="#1b2a3a" text-anchor="start">natural epialleles (Linaria), epiRILs, paramutation;</text>
<text x="240" y="104" font-size="15" fill="#5b6b7a" text-anchor="start">stable over many generations; mechanism known</text>
<rect x="720" y="78" width="32" height="22" rx="4" fill="#2e8b57" stroke="none" stroke-width="0"/>
<rect x="760" y="78" width="32" height="22" rx="4" fill="#2e8b57" stroke="none" stroke-width="0"/>
<rect x="800" y="78" width="32" height="22" rx="4" fill="#2e8b57" stroke="none" stroke-width="0"/>
<rect x="840" y="78" width="32" height="22" rx="4" fill="#2e8b57" stroke="none" stroke-width="0"/>
<text x="890" y="94" font-size="15" fill="#1b2a3a" text-anchor="start">strong</text>
<rect x="24" y="126" width="1072" height="58" rx="8" fill="#f4f6f8" stroke="#d5dde5" stroke-width="1"/>
<text x="40" y="160" font-size="16" fill="#1b2a3a" text-anchor="start" font-weight="bold">C. elegans</text>
<text x="240" y="150" font-size="15" fill="#1b2a3a" text-anchor="start">small RNAs + H3K9me via HRDE-1; often 3–5</text>
<text x="240" y="170" font-size="15" fill="#5b6b7a" text-anchor="start">generations, some 20+; mechanism known</text>
<rect x="720" y="144" width="32" height="22" rx="4" fill="#2e8b57" stroke="none" stroke-width="0"/>
<rect x="760" y="144" width="32" height="22" rx="4" fill="#2e8b57" stroke="none" stroke-width="0"/>
<rect x="800" y="144" width="32" height="22" rx="4" fill="#2e8b57" stroke="none" stroke-width="0"/>
<rect x="840" y="144" width="32" height="22" rx="4" fill="#2e8b57" stroke="none" stroke-width="0"/>
<text x="890" y="160" font-size="15" fill="#1b2a3a" text-anchor="start">strong</text>
<rect x="24" y="192" width="1072" height="58" rx="8" fill="#ffffff" stroke="#d5dde5" stroke-width="1"/>
<text x="40" y="226" font-size="16" fill="#1b2a3a" text-anchor="start" font-weight="bold">mouse: specific loci</text>
<text x="240" y="216" font-size="15" fill="#1b2a3a" text-anchor="start">IAP metastable epialleles (Avy, AxinFu);</text>
<text x="240" y="236" font-size="15" fill="#5b6b7a" text-anchor="start">most variably methylated IAPs are reset</text>
<rect x="720" y="210" width="32" height="22" rx="4" fill="#8ab17d" stroke="none" stroke-width="0"/>
<rect x="760" y="210" width="32" height="22" rx="4" fill="#8ab17d" stroke="none" stroke-width="0"/>
<rect x="800" y="210" width="32" height="22" rx="4" fill="#8ab17d" stroke="none" stroke-width="0"/>
<rect x="840" y="210" width="32" height="22" rx="4" fill="#eef1f4" stroke="none" stroke-width="0"/>
<text x="890" y="226" font-size="15" fill="#1b2a3a" text-anchor="start">solid, but rare</text>
<rect x="24" y="258" width="1072" height="58" rx="8" fill="#f4f6f8" stroke="#d5dde5" stroke-width="1"/>
<text x="40" y="292" font-size="16" fill="#1b2a3a" text-anchor="start" font-weight="bold">mouse: diet, stress</text>
<text x="240" y="282" font-size="15" fill="#1b2a3a" text-anchor="start">sperm RNA injection reproduces F1 effects;</text>
<text x="240" y="302" font-size="15" fill="#5b6b7a" text-anchor="start">transgenerational claims contested</text>
<rect x="720" y="276" width="32" height="22" rx="4" fill="#e9c46a" stroke="none" stroke-width="0"/>
<rect x="760" y="276" width="32" height="22" rx="4" fill="#e9c46a" stroke="none" stroke-width="0"/>
<rect x="800" y="276" width="32" height="22" rx="4" fill="#eef1f4" stroke="none" stroke-width="0"/>
<rect x="840" y="276" width="32" height="22" rx="4" fill="#eef1f4" stroke="none" stroke-width="0"/>
<text x="890" y="292" font-size="15" fill="#1b2a3a" text-anchor="start">F1 effects; debated</text>
<rect x="24" y="324" width="1072" height="58" rx="8" fill="#ffffff" stroke="#d5dde5" stroke-width="1"/>
<text x="40" y="358" font-size="16" fill="#1b2a3a" text-anchor="start" font-weight="bold">human</text>
<text x="240" y="348" font-size="15" fill="#1b2a3a" text-anchor="start">in-utero exposure associations (F1, F2);</text>
<text x="240" y="368" font-size="15" fill="#5b6b7a" text-anchor="start">no shown germline mechanism; confounded</text>
<rect x="720" y="342" width="32" height="22" rx="4" fill="#c0392b" stroke="none" stroke-width="0"/>
<rect x="760" y="342" width="32" height="22" rx="4" fill="#eef1f4" stroke="none" stroke-width="0"/>
<rect x="800" y="342" width="32" height="22" rx="4" fill="#eef1f4" stroke="none" stroke-width="0"/>
<rect x="840" y="342" width="32" height="22" rx="4" fill="#eef1f4" stroke="none" stroke-width="0"/>
<text x="890" y="358" font-size="15" fill="#1b2a3a" text-anchor="start">weak for germline</text>
</svg>
