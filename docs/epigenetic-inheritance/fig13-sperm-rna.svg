<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 270" width="1120" height="270" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a8324a"/></marker><marker id="ahgr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7a"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2a6f97"/></marker></defs>
<rect width="1120" height="270" fill="#ffffff"/>
<text x="24" y="30" font-size="18" fill="#1b2a3a" text-anchor="start" font-weight="bold">Testing whether sperm RNA carries the signal (Gapp 2014; Chen 2016; Sharma 2016)</text>
<rect x="24" y="70" width="180" height="70" rx="10" fill="#fbeaea" stroke="#1b2a3a" stroke-width="1.6"/>
<text x="114.0" y="100" font-size="15" fill="#1b2a3a" text-anchor="middle" font-weight="bold">male mice</text>
<text x="114.0" y="120" font-size="14" fill="#5b6b7a" text-anchor="middle">diet or stress</text>
<rect x="244" y="70" width="180" height="70" rx="10" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="1.6"/>
<text x="334.0" y="100" font-size="15" fill="#1b2a3a" text-anchor="middle" font-weight="bold">sperm</text>
<text x="334.0" y="120" font-size="14" fill="#5b6b7a" text-anchor="middle">isolate RNA</text>
<rect x="464" y="70" width="200" height="70" rx="10" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="1.6"/>
<text x="564.0" y="100" font-size="15" fill="#1b2a3a" text-anchor="middle" font-weight="bold">inject into normal</text>
<text x="564.0" y="120" font-size="14" fill="#5b6b7a" text-anchor="middle">fertilised eggs</text>
<rect x="704" y="70" width="180" height="70" rx="10" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="1.6"/>
<text x="794.0" y="100" font-size="15" fill="#1b2a3a" text-anchor="middle" font-weight="bold">transfer to an</text>
<text x="794.0" y="120" font-size="14" fill="#5b6b7a" text-anchor="middle">unexposed mother</text>
<rect x="924" y="70" width="170" height="70" rx="10" fill="#eaf5ee" stroke="#1b2a3a" stroke-width="1.6"/>
<text x="1009.0" y="100" font-size="15" fill="#1b2a3a" text-anchor="middle" font-weight="bold">offspring</text>
<text x="1009.0" y="120" font-size="14" fill="#5b6b7a" text-anchor="middle">phenotype?</text>
<line x1="206" y1="105" x2="242" y2="105" stroke="#1b2a3a" stroke-width="2" marker-end="url(#ah)"/>
<line x1="426" y1="105" x2="462" y2="105" stroke="#1b2a3a" stroke-width="2" marker-end="url(#ah)"/>
<line x1="666" y1="105" x2="702" y2="105" stroke="#1b2a3a" stroke-width="2" marker-end="url(#ah)"/>
<line x1="886" y1="105" x2="922" y2="105" stroke="#1b2a3a" stroke-width="2" marker-end="url(#ah)"/>
<text x="24" y="190" font-size="16" fill="#1b2a3a" text-anchor="start" font-weight="bold">What this design achieves</text>
<text x="24" y="214" font-size="15" fill="#1b2a3a" text-anchor="start">– no shared environment, no mating behaviour, no seminal fluid</text>
<text x="24" y="235" font-size="15" fill="#1b2a3a" text-anchor="start">– points to RNA as a carrier (not DNA methylation alone)</text>
<text x="580" y="190" font-size="16" fill="#1b2a3a" text-anchor="start" font-weight="bold">What it does not settle</text>
<text x="580" y="214" font-size="15" fill="#1b2a3a" text-anchor="start">– F1 only: intergenerational, not transgenerational</text>
<text x="580" y="235" font-size="15" fill="#1b2a3a" text-anchor="start">– injected amounts differ from what one sperm brings</text>
<text x="580" y="256" font-size="15" fill="#1b2a3a" text-anchor="start">– small effects, few independent replications</text>
</svg>
