<text x="640" y="258" font-size="15" fill="#1b2a3a">The score is the <tspan font-weight="bold">log-odds</tspan>: linear in the features,</text>
<text x="640" y="280" font-size="15" fill="#1b2a3a">like the linear models you know.</text>
<text x="640" y="314" font-size="15" fill="#1b2a3a">A coefficient b = 1.4 per CTCF motif:</text>
<text x="640" y="336" font-size="15" fill="#1b2a3a">one more motif adds 1.4 to the log-odds,</text>
<text x="640" y="358" font-size="15" fill="#1b2a3a">i.e. multiplies the odds by e<tspan dy="-7" font-size="11">1.4</tspan><tspan dy="7"> ≈ 4.</tspan></text>
