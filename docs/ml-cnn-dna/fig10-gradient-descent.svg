<text x="620.0" y="265.0" font-size="15" fill="#1b2a3a" text-anchor="start">A real network has thousands of weights: the slope becomes</text>
<text x="620.0" y="287.0" font-size="15" fill="#1b2a3a" text-anchor="start">a gradient (one slope per weight), computed for all of them</text>
<text x="620.0" y="309.0" font-size="15" fill="#1b2a3a" text-anchor="start">in one backward pass (backpropagation, the chain rule).</text>
<text x="620.0" y="345.0" font-size="15" fill="#5b6b7a" text-anchor="start">The loss surface is no longer a bowl: training finds a good</text>
<text x="620.0" y="367.0" font-size="15" fill="#5b6b7a" text-anchor="start">minimum, not necessarily the best one. Different seeds give</text>
<text x="620.0" y="389.0" font-size="15" fill="#5b6b7a" text-anchor="start">slightly different networks.</text>
</svg>
