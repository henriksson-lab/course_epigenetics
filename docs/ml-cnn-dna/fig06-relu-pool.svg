<text x="880.0" y="140.0" font-size="15" fill="#1b2a3a" text-anchor="start">motif sits in the sequence.</text>
<text x="880.0" y="180.0" font-size="15" fill="#5b6b7a" text-anchor="start">Pool width 3 instead keeps</text>
<text x="880.0" y="200.0" font-size="15" fill="#5b6b7a" text-anchor="start">rough position (7 values → 2).</text>
<line x1="30.0" y1="272.0" x2="1090.0" y2="272.0" stroke="#eaf1f7" stroke-width="2"/>
<text x="30.0" y="302.0" font-size="16" fill="#1b2a3a" text-anchor="start">With bias −4 instead of −5, the one-mismatch CCTG would give 1, not 0: the bias sets how strict the motif match must be.</text>
