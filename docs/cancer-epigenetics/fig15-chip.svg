<text x="44" y="350" font-size="15" fill="#1b2a3a" text-anchor="start">stem cell with a DNMT3A, TET2 (or ASXL1) mutation</text>
<rect x="720" y="70" width="385" height="240" rx="10" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="1.5"/>
<text x="736" y="98" font-size="15" fill="#1b2a3a" text-anchor="start">About 10% of people aged 70–79</text>
<text x="736" y="119" font-size="15" fill="#1b2a3a" text-anchor="start">carry such a clone (Jaiswal et al. 2014).</text>
<text x="736" y="146" font-size="15" fill="#1b2a3a" text-anchor="start">Most variants: DNMT3A, TET2, ASXL1.</text>
<text x="736" y="173" font-size="15" fill="#1b2a3a" text-anchor="start">Risk of blood cancer rises about 11-fold,</text>
<text x="736" y="194" font-size="15" fill="#1b2a3a" text-anchor="start">but most carriers never get leukaemia:</text>
<text x="736" y="215" font-size="15" fill="#1b2a3a" text-anchor="start">further mutations are needed for AML.</text>
<text x="736" y="242" font-size="15" fill="#1b2a3a" text-anchor="start">Also linked to heart disease and stroke.</text>
<text x="736" y="269" font-size="15" fill="#1b2a3a" text-anchor="start">In AML, DNMT3A is mutated in 22%</text>
<text x="736" y="290" font-size="15" fill="#1b2a3a" text-anchor="start">of patients (Ley et al. 2010).</text>
