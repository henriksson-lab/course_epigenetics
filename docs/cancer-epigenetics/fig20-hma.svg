<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 420" width="1120" height="420" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker><marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a8324a"/></marker><marker id="ahgr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7a"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2a6f97"/></marker></defs>
<rect width="1120" height="420" fill="#ffffff"/>
<text x="24" y="30" font-size="18" fill="#1b2a3a" text-anchor="start" font-weight="bold">Hypomethylating drugs work through replication</text>
<text x="24" y="70" font-size="16" fill="#1b2a3a" text-anchor="start" font-weight="bold">1  the drug is built into new DNA</text>
<text x="40" y="100" font-size="14" fill="#5b6b7a" text-anchor="start">old strand</text>
<line x1="130" y1="96" x2="404" y2="96" stroke="#1b2a3a" stroke-width="2.4"/>
<circle cx="150" cy="96" r="6.5" fill="#1b2a3a" stroke="#1b2a3a" stroke-width="1.8"/>
<circle cx="194" cy="96" r="6.5" fill="#1b2a3a" stroke="#1b2a3a" stroke-width="1.8"/>
<circle cx="238" cy="96" r="6.5" fill="#1b2a3a" stroke="#1b2a3a" stroke-width="1.8"/>
<circle cx="282" cy="96" r="6.5" fill="#1b2a3a" stroke="#1b2a3a" stroke-width="1.8"/>
<circle cx="326" cy="96" r="6.5" fill="#1b2a3a" stroke="#1b2a3a" stroke-width="1.8"/>
<circle cx="370" cy="96" r="6.5" fill="#1b2a3a" stroke="#1b2a3a" stroke-width="1.8"/>
<text x="40" y="130" font-size="14" fill="#5b6b7a" text-anchor="start">new strand</text>
<line x1="130" y1="126" x2="404" y2="126" stroke="#5b6b7a" stroke-width="2.4"/>
<circle cx="150" cy="126" r="6.5" fill="#ffffff" stroke="#1b2a3a" stroke-width="1.8"/>
<rect x="187" y="119" width="14" height="14" fill="#c0392b"/>
<circle cx="238" cy="126" r="6.5" fill="#ffffff" stroke="#1b2a3a" stroke-width="1.8"/>
<circle cx="282" cy="126" r="6.5" fill="#ffffff" stroke="#1b2a3a" stroke-width="1.8"/>
<rect x="319" y="119" width="14" height="14" fill="#c0392b"/>
<circle cx="370" cy="126" r="6.5" fill="#ffffff" stroke="#1b2a3a" stroke-width="1.8"/>
<rect x="40" y="150" width="14" height="14" fill="#c0392b"/>
<text x="62" y="162" font-size="14" fill="#1b2a3a" text-anchor="start">aza-C (in place of C)</text>
<text x="420" y="70" font-size="16" fill="#1b2a3a" text-anchor="start" font-weight="bold">2  DNMT1 is trapped</text>
<line x1="430" y1="126" x2="700" y2="126" stroke="#5b6b7a" stroke-width="2.4"/>
<line x1="430" y1="96" x2="700" y2="96" stroke="#1b2a3a" stroke-width="2.4"/>
<circle cx="456" cy="96" r="6.5" fill="#1b2a3a" stroke="#1b2a3a" stroke-width="1.8"/>
<circle cx="544" cy="96" r="6.5" fill="#1b2a3a" stroke="#1b2a3a" stroke-width="1.8"/>
<circle cx="632" cy="96" r="6.5" fill="#1b2a3a" stroke="#1b2a3a" stroke-width="1.8"/>
<circle cx="456" cy="126" r="6.5" fill="#ffffff" stroke="#1b2a3a" stroke-width="1.8"/>
<circle cx="632" cy="126" r="6.5" fill="#ffffff" stroke="#1b2a3a" stroke-width="1.8"/>
<rect x="537" y="119" width="14" height="14" fill="#c0392b"/>
<ellipse cx="544" cy="152" rx="48" ry="18" fill="#dbe7f1" stroke="#1b2a3a" stroke-width="1.8"/>
<text x="544" y="157" font-size="14" fill="#1b2a3a" text-anchor="middle" font-weight="bold">DNMT1</text>
<text x="600" y="186" font-size="14" fill="#a8324a" text-anchor="middle">covalently stuck,</text>
<text x="600" y="204" font-size="14" fill="#a8324a" text-anchor="middle">then degraded</text>
<text x="760" y="70" font-size="16" fill="#1b2a3a" text-anchor="start" font-weight="bold">3  methylation is diluted</text>
<rect x="780" y="100" width="44" height="80" rx="2" fill="#1b2a3a" stroke="none" stroke-width="0"/>
<rect x="780" y="60" width="44" height="0.1" rx="0" fill="#ffffff" stroke="none" stroke-width="0"/>
<text x="802" y="204" font-size="14" fill="#1b2a3a" text-anchor="middle">0</text>
<rect x="860" y="140.0" width="44" height="40.0" rx="2" fill="#1b2a3a" stroke="none" stroke-width="0"/>
<rect x="860" y="60" width="44" height="0.1" rx="0" fill="#ffffff" stroke="none" stroke-width="0"/>
<text x="882" y="204" font-size="14" fill="#1b2a3a" text-anchor="middle">1</text>
<rect x="940" y="160.0" width="44" height="20.0" rx="2" fill="#1b2a3a" stroke="none" stroke-width="0"/>
<rect x="940" y="60" width="44" height="0.1" rx="0" fill="#ffffff" stroke="none" stroke-width="0"/>
<text x="962" y="204" font-size="14" fill="#1b2a3a" text-anchor="middle">2</text>
<rect x="1020" y="170.0" width="44" height="10.0" rx="2" fill="#1b2a3a" stroke="none" stroke-width="0"/>
<rect x="1020" y="60" width="44" height="0.1" rx="0" fill="#ffffff" stroke="none" stroke-width="0"/>
<text x="1042" y="204" font-size="14" fill="#1b2a3a" text-anchor="middle">3</text>
<line x1="770" y1="180" x2="1100" y2="180" stroke="#1b2a3a" stroke-width="1.5"/>
<text x="780" y="94" font-size="14" fill="#5b6b7a" text-anchor="start">methylation level</text>
<text x="935" y="224" font-size="14" fill="#1b2a3a" text-anchor="middle">cell divisions without DNMT1</text>
<text x="935" y="242" font-size="14" fill="#5b6b7a" text-anchor="middle">(about halves each round)</text>
<line x1="24" y1="262" x2="1096" y2="262" stroke="#d5dde5" stroke-width="1.5"/>
<text x="24" y="292" font-size="16" fill="#1b2a3a" text-anchor="start" font-weight="bold">Consequences</text>
<rect x="24" y="306" width="330" height="96" rx="10" fill="#eaf5ee" stroke="none" stroke-width="0"/>
<text x="40" y="330" font-size="15" fill="#1b2a3a" text-anchor="start">silenced genes can come</text>
<text x="40" y="350" font-size="15" fill="#1b2a3a" text-anchor="start">back on (if nothing else</text>
<text x="40" y="370" font-size="15" fill="#1b2a3a" text-anchor="start">keeps them off)</text>
<rect x="380" y="306" width="400" height="96" rx="10" fill="#fbeaea" stroke="none" stroke-width="0"/>
<text x="396" y="330" font-size="15" fill="#1b2a3a" text-anchor="start">endogenous retroviruses are transcribed</text>
<text x="396" y="350" font-size="15" fill="#1b2a3a" text-anchor="start">→ double-stranded RNA → interferon response:</text>
<text x="396" y="370" font-size="15" fill="#1b2a3a" text-anchor="start">"viral mimicry" (Chiappinelli 2015; Roulois 2015)</text>
<rect x="806" y="306" width="290" height="96" rx="10" fill="#f4f6f8" stroke="none" stroke-width="0"/>
<text x="822" y="330" font-size="15" fill="#1b2a3a" text-anchor="start">needs dividing cells and</text>
<text x="822" y="350" font-size="15" fill="#1b2a3a" text-anchor="start">repeated cycles; responses</text>
<text x="822" y="370" font-size="15" fill="#1b2a3a" text-anchor="start">take months (MDS, AML)</text>
</svg>
