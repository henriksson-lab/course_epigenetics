<text x="24" y="320" font-size="15" fill="#1b2a3a" text-anchor="start">Examples: MLH1 (sporadic MSI colorectal cancer), CDKN2A (many cancers),</text>
<text x="24" y="342" font-size="15" fill="#1b2a3a" text-anchor="start">BRCA1 (some breast and ovarian cancers). In sporadic MSI colon cancer, MLH1 is usually methylated on both copies.</text>
<text x="24" y="364" font-size="15" fill="#5b6b7a" text-anchor="start">The hit can also be a deletion (loss of heterozygosity) together with promoter methylation of the other copy.</text>
