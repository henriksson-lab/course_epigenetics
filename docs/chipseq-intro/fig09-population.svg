<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 400" width="1120" height="400" font-family="Helvetica, Arial, sans-serif">
  <rect width="1120" height="400" fill="#ffffff"/>
  <text x="20" y="28" font-size="18" font-weight="bold" fill="#1b2a3a">Millions of cells, one track</text>
  <!-- cells: 8 rows; site A at x=200 bound in 7, site B at x=420 bound in 2; site C bound in 4 but only in cell type 2 (rows 5-8) -->
  <g font-size="13" fill="#5b6b7a">
    <text x="20" y="62">cell 1</text><text x="20" y="88">cell 2</text><text x="20" y="114">cell 3</text><text x="20" y="140">cell 4</text>
    <text x="20" y="166">cell 5</text><text x="20" y="192">cell 6</text><text x="20" y="218">cell 7</text><text x="20" y="244">cell 8</text>
  </g>
  <g stroke="#1b2a3a" stroke-width="2.5">
    <line x1="70" y1="58" x2="560" y2="58"/><line x1="70" y1="84" x2="560" y2="84"/><line x1="70" y1="110" x2="560" y2="110"/><line x1="70" y1="136" x2="560" y2="136"/>
    <line x1="70" y1="162" x2="560" y2="162"/><line x1="70" y1="188" x2="560" y2="188"/><line x1="70" y1="214" x2="560" y2="214"/><line x1="70" y1="240" x2="560" y2="240"/>
  </g>
  <rect x="64" y="150" width="502" height="102" fill="#e67e22" fill-opacity="0.08"/>
  <text x="566" y="206" font-size="13" fill="#e67e22" transform="rotate(90 566 206)" text-anchor="middle">other cell type</text>
  <g fill="#8c564b" stroke="#1b2a3a" stroke-width="1">
    <!-- site A: rows 1,2,3,4,6,7,8 -->
    <rect x="190" y="46" width="20" height="12" rx="3"/><rect x="190" y="72" width="20" height="12" rx="3"/><rect x="190" y="98" width="20" height="12" rx="3"/><rect x="190" y="124" width="20" height="12" rx="3"/>
    <rect x="190" y="176" width="20" height="12" rx="3"/><rect x="190" y="202" width="20" height="12" rx="3"/><rect x="190" y="228" width="20" height="12" rx="3"/>
    <!-- site B: rows 2,7 -->
    <rect x="320" y="72" width="20" height="12" rx="3"/><rect x="320" y="202" width="20" height="12" rx="3"/>
    <!-- site C: rows 5-8 only -->
    <rect x="450" y="150" width="20" height="12" rx="3"/><rect x="450" y="176" width="20" height="12" rx="3"/><rect x="450" y="202" width="20" height="12" rx="3"/><rect x="450" y="228" width="20" height="12" rx="3"/>
  </g>
  
  <!-- track -->
  <path d="M70,345 L160,345 C180,345 186,272 200,272 C214,272 220,345 240,345 L300,345 C318,345 322,325 330,325 C338,325 342,345 360,345 L420,345 C440,345 446,305 460,305 C474,305 480,345 500,345 L560,345" fill="#8c564b" fill-opacity="0.35" stroke="#8c564b" stroke-width="2.2"/>
  <line x1="70" y1="345" x2="560" y2="345" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="70" y="372" font-size="15" fill="#1b2a3a">ChIP signal = sum over all cells</text>
  <g font-size="14" fill="#5b6b7a" text-anchor="middle"><text x="200" y="265">site A: 7 of 8</text><text x="330" y="318">B: 2 of 8</text><text x="460" y="298">C: 4 of 8</text></g>

  <line x1="600" y1="16" x2="600" y2="388" stroke="#cfd8e0" stroke-width="1.5"/>
  <text x="620" y="28" font-size="18" font-weight="bold" fill="#1b2a3a">What peak height does and does not tell you</text>
  <text x="620" y="62" font-size="15" font-weight="bold" fill="#2e8b57">It reflects</text>
  <text x="620" y="84" font-size="15" fill="#1b2a3a">• the fraction of cells with the protein (or mark) there</text>
  <text x="620" y="106" font-size="15" fill="#1b2a3a">• how often it was there when fixed (residence time)</text>
  <text x="620" y="128" font-size="15" fill="#1b2a3a">• how well it crosslinks and how well the antibody</text>
  <text x="634" y="148" font-size="15" fill="#1b2a3a">sees it at that site</text>
  <text x="620" y="170" font-size="15" fill="#1b2a3a">• local shearing, copy number and mappability</text>
  <text x="620" y="208" font-size="15" font-weight="bold" fill="#a8324a">It does not tell you</text>
  <text x="620" y="230" font-size="15" fill="#1b2a3a">• which cells are bound: site C could be 100% of a</text>
  <text x="634" y="250" font-size="15" fill="#1b2a3a">minority cell type or 50% of all cells</text>
  <text x="620" y="272" font-size="15" fill="#1b2a3a">• the absolute number of molecules per site</text>
  <text x="620" y="294" font-size="15" fill="#1b2a3a">• whether two factors bind together in one cell</text>
  <text x="620" y="316" font-size="15" fill="#1b2a3a">• whether the binding does anything</text>
  <rect x="620" y="334" width="490" height="54" rx="8" fill="#eaf1f7" stroke="#cfd8e0"/>
  <text x="634" y="357" font-size="15" fill="#1b2a3a">Compare heights of the same site between samples</text>
  <text x="634" y="377" font-size="15" fill="#1b2a3a">(differential binding), not between different sites.</text>
</svg>
