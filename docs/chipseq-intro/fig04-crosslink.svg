<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 400" width="1120" height="400" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/></marker>
    <marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
  </defs>
  <rect width="1120" height="400" fill="#ffffff"/>

  <text x="20" y="28" font-size="18" font-weight="bold" fill="#1b2a3a">Formaldehyde joins amino groups that touch</text>
  <!-- reactants -->
  <rect x="20" y="52" width="150" height="56" rx="8" fill="#f3e9e4" stroke="#8c564b" stroke-width="1.5"/>
  <text x="95" y="76" font-size="15" fill="#1b2a3a" text-anchor="middle">protein</text>
  <text x="52" y="97" font-size="15" fill="#1b2a3a">lysine –NH<tspan dy="4" font-size="11">2</tspan></text>
  <text x="196" y="86" font-size="20" fill="#1b2a3a" text-anchor="middle">+</text>
  <text x="232" y="86" font-size="17" fill="#c0392b">H<tspan dy="4" font-size="12">2</tspan><tspan dy="-4">C=O</tspan></text>
  <text x="326" y="86" font-size="20" fill="#1b2a3a" text-anchor="middle">+</text>
  <rect x="350" y="52" width="160" height="56" rx="8" fill="#eaf1f7" stroke="#2a6f97" stroke-width="1.5"/>
  <text x="430" y="76" font-size="15" fill="#1b2a3a" text-anchor="middle">DNA base</text>
  <text x="380" y="97" font-size="15" fill="#1b2a3a">H<tspan dy="4" font-size="11">2</tspan><tspan dy="-4">N– (A, C, G)</tspan></text>
  <!-- arrow down -->
  <line x1="265" y1="118" x2="265" y2="160" stroke="#1b2a3a" stroke-width="2.2" marker-end="url(#ar)"/>
  <text x="280" y="145" font-size="14" fill="#5b6b7a">1% formaldehyde, minutes</text>
  <!-- product -->
  <rect x="20" y="172" width="150" height="56" rx="8" fill="#f3e9e4" stroke="#8c564b" stroke-width="1.5"/>
  <text x="95" y="206" font-size="15" fill="#1b2a3a" text-anchor="middle">lysine –NH–</text>
  <rect x="190" y="186" width="150" height="30" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
  <text x="206" y="207" font-size="16" fill="#c0392b">CH<tspan dy="4" font-size="11">2</tspan><tspan dy="-4"> bridge, ~2 Å</tspan></text>
  <rect x="360" y="172" width="150" height="56" rx="8" fill="#eaf1f7" stroke="#2a6f97" stroke-width="1.5"/>
  <text x="435" y="206" font-size="15" fill="#1b2a3a" text-anchor="middle">–NH– base</text>
  <line x1="170" y1="201" x2="190" y2="201" stroke="#1b2a3a" stroke-width="2"/>
  <line x1="340" y1="201" x2="360" y2="201" stroke="#1b2a3a" stroke-width="2"/>
  <!-- reversal -->
  <path d="M520,214 C560,250 560,110 520,86" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arR)"/>
  <text x="566" y="140" font-size="14" fill="#c0392b">reversed:</text>
  <text x="566" y="158" font-size="14" fill="#c0392b">65 °C for hours</text>
  <text x="20" y="262" font-size="15" fill="#1b2a3a">Only partners closer than a few ångström are fixed: <tspan font-weight="bold">direct contacts</tspan>,</text>
  <text x="20" y="282" font-size="15" fill="#1b2a3a">and protein–protein contacts, so a co-factor can be fixed to DNA through its partner.</text>
  <text x="20" y="306" font-size="15" fill="#5b6b7a">Stopped with glycine (it soaks up the free formaldehyde).</text>

  <line x1="680" y1="16" x2="680" y2="320" stroke="#cfd8e0" stroke-width="1.5"/>

  <text x="700" y="28" font-size="18" font-weight="bold" fill="#1b2a3a">Fixation time is a trade-off</text>
  <rect x="700" y="48" width="400" height="74" rx="8" fill="#f4f6f8" stroke="#cfd8e0"/>
  <text x="714" y="72" font-size="16" font-weight="bold" fill="#a8324a">too little</text>
  <text x="714" y="93" font-size="15" fill="#1b2a3a">TFs that bind for seconds are lost in the</text>
  <text x="714" y="112" font-size="15" fill="#1b2a3a">washes; weak sites vanish.</text>
  <rect x="700" y="134" width="400" height="74" rx="8" fill="#e6f2ec" stroke="#2e8b57"/>
  <text x="714" y="158" font-size="16" font-weight="bold" fill="#2e8b57">typical</text>
  <text x="714" y="179" font-size="15" fill="#1b2a3a">1% for ~10 min. Histones need little or none:</text>
  <text x="714" y="198" font-size="15" fill="#1b2a3a">they stay on DNA anyway (native ChIP).</text>
  <rect x="700" y="220" width="400" height="98" rx="8" fill="#f4f6f8" stroke="#cfd8e0"/>
  <text x="714" y="244" font-size="16" font-weight="bold" fill="#a8324a">too much</text>
  <text x="714" y="265" font-size="15" fill="#1b2a3a">epitopes are chemically masked; chromatin</text>
  <text x="714" y="284" font-size="15" fill="#1b2a3a">resists sonication; large crosslinked clumps</text>
  <text x="714" y="303" font-size="15" fill="#1b2a3a">give background everywhere.</text>

  <rect x="20" y="334" width="1080" height="56" rx="8" fill="#eaf1f7" stroke="#cfd8e0"/>
  <text x="36" y="358" font-size="15" fill="#1b2a3a"><tspan font-weight="bold">Proteins that do not touch DNA</tspan> (co-activators, chromatin remodellers) are often fixed in two steps: first a longer</text>
  <text x="36" y="379" font-size="15" fill="#1b2a3a">protein–protein crosslinker (e.g. DSG, ~8 Å), then formaldehyde. More capture means more indirect and non-specific signal.</text>
</svg>
