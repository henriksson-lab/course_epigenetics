<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 430" width="1120" height="430" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>
  <rect width="1120" height="430" fill="#ffffff"/>

  <!-- x(bp) = 140 + 1.7*(bp-100) -->
  <!-- reads -->
  <text x="20" y="92" font-size="17" font-weight="bold" fill="#1b2a3a">reads</text>
  <g fill="#5b6b7a">
    <rect x="140" y="58" width="170" height="12" rx="2"/>
    <rect x="395" y="58" width="170" height="12" rx="2"/>
    <rect x="225" y="78" width="170" height="12" rx="2"/>
    <rect x="480" y="78" width="170" height="12" rx="2"/>
    <rect x="225" y="98" width="170" height="12" rx="2"/>
  </g>
  <text x="660" y="69" font-size="13" fill="#5b6b7a">5 reads,</text>
  <text x="660" y="86" font-size="13" fill="#5b6b7a">100 bp</text>
  <text x="660" y="103" font-size="13" fill="#5b6b7a">each</text>

  <!-- coverage -->
  <text x="20" y="190" font-size="17" font-weight="bold" fill="#1b2a3a">coverage</text>
  <g stroke="#cfd8e0" stroke-width="1">
    <line x1="140" y1="208" x2="650" y2="208"/>
    <line x1="140" y1="186" x2="650" y2="186"/>
    <line x1="140" y1="164" x2="650" y2="164"/>
  </g>
  <path d="M140,230 V208 H225 V164 H310 V186 H395 V208 H480 V186 H565 V208 H650 V230 Z" fill="#2a6f97" fill-opacity="0.25" stroke="#2a6f97" stroke-width="2.5" stroke-linejoin="round"/>
  <g font-size="13" fill="#5b6b7a" text-anchor="end">
    <text x="132" y="234">0</text>
    <text x="132" y="212">1</text>
    <text x="132" y="190">2</text>
    <text x="132" y="168">3</text>
  </g>
  <!-- dashed guides from read ends to coverage -->
  <g stroke="#5b6b7a" stroke-width="1" stroke-dasharray="3,3">
    <line x1="225" y1="112" x2="225" y2="160"/>
    <line x1="310" y1="72" x2="310" y2="160"/>
    <line x1="395" y1="112" x2="395" y2="182"/>
    <line x1="480" y1="92" x2="480" y2="182"/>
    <line x1="565" y1="72" x2="565" y2="182"/>
  </g>

  <!-- ruler -->
  <line x1="140" y1="242" x2="650" y2="242" stroke="#1b2a3a" stroke-width="2"/>
  <g stroke="#1b2a3a" stroke-width="2">
    <line x1="140" y1="242" x2="140" y2="249"/>
    <line x1="225" y1="242" x2="225" y2="249"/>
    <line x1="310" y1="242" x2="310" y2="249"/>
    <line x1="395" y1="242" x2="395" y2="249"/>
    <line x1="480" y1="242" x2="480" y2="249"/>
    <line x1="565" y1="242" x2="565" y2="249"/>
    <line x1="650" y1="242" x2="650" y2="249"/>
  </g>
  <g font-size="14" fill="#1b2a3a" text-anchor="middle">
    <text x="140" y="266">100</text>
    <text x="225" y="266">150</text>
    <text x="310" y="266">200</text>
    <text x="395" y="266">250</text>
    <text x="480" y="266">300</text>
    <text x="565" y="266">350</text>
    <text x="650" y="266">400</text>
  </g>
  <text x="20" y="266" font-size="14" fill="#5b6b7a">chr21</text>

  <!-- bedGraph -->
  <text x="20" y="314" font-size="17" font-weight="bold" fill="#1b2a3a">bedGraph</text>
  <rect x="130" y="294" width="170" height="128" rx="4" fill="#f4f6f8" stroke="#cfd8e0"/>
  <g font-family="Courier New, monospace" font-size="15" fill="#1b2a3a">
    <text x="140" y="314">chr21 100 150 1</text>
    <text x="140" y="334">chr21 150 200 3</text>
    <text x="140" y="354">chr21 200 250 2</text>
    <text x="140" y="374">chr21 250 300 1</text>
    <text x="140" y="394">chr21 300 350 2</text>
    <text x="140" y="414">chr21 350 400 1</text>
  </g>

  <!-- arrow bedGraph -> bigWig -->
  <line x1="306" y1="360" x2="716" y2="360" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="510" y="350" font-family="Courier New, monospace" font-size="15" fill="#1b2a3a" text-anchor="middle">bedGraphToBigWig</text>
  <text x="510" y="380" font-size="13" fill="#5b6b7a" text-anchor="middle">compress + index + summarise</text>

  <!-- bigWig file icon -->
  <path d="M722,28 H1066 L1094,56 V300 H722 Z" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="2"/>
  <path d="M1066,28 V56 H1094" fill="none" stroke="#1b2a3a" stroke-width="2"/>
  <text x="738" y="54" font-size="17" font-weight="bold" fill="#1b2a3a">signal.bigWig</text>

  <!-- zoom pyramid -->
  <g font-size="14" fill="#1b2a3a" text-anchor="end">
    <text x="852" y="95">10 kb bins</text>
    <text x="852" y="127">1 kb bins</text>
    <text x="852" y="159">base level</text>
  </g>
  <g fill="#2a6f97" fill-opacity="0.35" stroke="#2a6f97" stroke-width="1.5">
    <rect x="938" y="80" width="40" height="20"/>
    <rect x="978" y="80" width="40" height="20"/>
    <rect x="904" y="112" width="30" height="20"/>
    <rect x="934" y="112" width="30" height="20"/>
    <rect x="964" y="112" width="30" height="20"/>
    <rect x="994" y="112" width="30" height="20"/>
    <rect x="1024" y="112" width="30" height="20"/>
    <rect x="868" y="144" width="20" height="20"/>
    <rect x="888" y="144" width="20" height="20"/>
    <rect x="908" y="144" width="20" height="20"/>
    <rect x="928" y="144" width="20" height="20"/>
    <rect x="948" y="144" width="20" height="20"/>
    <rect x="968" y="144" width="20" height="20"/>
    <rect x="988" y="144" width="20" height="20"/>
    <rect x="1008" y="144" width="20" height="20"/>
    <rect x="1028" y="144" width="20" height="20"/>
    <rect x="1048" y="144" width="20" height="20"/>
  </g>
  <!-- highlighted blocks -->
  <rect x="988" y="144" width="40" height="20" fill="#c0392b" fill-opacity="0.35" stroke="#c0392b" stroke-width="2.5"/>
  <text x="868" y="69" font-size="13" fill="#5b6b7a">zoom levels (coarser summaries)</text>

  <!-- index tree -->
  <text x="738" y="200" font-size="15" font-weight="bold" fill="#1b2a3a">index</text>
  <g stroke="#1b2a3a" stroke-width="1.5">
    <line x1="790" y1="218" x2="760" y2="248"/>
    <line x1="790" y1="218" x2="820" y2="248"/>
    <line x1="760" y1="248" x2="748" y2="276"/>
    <line x1="760" y1="248" x2="772" y2="276"/>
    <line x1="820" y1="248" x2="808" y2="276"/>
    <line x1="820" y1="248" x2="832" y2="276"/>
  </g>
  <g fill="#ffffff" stroke="#1b2a3a" stroke-width="1.5">
    <circle cx="790" cy="218" r="6"/>
    <circle cx="760" cy="248" r="6"/>
    <circle cx="820" cy="248" r="6"/>
    <circle cx="748" cy="276" r="5"/>
    <circle cx="772" cy="276" r="5"/>
    <circle cx="808" cy="276" r="5"/>
    <circle cx="832" cy="276" r="5" fill="#c0392b" stroke="#c0392b"/>
  </g>
  <text x="852" y="222" font-size="13" fill="#5b6b7a">region → position</text>
  <text x="852" y="239" font-size="13" fill="#5b6b7a">in the file</text>

  <!-- browser window -->
  <rect x="722" y="324" width="372" height="98" rx="6" fill="#ffffff" stroke="#1b2a3a" stroke-width="2"/>
  <line x1="722" y1="346" x2="1094" y2="346" stroke="#1b2a3a" stroke-width="1.5"/>
  <circle cx="736" cy="335" r="4" fill="#c0392b"/>
  <circle cx="750" cy="335" r="4" fill="#e9c46a"/>
  <circle cx="764" cy="335" r="4" fill="#8ab17d"/>
  <rect x="780" y="328" width="170" height="14" rx="3" fill="#f4f6f8" stroke="#cfd8e0"/>
  <text x="786" y="339" font-family="Courier New, monospace" font-size="13" fill="#1b2a3a">chr21:100-400</text>
  <text x="736" y="368" font-size="14" fill="#1b2a3a">genome browser</text>
  <path d="M740,410 V398 H757 V380 H774 V389 H791 V398 H808 V389 H825 V398 H842 V410 Z" fill="#2a6f97" fill-opacity="0.25" stroke="#2a6f97" stroke-width="2"/>

  <!-- fetch arrow -->
  <path d="M1008,166 V318" fill="none" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arrR)"/>
  <text x="996" y="262" font-size="14" fill="#c0392b" text-anchor="end">fetch only</text>
  <text x="996" y="280" font-size="14" fill="#c0392b" text-anchor="end">this region</text>
</svg>
