project:
  type: website
  output-dir: docs
  # Built interactive demos (make demos), copied into docs/ on render.
  resources:
    - demos/dist/
  render:
    # Order is set by the sidebar below, not by these globs. One level deep per
    # unit; plan/ holds internal working docs and is excluded from the site.
    - "*.qmd"
    - "*.md"
    - "*/*.qmd"
    - "*/*.md"
    - "!plan/"
    - "!unused-figures/"
    - "!tools/"
    - "!edit-notes/"
    - "!node_modules/"
    - "!demos/"
    - "!data/"
    # Bonus-quiz answers live in canvas-quiz/private/: never render or publish.
    - "!canvas-quiz/"
    # Teacher-only pages: kept in the repo (read them on GitHub), not published.
    - "!README.md"
    - "!audience.md"
    - "!contentplan.md"
    - "!designprinciples.md"
    - "!authors.md"
    - "!CODE_AUDIT_CHECKLIST.md"

