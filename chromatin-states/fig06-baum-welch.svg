<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 310" width="1120" height="310" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6b7a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
    <marker id="arrs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3.6" markerHeight="3.6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>
  <rect width="1120" height="310" fill="#ffffff"/>
  <rect x="20" y="60" width="190" height="104" rx="8" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="115.0" y="88" font-size="16" fill="#1b2a3a" text-anchor="middle" font-weight="bold">Initialise</text>
  <text x="115.0" y="110" font-size="14" fill="#5b6b7a" text-anchor="middle">K states, random or</text>
  <text x="115.0" y="128" font-size="14" fill="#5b6b7a" text-anchor="middle">information-based</text>
  <text x="115.0" y="146" font-size="14" fill="#5b6b7a" text-anchor="middle">emissions, transitions</text>
  <rect x="260" y="60" width="230" height="104" rx="8" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="375.0" y="88" font-size="16" fill="#1b2a3a" text-anchor="middle" font-weight="bold">E-step</text>
  <text x="375.0" y="110" font-size="14" fill="#5b6b7a" text-anchor="middle">forward–backward:</text>
  <text x="375.0" y="128" font-size="14" fill="#5b6b7a" text-anchor="middle">P(state | all marks)</text>
  <text x="375.0" y="146" font-size="14" fill="#5b6b7a" text-anchor="middle">for every bin</text>
  <rect x="540" y="60" width="230" height="104" rx="8" fill="#eaf1f7" stroke="#1b2a3a" stroke-width="1.5"/>
  <text x="655.0" y="88" font-size="16" fill="#1b2a3a" text-anchor="middle" font-weight="bold">M-step</text>
  <text x="655.0" y="110" font-size="14" fill="#5b6b7a" text-anchor="middle">emissions: posterior-</text>
  <text x="655.0" y="128" font-size="14" fill="#5b6b7a" text-anchor="middle">weighted mark frequency;</text>
  <text x="655.0" y="146" font-size="14" fill="#5b6b7a" text-anchor="middle">transitions likewise</text>
  <rect x="860" y="60" width="240" height="104" rx="8" fill="#e8f4ec" stroke="#2e8b57" stroke-width="1.5"/>
  <text x="980.0" y="88" font-size="16" fill="#1b2a3a" text-anchor="middle" font-weight="bold">Decode</text>
  <text x="980.0" y="110" font-size="14" fill="#5b6b7a" text-anchor="middle">most probable state</text>
  <text x="980.0" y="128" font-size="14" fill="#5b6b7a" text-anchor="middle">per bin (posterior)</text>
  <text x="980.0" y="146" font-size="14" fill="#5b6b7a" text-anchor="middle">→ segmentation BED</text>
  <line x1="212" y1="112.0" x2="256" y2="112.0" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="492" y1="112.0" x2="536" y2="112.0" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M655,166 L655,204 L375,204 L375,170" stroke="#1b2a3a" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <text x="515" y="226" font-size="14" fill="#1b2a3a" text-anchor="middle">repeat until the log-likelihood stops improving</text>
  <text x="515" y="246" font-size="14" fill="#5b6b7a" text-anchor="middle">(Baum–Welch, an EM algorithm: a local optimum)</text>
  <line x1="772" y1="112.0" x2="856" y2="112.0" stroke="#1b2a3a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="814" y="102.0" font-size="13" fill="#5b6b7a" text-anchor="middle">done</text>
  <text x="20" y="30" font-size="17" fill="#1b2a3a" font-weight="bold">Learning a ChromHMM model (LearnModel)</text>
  <text x="20" y="290" font-size="14" fill="#5b6b7a">Same logic as k-means clustering of bins, but the states also have to be spatially coherent along the genome</text>
</svg>
