<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/></marker></defs>
<rect width="1120" height="350" fill="#ffffff"/>
<text x="115" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#1b2a3a">DNA double helix</text>
<text x="115" y="302" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b2a3a">2 nm</text>
<text x="115" y="326" text-anchor="middle" font-size="15" fill="#5b6b7a">≈10 bp per turn</text>
<text x="370" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#1b2a3a">nucleosomes</text>
<text x="370" y="302" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b2a3a">11 nm</text>
<text x="370" y="326" text-anchor="middle" font-size="15" fill="#5b6b7a">≈200 bp per bead</text>
<text x="660" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#1b2a3a">loops and domains</text>
<text x="660" y="302" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b2a3a">≈0.1–1 µm</text>
<text x="660" y="326" text-anchor="middle" font-size="15" fill="#5b6b7a">10 kb – 1 Mb</text>
<text x="965" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#1b2a3a">chromosome territory</text>
<text x="965" y="302" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b2a3a">≈1–2 µm (nucleus ≈10 µm)</text>
<text x="965" y="326" text-anchor="middle" font-size="15" fill="#5b6b7a">a whole chromosome, 50–250 Mb</text>
