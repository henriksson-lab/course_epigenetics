<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 340" width="1120" height="340" font-family="Helvetica, Arial, sans-serif">
<defs>
<marker id="aink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/></marker>
</defs>
<rect width="1120" height="340" fill="#ffffff"/>
<!-- confusion matrix -->
<text x="20" y="30" font-size="17" font-weight="bold" fill="#1b2a3a">Predicted by ABC ≥ 0.02 vs CRISPRi (K562)</text>
<text x="245" y="66" font-size="15" font-weight="bold" fill="#c0392b" text-anchor="middle">CRISPRi positive</text>
<text x="395" y="66" font-size="15" font-weight="bold" fill="#5b6b7a" text-anchor="middle">CRISPRi negative</text>
<text x="160" y="118" font-size="15" font-weight="bold" fill="#1b2a3a" text-anchor="end">predicted</text>
<text x="160" y="138" font-size="15" font-weight="bold" fill="#1b2a3a" text-anchor="end">link</text>
<text x="160" y="208" font-size="15" font-weight="bold" fill="#1b2a3a" text-anchor="end">no link</text>
<rect x="175" y="80" width="140" height="80" fill="#2e8b57" fill-opacity="0.18" stroke="#1b2a3a" stroke-width="1.2"/>
<rect x="325" y="80" width="140" height="80" fill="#c0392b" fill-opacity="0.12" stroke="#1b2a3a" stroke-width="1.2"/>
<rect x="175" y="170" width="140" height="80" fill="#c0392b" fill-opacity="0.12" stroke="#1b2a3a" stroke-width="1.2"/>
<rect x="325" y="170" width="140" height="80" fill="#f4f6f8" stroke="#1b2a3a" stroke-width="1.2"/>
<g font-size="16" fill="#1b2a3a" text-anchor="middle">
<text x="245" y="114" font-weight="bold">TP = 294</text><text x="245" y="138" font-size="14" fill="#5b6b7a">true positives</text>
<text x="395" y="114" font-weight="bold">FP = 308</text><text x="395" y="138" font-size="14" fill="#5b6b7a">false positives</text>
<text x="245" y="204" font-weight="bold">FN = 177</text><text x="245" y="228" font-size="14" fill="#5b6b7a">false negatives</text>
<text x="395" y="204" font-weight="bold">TN = 9577</text><text x="395" y="228" font-size="14" fill="#5b6b7a">true negatives</text>
</g>
<g font-size="15" fill="#1b2a3a">
<text x="20" y="286">precision = TP / (TP + FP) = 294 / 602 = <tspan font-weight="bold">0.49</tspan>   (of the links I call, how many are real?)</text>
<text x="20" y="312">recall = TP / (TP + FN) = 294 / 471 = <tspan font-weight="bold">0.62</tspan>   (of the real links, how many do I find?)</text>
</g>
<!-- PR curve schematic -->
<text x="700" y="30" font-size="17" font-weight="bold" fill="#1b2a3a">Lower the threshold, trace a curve</text>
<line x1="740" y1="250" x2="1080" y2="250" stroke="#1b2a3a" stroke-width="1.5"/>
<line x1="740" y1="250" x2="740" y2="60" stroke="#1b2a3a" stroke-width="1.5"/>
<text x="910" y="276" font-size="15" fill="#1b2a3a" text-anchor="middle">recall</text>
<text x="722" y="155" font-size="15" fill="#1b2a3a" text-anchor="middle" transform="rotate(-90 722 155)">precision</text>
<g font-size="13" fill="#5b6b7a" text-anchor="middle"><text x="740" y="266">0</text><text x="1080" y="266">1</text></g>
<g font-size="13" fill="#5b6b7a" text-anchor="end"><text x="734" y="64">1</text><text x="734" y="242">0</text></g>
<path d="M745,72 C800,80 860,100 920,130 C980,160 1030,200 1078,238" stroke="#2e8b57" stroke-width="3" fill="none"/>
<path d="M745,120 C820,140 900,170 960,200 C1010,222 1050,234 1078,238" stroke="#5b6b7a" stroke-width="3" fill="none"/>
<line x1="740" y1="240" x2="1080" y2="240" stroke="#5b6b7a" stroke-width="1.5" stroke-dasharray="5,4"/>
<text x="752" y="232" font-size="14" fill="#5b6b7a">random = fraction positive (4.5%)</text>
<text x="800" y="70" font-size="15" fill="#2e8b57" font-weight="bold">better score</text>
<text x="820" y="186" font-size="15" fill="#5b6b7a" font-weight="bold">worse score</text>
<circle cx="920" cy="130" r="6" fill="#2e8b57"/>
<path d="M985,110 L931,126" stroke="#1b2a3a" stroke-width="1.8" fill="none" marker-end="url(#aink)"/>
<text x="1004" y="84" font-size="14" fill="#1b2a3a" text-anchor="middle">one threshold</text>
<text x="1004" y="100" font-size="14" fill="#1b2a3a" text-anchor="middle">= one point</text>
</svg>
