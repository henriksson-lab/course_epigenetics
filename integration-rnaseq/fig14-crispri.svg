<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 380" width="1120" height="380" font-family="Helvetica, Arial, sans-serif">
<defs>
<marker id="aink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/></marker>
</defs>
<rect width="1120" height="380" fill="#ffffff"/>
<g fill="#f4f6f8" stroke="#dfe6ec" stroke-width="1.5">
<rect x="10" y="10" width="545" height="360" rx="8"/>
<rect x="565" y="10" width="545" height="360" rx="8"/>
</g>
<text x="26" y="38" font-size="17" font-weight="bold" fill="#1b2a3a">A. CRISPRi-FlowFISH: one gene, every element nearby</text>
<text x="581" y="38" font-size="17" font-weight="bold" fill="#1b2a3a">B. Single-cell screen: many elements, all genes</text>

<!-- Panel A -->
<!-- locus with tiled guides -->
<line x1="40" y1="100" x2="520" y2="100" stroke="#5b6b7a" stroke-width="1.5"/>
<g stroke="#6b4fa0" stroke-width="2">
<line x1="60" y1="84" x2="60" y2="94"/><line x1="90" y1="84" x2="90" y2="94"/><line x1="120" y1="84" x2="120" y2="94"/><line x1="150" y1="84" x2="150" y2="94"/><line x1="180" y1="84" x2="180" y2="94"/><line x1="210" y1="84" x2="210" y2="94"/><line x1="240" y1="84" x2="240" y2="94"/><line x1="270" y1="84" x2="270" y2="94"/><line x1="300" y1="84" x2="300" y2="94"/><line x1="330" y1="84" x2="330" y2="94"/><line x1="360" y1="84" x2="360" y2="94"/><line x1="390" y1="84" x2="390" y2="94"/>
</g>
<text x="40" y="72" font-size="15" fill="#6b4fa0">guides tile every open element (dCas9-KRAB)</text>
<rect x="450" y="92" width="44" height="16" fill="#1b2a3a"/>
<text x="472" y="126" font-size="15" font-style="italic" fill="#1b2a3a" text-anchor="middle">gene G</text>
<!-- FISH histogram -->
<text x="40" y="160" font-size="15" fill="#1b2a3a">RNA FISH for G, sort cells by signal</text>
<line x1="60" y1="260" x2="300" y2="260" stroke="#1b2a3a" stroke-width="1.5"/>
<path d="M70,260 C110,258 130,180 180,176 C230,180 250,258 290,260 z" fill="#dfe6ec" stroke="#5b6b7a" stroke-width="1.5"/>
<rect x="70" y="182" width="56" height="78" fill="#c0392b" fill-opacity="0.25"/>
<rect x="234" y="182" width="56" height="78" fill="#2e8b57" fill-opacity="0.25"/>
<text x="98" y="280" font-size="14" fill="#c0392b" text-anchor="middle">low bin</text>
<text x="262" y="280" font-size="14" fill="#2e8b57" text-anchor="middle">high bin</text>
<text x="180" y="300" font-size="14" fill="#5b6b7a" text-anchor="middle">G RNA per cell</text>
<path d="M310,220 L344,220" stroke="#1b2a3a" stroke-width="2" fill="none" marker-end="url(#aink)"/>
<!-- effect along locus -->
<text x="356" y="160" font-size="15" fill="#1b2a3a">sequence guides per bin</text>
<line x1="360" y1="230" x2="530" y2="230" stroke="#1b2a3a" stroke-width="1.2"/>
<g fill="#5b6b7a">
<rect x="364" y="230" width="9" height="4"/><rect x="378" y="230" width="9" height="3"/><rect x="392" y="230" width="9" height="5"/><rect x="420" y="230" width="9" height="3"/><rect x="434" y="230" width="9" height="4"/><rect x="476" y="230" width="9" height="3"/><rect x="490" y="230" width="9" height="2"/><rect x="504" y="230" width="9" height="4"/>
</g>
<rect x="406" y="230" width="9" height="40" fill="#c0392b"/>
<rect x="448" y="230" width="9" height="22" fill="#c0392b"/>
<rect x="462" y="230" width="9" height="56" fill="#c0392b"/>
<text x="445" y="306" font-size="14" fill="#c0392b" text-anchor="middle">guides depleted from</text>
<text x="445" y="324" font-size="14" fill="#c0392b" text-anchor="middle">high bin = enhancers of G</text>
<text x="26" y="352" font-size="14" fill="#5b6b7a">Fulco et al. 2019: >3500 element–gene pairs for 30 genes (K562)</text>

<!-- Panel B -->
<text x="581" y="72" font-size="15" fill="#1b2a3a">each cell gets several random guides (high MOI)</text>
<g>
<circle cx="620" cy="130" r="30" fill="#eaf1f7" stroke="#5b6b7a" stroke-width="1.5"/>
<circle cx="610" cy="122" r="5" fill="#c0392b"/><circle cx="628" cy="138" r="5" fill="#2a6f97"/><circle cx="624" cy="118" r="5" fill="#d4a017"/>
<circle cx="700" cy="130" r="30" fill="#eaf1f7" stroke="#5b6b7a" stroke-width="1.5"/>
<circle cx="690" cy="138" r="5" fill="#2e8b57"/><circle cx="708" cy="122" r="5" fill="#2a6f97"/>
<circle cx="780" cy="130" r="30" fill="#eaf1f7" stroke="#5b6b7a" stroke-width="1.5"/>
<circle cx="772" cy="120" r="5" fill="#c0392b"/><circle cx="790" cy="136" r="5" fill="#6b4fa0"/><circle cx="776" cy="140" r="5" fill="#2e8b57"/>
<text x="830" y="136" font-size="22" fill="#5b6b7a">…</text>
</g>
<text x="870" y="122" font-size="15" fill="#1b2a3a">single-cell RNA-seq:</text>
<text x="870" y="142" font-size="15" fill="#1b2a3a">guides + transcriptome</text>
<!-- comparison -->
<text x="581" y="200" font-size="15" fill="#1b2a3a">for element E (red guide): genes within 1 Mb,</text>
<text x="581" y="220" font-size="15" fill="#1b2a3a">cells with vs without the guide</text>
<line x1="610" y1="320" x2="1080" y2="320" stroke="#1b2a3a" stroke-width="1.2"/>
<g font-size="14" font-style="italic" fill="#1b2a3a" text-anchor="middle">
<text x="660" y="340">G1</text><text x="780" y="340">G2</text><text x="900" y="340">G3</text><text x="1020" y="340">G4</text>
</g>
<g>
<rect x="636" y="262" width="20" height="58" fill="#5b6b7a"/><rect x="662" y="264" width="20" height="56" fill="#c0392b"/>
<rect x="756" y="250" width="20" height="70" fill="#5b6b7a"/><rect x="782" y="292" width="20" height="28" fill="#c0392b"/>
<rect x="876" y="270" width="20" height="50" fill="#5b6b7a"/><rect x="902" y="272" width="20" height="48" fill="#c0392b"/>
<rect x="996" y="256" width="20" height="64" fill="#5b6b7a"/><rect x="1022" y="258" width="20" height="62" fill="#c0392b"/>
</g>
<text x="792" y="284" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle">↓</text>
<rect x="900" y="234" width="12" height="12" fill="#5b6b7a"/><text x="918" y="245" font-size="14" fill="#5b6b7a">without</text>
<rect x="984" y="234" width="12" height="12" fill="#c0392b"/><text x="1002" y="245" font-size="14" fill="#c0392b">with guide</text>
<text x="581" y="364" font-size="14" fill="#5b6b7a">Gasperini et al. 2019: 5920 candidate enhancers, 254 974 cells, 664 pairs (K562)</text>
</svg>
