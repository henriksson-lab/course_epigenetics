</defs>
<rect width="1120" height="250" fill="#ffffff"/>
<g stroke="#1b2a3a" stroke-width="1.5">
<rect x="10" y="30" width="190" height="90" rx="8" fill="#eaf1f7"/>
<rect x="238" y="30" width="190" height="90" rx="8" fill="#eaf1f7"/>
