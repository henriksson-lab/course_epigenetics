<g font-size="16" font-weight="bold" fill="#1b2a3a" text-anchor="middle">
<text x="105" y="68">ATAC / H3K27ac</text><text x="105" y="90">in A and B</text>
<text x="333" y="68">differential</text><text x="333" y="90">peaks</text>
<text x="561" y="68">link peaks</text><text x="561" y="90">to genes</text>
<text x="789" y="68">compare with</text><text x="789" y="90">RNA-seq (DE genes)</text>
<text x="1016" y="68">test the best</text><text x="1016" y="90">pairs</text>
</g>
<g font-size="15" fill="#5b6b7a">
<text x="14" y="150">replicates, same peak set</text>
<text x="14" y="172">(Differential accessibility)</text>
<text x="242" y="150">DESeq2 on peaks;</text>
<text x="242" y="172">mostly distal elements</text>
<text x="470" y="150">ABC (activity + contact),</text>
<text x="470" y="172">Hi-C / HiChIP, correlation;</text>
<text x="470" y="194">nearest gene only as a</text>
<text x="470" y="216">labelled fallback</text>
<text x="698" y="150">do linked genes change in</text>
<text x="698" y="172">the same direction? more</text>
<text x="698" y="194">than genes of unlinked</text>
<text x="698" y="216">peaks?</text>
<text x="926" y="150">CRISPRi of the element,</text>
<text x="926" y="172">deletion, or an allelic</text>
<text x="926" y="194">variant (QTL)</text>
</g>
