<text x="565.0" y="54" text-anchor="middle" font-size="14" fill="#5b6b7a">chrM</text>
<text x="565.0" y="232" text-anchor="middle" font-size="15" fill="#1b2a3a">many mtDNA copies,</text>
<text x="565.0" y="251" text-anchor="middle" font-size="15" fill="#1b2a3a">no nucleosomes: up to</text>
<text x="565.0" y="270" text-anchor="middle" font-size="15" fill="#1b2a3a">half of all reads</text>
<text x="565.0" y="310" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, monospace" fill="#5b6b7a">drop chrM</text>
