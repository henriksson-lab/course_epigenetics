<text x="117.0" y="112" text-anchor="middle" font-size="22" font-weight="bold" fill="#c0392b">?</text>
<rect x="232" y="8" width="218" height="314" rx="8" fill="#f4f6f8" stroke="#d9dee3"/>
<text x="341.0" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b2a3a">Improper pairs</text>
<text x="341.0" y="54" text-anchor="middle" font-size="14" fill="#5b6b7a">not flag 0x2</text>
<text x="341.0" y="232" text-anchor="middle" font-size="15" fill="#1b2a3a">mates too far apart,</text>
<text x="341.0" y="251" text-anchor="middle" font-size="15" fill="#1b2a3a">wrong orientation,</text>
<text x="341.0" y="270" text-anchor="middle" font-size="15" fill="#1b2a3a">or mate unmapped</text>
<text x="341.0" y="310" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, monospace" fill="#5b6b7a">samtools view -f 2</text>
<line x1="246" y1="170" x2="436" y2="170" stroke="#1b2a3a" stroke-width="2"/>
<line x1="256" y1="96" x2="306" y2="96" stroke="#2a6f97" stroke-width="3" marker-end="url(#ab)"/>
<line x1="376" y1="96" x2="426" y2="96" stroke="#2a6f97" stroke-width="3" marker-end="url(#ab)"/>
<text x="341.0" y="84" text-anchor="middle" font-size="14" fill="#5b6b7a">same direction</text>
<line x1="256" y1="140" x2="296" y2="140" stroke="#2a6f97" stroke-width="3" marker-end="url(#ab)"/>
<line x1="430" y1="140" x2="390" y2="140" stroke="#2a6f97" stroke-width="3" marker-end="url(#ab)"/>
<text x="341.0" y="128" text-anchor="middle" font-size="14" fill="#5b6b7a">&gt; 2 kb apart</text>
<line x1="302" y1="140" x2="384" y2="140" stroke="#5b6b7a" stroke-width="1.2" stroke-dasharray="3 4"/>
