<line x1="596.2" y1="100.9" x2="604.9" y2="90.0" stroke="#2a6f97" stroke-width="3"/>
<line x1="610.0" y1="118.3" x2="622.7" y2="112.2" stroke="#2a6f97" stroke-width="3"/>
<text x="565.0" y="145" text-anchor="middle" font-size="15" fill="#1b2a3a">16.6 kb</text>
