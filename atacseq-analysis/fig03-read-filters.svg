<text x="789.0" y="54" text-anchor="middle" font-size="14" fill="#5b6b7a">same start and end</text>
<text x="789.0" y="232" text-anchor="middle" font-size="15" fill="#1b2a3a">one molecule copied</text>
<text x="789.0" y="251" text-anchor="middle" font-size="15" fill="#1b2a3a">by PCR: counts once</text>
<text x="789.0" y="310" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, monospace" fill="#5b6b7a">samtools markdup -r</text>
