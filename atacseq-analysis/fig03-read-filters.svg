<text x="117.0" y="34" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b2a3a">Multi-mappers</text>
<text x="117.0" y="54" text-anchor="middle" font-size="14" fill="#5b6b7a">low MAPQ</text>
<text x="117.0" y="232" text-anchor="middle" font-size="15" fill="#1b2a3a">same sequence twice:</text>
<text x="117.0" y="251" text-anchor="middle" font-size="15" fill="#1b2a3a">where did the read</text>
<text x="117.0" y="270" text-anchor="middle" font-size="15" fill="#1b2a3a">come from?</text>
<text x="117.0" y="310" text-anchor="middle" font-size="14" font-family="Menlo, Consolas, monospace" fill="#5b6b7a">samtools view -q 30</text>
<line x1="22" y1="170" x2="212" y2="170" stroke="#1b2a3a" stroke-width="2"/>
<rect x="34" y="162" width="68" height="16" fill="#e67e22" fill-opacity="0.6"/>
<line x1="40" y1="140" x2="96" y2="140" stroke="#c0392b" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#ar)"/>
<text x="68" y="198" text-anchor="middle" font-size="14" fill="#5b6b7a">repeat</text>
<rect x="132" y="162" width="68" height="16" fill="#e67e22" fill-opacity="0.6"/>
<line x1="138" y1="140" x2="194" y2="140" stroke="#c0392b" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#ar)"/>
