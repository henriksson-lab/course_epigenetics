<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 400" width="1120" height="400" font-family="Helvetica, Arial, sans-serif">
<rect width="1120" height="400" fill="white"/>
<text x="20" y="28" font-size="18" font-weight="bold" fill="#1b2a3a">A  Merge overlapping peaks</text>
<text x="20" y="75" font-size="15" fill="#2a6f97">sample 1</text>
<rect x="147.0" y="62" width="175.5" height="16" rx="3" fill="#2a6f97" fill-opacity="0.8"/>
<text x="20" y="115" font-size="15" fill="#e67e22">sample 2</text>
<rect x="201.0" y="102" width="162.0" height="16" rx="3" fill="#e67e22" fill-opacity="0.8"/>
<rect x="376.5" y="102" width="94.5" height="16" rx="3" fill="#e67e22" fill-opacity="0.8"/>
<text x="20" y="155" font-size="15" fill="#6b4fa0">sample 3</text>
<rect x="322.5" y="142" width="175.5" height="16" rx="3" fill="#6b4fa0" fill-opacity="0.8"/>
<line x1="110" y1="182" x2="560" y2="182" stroke="#d9dee3"/>
<text x="20" y="215" font-size="15" font-weight="bold" fill="#2e8b57">consensus</text>
<rect x="147.0" y="201" width="351.0" height="18" rx="3" fill="#2e8b57"/>
<text x="322.5" y="246" text-anchor="middle" font-size="15" fill="#1b2a3a">one 1300-bp region</text>
<text x="20" y="290" font-size="15" fill="#1b2a3a">Overlaps chain together: two separate</text>
<text x="20" y="310" font-size="15" fill="#1b2a3a">elements become one region.</text>
<text x="20" y="330" font-size="15" fill="#5b6b7a">Widths differ from region to region,</text>
<text x="20" y="350" font-size="15" fill="#5b6b7a">so read counts are not comparable,</text>
<text x="20" y="370" font-size="15" fill="#5b6b7a">and the set changes when a sample is added.</text>
<text x="580" y="28" font-size="18" font-weight="bold" fill="#1b2a3a">B  Fixed-width peaks around summits</text>
<text x="580" y="75" font-size="15" fill="#2a6f97">sample 1</text>
<rect x="725.9" y="62" width="135.0" height="16" rx="3" fill="#2a6f97" fill-opacity="0.85"/>
<line x1="793.4" y1="58" x2="793.4" y2="82" stroke="#1b2a3a" stroke-width="2"/>
<text x="866.9" y="75" font-size="14" fill="#1b2a3a">30</text>
<text x="580" y="115" font-size="15" fill="#e67e22">sample 2</text>
<rect x="717.8" y="102" width="135.0" height="16" rx="3" fill="#e67e22" fill-opacity="0.25"/>
<line x1="785.3" y1="98" x2="785.3" y2="122" stroke="#1b2a3a" stroke-width="2"/>
<text x="858.8" y="115" font-size="14" fill="#5b6b7a">12</text>
<rect x="909.5" y="102" width="135.0" height="16" rx="3" fill="#e67e22" fill-opacity="0.25"/>
<line x1="977.0" y1="98" x2="977.0" y2="122" stroke="#1b2a3a" stroke-width="2"/>
<text x="1050.5" y="115" font-size="14" fill="#5b6b7a">20</text>
<text x="580" y="155" font-size="15" fill="#6b4fa0">sample 3</text>
<rect x="914.9" y="142" width="135.0" height="16" rx="3" fill="#6b4fa0" fill-opacity="0.85"/>
<line x1="982.4" y1="138" x2="982.4" y2="162" stroke="#1b2a3a" stroke-width="2"/>
<text x="1055.9" y="155" font-size="14" fill="#1b2a3a">25</text>
<line x1="670" y1="182" x2="1120" y2="182" stroke="#d9dee3"/>
<text x="580" y="215" font-size="15" font-weight="bold" fill="#2e8b57">consensus</text>
<rect x="725.9" y="201" width="135.0" height="18" rx="3" fill="#2e8b57"/>
<text x="793.4" y="246" text-anchor="middle" font-size="15" fill="#1b2a3a">500 bp</text>
<rect x="914.9" y="201" width="135.0" height="18" rx="3" fill="#2e8b57"/>
<text x="982.4" y="246" text-anchor="middle" font-size="15" fill="#1b2a3a">500 bp</text>
<text x="580" y="290" font-size="15" fill="#1b2a3a">Each summit ± 250 bp. Where 500-bp peaks</text>
<text x="580" y="310" font-size="15" fill="#1b2a3a">overlap, keep the most significant</text>
<text x="580" y="330" font-size="15" fill="#5b6b7a">(score shown) and drop the others (pale).</text>
<text x="580" y="350" font-size="15" fill="#5b6b7a">Two elements stay two; every region has</text>
<text x="580" y="370" font-size="15" fill="#5b6b7a">the same width (Corces et al. 2018).</text>
<line x1="560" y1="50" x2="560" y2="390" stroke="#d9dee3" stroke-width="1.5"/>
</svg>