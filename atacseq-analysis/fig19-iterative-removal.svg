<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 430" width="1120" height="430" font-family="Helvetica, Arial, sans-serif">
<rect width="1120" height="430" fill="white"/>
<text x="20" y="28" font-size="18" font-weight="bold" fill="#1b2a3a">Iterative overlap removal: strongest first, compare only with peaks already kept</text>
<text x="20" y="80" font-size="16" font-weight="bold" fill="#1b2a3a">start</text>
<text x="20" y="100" font-size="14" fill="#5b6b7a">500-bp peaks and their scores</text>
<rect x="330.0" y="70" width="165.0" height="20" rx="4" fill="#d9dee3" stroke="#5b6b7a" stroke-width="1.2"/>
<text x="412.5" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b2a3a">8</text>
<rect x="429.0" y="96" width="165.0" height="20" rx="4" fill="#d9dee3" stroke="#5b6b7a" stroke-width="1.2"/>
<text x="511.5" y="111" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b2a3a">15</text>
<rect x="544.5" y="70" width="165.0" height="20" rx="4" fill="#d9dee3" stroke="#5b6b7a" stroke-width="1.2"/>
<text x="627.0" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b2a3a">10</text>
<rect x="660.0" y="96" width="165.0" height="20" rx="4" fill="#d9dee3" stroke="#5b6b7a" stroke-width="1.2"/>
<text x="742.5" y="111" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b2a3a">6</text>
<rect x="891.0" y="70" width="165.0" height="20" rx="4" fill="#d9dee3" stroke="#5b6b7a" stroke-width="1.2"/>
<text x="973.5" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b2a3a">9</text>
<line x1="20" y1="136" x2="1100" y2="136" stroke="#eef1f4"/>
<text x="20" y="168" font-size="16" font-weight="bold" fill="#1b2a3a">step 1</text>
<text x="20" y="188" font-size="14" fill="#5b6b7a">keep 15; drop 8 and 10 (overlap 15)</text>
<rect x="330.0" y="158" width="165.0" height="20" rx="4" fill="#f4f6f8" stroke="#5b6b7a" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="412.5" y="173" text-anchor="middle" font-size="14" font-weight="bold" fill="#5b6b7a">8</text>
<rect x="429.0" y="184" width="165.0" height="20" rx="4" fill="#2e8b57" stroke="#c0392b" stroke-width="3"/>
<text x="511.5" y="199" text-anchor="middle" font-size="14" font-weight="bold" fill="white">15</text>
<rect x="544.5" y="158" width="165.0" height="20" rx="4" fill="#f4f6f8" stroke="#5b6b7a" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="627.0" y="173" text-anchor="middle" font-size="14" font-weight="bold" fill="#5b6b7a">10</text>
<rect x="660.0" y="184" width="165.0" height="20" rx="4" fill="#d9dee3" stroke="#5b6b7a" stroke-width="1.2"/>
<text x="742.5" y="199" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b2a3a">6</text>
<rect x="891.0" y="158" width="165.0" height="20" rx="4" fill="#d9dee3" stroke="#5b6b7a" stroke-width="1.2"/>
<text x="973.5" y="173" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b2a3a">9</text>
<line x1="20" y1="224" x2="1100" y2="224" stroke="#eef1f4"/>
<text x="20" y="256" font-size="16" font-weight="bold" fill="#1b2a3a">step 2</text>
<text x="20" y="276" font-size="14" fill="#5b6b7a">next is 9: no overlap, keep</text>
<rect x="330.0" y="246" width="165.0" height="20" rx="4" fill="#f4f6f8" stroke="#5b6b7a" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="412.5" y="261" text-anchor="middle" font-size="14" font-weight="bold" fill="#5b6b7a">8</text>
<rect x="429.0" y="272" width="165.0" height="20" rx="4" fill="#2e8b57" stroke="#2e8b57" stroke-width="1.2"/>
<text x="511.5" y="287" text-anchor="middle" font-size="14" font-weight="bold" fill="white">15</text>
<rect x="544.5" y="246" width="165.0" height="20" rx="4" fill="#f4f6f8" stroke="#5b6b7a" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="627.0" y="261" text-anchor="middle" font-size="14" font-weight="bold" fill="#5b6b7a">10</text>
<rect x="660.0" y="272" width="165.0" height="20" rx="4" fill="#d9dee3" stroke="#5b6b7a" stroke-width="1.2"/>
<text x="742.5" y="287" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b2a3a">6</text>
<rect x="891.0" y="246" width="165.0" height="20" rx="4" fill="#2e8b57" stroke="#c0392b" stroke-width="3"/>
<text x="973.5" y="261" text-anchor="middle" font-size="14" font-weight="bold" fill="white">9</text>
<line x1="20" y1="312" x2="1100" y2="312" stroke="#eef1f4"/>
<text x="20" y="344" font-size="16" font-weight="bold" fill="#1b2a3a">step 3</text>
<text x="20" y="364" font-size="14" fill="#5b6b7a">next is 6: overlaps only 10,</text>
<text x="20" y="382" font-size="14" fill="#5b6b7a">which is already gone: keep</text>
<rect x="330.0" y="334" width="165.0" height="20" rx="4" fill="#f4f6f8" stroke="#5b6b7a" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="412.5" y="349" text-anchor="middle" font-size="14" font-weight="bold" fill="#5b6b7a">8</text>
<rect x="429.0" y="360" width="165.0" height="20" rx="4" fill="#2e8b57" stroke="#2e8b57" stroke-width="1.2"/>
<text x="511.5" y="375" text-anchor="middle" font-size="14" font-weight="bold" fill="white">15</text>
<rect x="544.5" y="334" width="165.0" height="20" rx="4" fill="#f4f6f8" stroke="#5b6b7a" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="627.0" y="349" text-anchor="middle" font-size="14" font-weight="bold" fill="#5b6b7a">10</text>
<rect x="660.0" y="360" width="165.0" height="20" rx="4" fill="#2e8b57" stroke="#c0392b" stroke-width="3"/>
<text x="742.5" y="375" text-anchor="middle" font-size="14" font-weight="bold" fill="white">6</text>
<rect x="891.0" y="334" width="165.0" height="20" rx="4" fill="#2e8b57" stroke="#2e8b57" stroke-width="1.2"/>
<text x="973.5" y="349" text-anchor="middle" font-size="14" font-weight="bold" fill="white">9</text>
<line x1="20" y1="400" x2="1100" y2="400" stroke="#eef1f4"/>
<text x="20" y="416" font-size="15" fill="#1b2a3a">Result: 15, 9 and 6, all 500 bp and non-overlapping. Peak 6 survives because 10, its only neighbour, lost to 15.</text>
</svg>