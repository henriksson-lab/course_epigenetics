<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 420" width="1120" height="420" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2a6f97"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker></defs>
<rect width="1120" height="420" fill="white"/>
<text x="20" y="72" font-size="17" font-weight="bold" fill="#1b2a3a">300-bp fragment</text>
<text x="20" y="92" font-size="15" fill="#5b6b7a">reads stay in the insert</text>
<rect x="250" y="69" width="110" height="18" fill="#d9dee3" stroke="#5b6b7a"/>
<rect x="360" y="69" width="600.0" height="18" fill="#1b2a3a"/>
<rect x="960.0" y="69" width="110" height="18" fill="#d9dee3" stroke="#5b6b7a"/>
<line x1="360" y1="54" x2="560.0" y2="54" stroke="#2a6f97" stroke-width="3.5" marker-end="url(#ab)"/>
<text x="570.0" y="59" font-size="15" fill="#2a6f97">read 1 (100 bp)</text>
<line x1="960.0" y1="102" x2="760.0" y2="102" stroke="#2a6f97" stroke-width="3.5" marker-end="url(#ab)"/>
<text x="750.0" y="107" text-anchor="end" font-size="15" fill="#2a6f97">read 2 (100 bp)</text>
<text x="20" y="204" font-size="17" font-weight="bold" fill="#1b2a3a">60-bp fragment</text>
<text x="20" y="224" font-size="15" fill="#5b6b7a">reads run into the adapter</text>
<rect x="270" y="201" width="90" height="18" fill="#d9dee3" stroke="#5b6b7a"/>
<rect x="360" y="201" width="120.0" height="18" fill="#1b2a3a"/>
<rect x="480.0" y="201" width="90" height="18" fill="#d9dee3" stroke="#5b6b7a"/>
<line x1="360" y1="186" x2="480.0" y2="186" stroke="#2a6f97" stroke-width="3.5"/>
<line x1="480.0" y1="186" x2="560.0" y2="186" stroke="#c0392b" stroke-width="3.5" marker-end="url(#ar)"/>
<line x1="480.0" y1="234" x2="360" y2="234" stroke="#2a6f97" stroke-width="3.5"/>
<line x1="360" y1="234" x2="280.0" y2="234" stroke="#c0392b" stroke-width="3.5" marker-end="url(#ar)"/>
<text x="590.0" y="184" font-size="15" fill="#c0392b">last 40 bases of each read are adapter:</text>
<text x="590.0" y="204" font-size="16" font-family="Menlo, Consolas, monospace" fill="#c0392b">CTGTCTCTTATACACATCT…</text>
<text x="590.0" y="226" font-size="15" fill="#5b6b7a">(the Tn5 mosaic end, the same in R1 and R2)</text>
<text x="20" y="324" font-size="17" font-weight="bold" fill="#1b2a3a">after trimming</text>
<text x="20" y="344" font-size="15" fill="#5b6b7a">fastp, cutadapt</text>
<rect x="360" y="321" width="120.0" height="18" fill="#1b2a3a"/>
<line x1="360" y1="306" x2="480.0" y2="306" stroke="#2a6f97" stroke-width="3.5" marker-end="url(#ab)"/>
<line x1="480.0" y1="354" x2="360" y2="354" stroke="#2a6f97" stroke-width="3.5" marker-end="url(#ab)"/>
<text x="590.0" y="316" font-size="15" fill="#1b2a3a">both reads cut back to 60 bp; now they align end to end</text>
<text x="590.0" y="338" font-size="15" fill="#1b2a3a">reads shorter than ~20 bp after trimming are dropped</text>
<line x1="20" y1="390" x2="1100" y2="390" stroke="#d9dee3"/>
<text x="20" y="410" font-size="15" fill="#5b6b7a">Short fragments are the point of ATAC-seq (nucleosome-free DNA is &lt; 100 bp), so read-through is common: trim before aligning.</text>
</svg>