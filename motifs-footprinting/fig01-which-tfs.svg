<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 400" width="1120" height="400" font-family="Helvetica, Arial, sans-serif">
  <rect width="1120" height="400" fill="#ffffff"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/>
    </marker>
  </defs>
  <!-- Panel 1: differential peaks -->
  <text x="160" y="34" font-size="18" font-weight="bold" fill="#1b2a3a" text-anchor="middle">1. Differential peaks</text>
  <line x1="40" y1="330" x2="290" y2="330" stroke="#1b2a3a" stroke-width="2"/>
  <line x1="165" y1="330" x2="165" y2="70" stroke="#1b2a3a" stroke-width="2"/>
  <text x="165" y="356" font-size="15" fill="#1b2a3a" text-anchor="middle">log2 fold change (B / CD4 T)</text>
  <text x="26" y="200" font-size="15" fill="#1b2a3a" text-anchor="middle" transform="rotate(-90 26 200)">−log10 p</text>
  <g fill="#c8d0d8">
    <circle cx="150" cy="318" r="4"/><circle cx="172" cy="312" r="4"/><circle cx="160" cy="300" r="4"/><circle cx="178" cy="322" r="4"/>
    <circle cx="145" cy="305" r="4"/><circle cx="185" cy="296" r="4"/><circle cx="155" cy="288" r="4"/><circle cx="170" cy="292" r="4"/>
    <circle cx="140" cy="320" r="4"/><circle cx="190" cy="315" r="4"/><circle cx="165" cy="280" r="4"/><circle cx="133" cy="296" r="4"/>
  </g>
  <g fill="#2a6f97">
    <circle cx="225" cy="250" r="4"/><circle cx="240" cy="200" r="4"/><circle cx="252" cy="160" r="4"/><circle cx="232" cy="230" r="4"/>
    <circle cx="262" cy="120" r="4"/><circle cx="246" cy="180" r="4"/><circle cx="270" cy="140" r="4"/><circle cx="220" cy="270" r="4"/>
  </g>
  <g fill="#e67e22">
    <circle cx="105" cy="250" r="4"/><circle cx="92" cy="205" r="4"/><circle cx="80" cy="165" r="4"/><circle cx="98" cy="225" r="4"/>
    <circle cx="70" cy="128" r="4"/><circle cx="86" cy="185" r="4"/><circle cx="62" cy="150" r="4"/><circle cx="110" cy="272" r="4"/>
  </g>
  <text x="250" y="95" font-size="15" font-weight="bold" fill="#2a6f97" text-anchor="middle">B-up</text>
  <text x="80" y="95" font-size="15" font-weight="bold" fill="#e67e22" text-anchor="middle">T-up</text>

  <line x1="305" y1="200" x2="365" y2="200" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ar)"/>

  <!-- Panel 2: sequences -->
  <text x="560" y="34" font-size="18" font-weight="bold" fill="#1b2a3a" text-anchor="middle">2. Their DNA sequences</text>
  <g font-family="Courier New, monospace" font-size="16" fill="#5b6b7a">
    <text x="385" y="90">ACGT<tspan fill="#2a6f97" font-weight="bold">AAAGAGGAAGT</tspan>TGCAG</text>
    <text x="385" y="120">GG<tspan fill="#2a6f97" font-weight="bold">ATGCAAAT</tspan>ACTTAGCAC</text>
    <text x="385" y="150">TTAGCC<tspan fill="#2a6f97" font-weight="bold">AGAGGAAGT</tspan>GCAT</text>
    <text x="385" y="180">CAT<tspan fill="#2a6f97" font-weight="bold">GAAACTGAAA</tspan>CTTGAC</text>
    <text x="385" y="240">GA<tspan fill="#e67e22" font-weight="bold">TGTGGT</tspan>TTGCAGATTCA</text>
    <text x="385" y="270">CCTTGC<tspan fill="#e67e22" font-weight="bold">CTTTGAT</tspan>GTAGCA</text>
    <text x="385" y="300">AGT<tspan fill="#e67e22" font-weight="bold">ACCGGAAGT</tspan>GGATCC</text>
    <text x="385" y="330">TT<tspan fill="#e67e22" font-weight="bold">TGTGGT</tspan>CAGCTGGACA</text>
  </g>
  <text x="560" y="365" font-size="15" fill="#5b6b7a" text-anchor="middle">which short words occur more often than expected?</text>

  <line x1="735" y1="200" x2="795" y2="200" stroke="#1b2a3a" stroke-width="2.5" marker-end="url(#ar)"/>

  <!-- Panel 3: enriched motifs -->
  <text x="950" y="34" font-size="18" font-weight="bold" fill="#1b2a3a" text-anchor="middle">3. Enriched motifs → TFs</text>
  <rect x="815" y="62" width="270" height="130" rx="8" fill="#eaf1f7" stroke="#2a6f97" stroke-width="2"/>
  <text x="830" y="88" font-size="16" font-weight="bold" fill="#2a6f97">in B-up peaks</text>
  <text x="830" y="116" font-size="15" fill="#1b2a3a">PU.1 / SPIB (AAAGAGGAAGT)</text>
  <text x="830" y="140" font-size="15" fill="#1b2a3a">OCT2 (ATGCAAAT), IRF</text>
  <text x="830" y="164" font-size="15" fill="#1b2a3a">EBF (weakly), …</text>
  <rect x="815" y="212" width="270" height="130" rx="8" fill="#fdf1e6" stroke="#e67e22" stroke-width="2"/>
  <text x="830" y="238" font-size="16" font-weight="bold" fill="#e67e22">in T-up peaks</text>
  <text x="830" y="266" font-size="15" fill="#1b2a3a">RUNX (TGTGGT)</text>
  <text x="830" y="290" font-size="15" fill="#1b2a3a">ETS1 / GABPA (CCGGAAGT)</text>
  <text x="830" y="314" font-size="15" fill="#1b2a3a">TCF7 / LEF1, BCL11B, …</text>
</svg>
